<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- URL Web App ของคุณ -->
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxFrju7Ml8KoMQ6fEEr7V4Fy-u6bsvBWf8PAeBPqHpoEutHVTigMiJyjpzdbHIJ-zzL/exec';
    </script>
    
    <title>แก้ไขข้อมูลสถานี - สภ.พระธาตุช่อแฮ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- ดึงระบบความปลอดภัยและธีมมาใช้ -->
    <script src="auth.js"></script>
    <link rel="stylesheet" href="theme.css">

    <style>
        /* CSS เฉพาะการจัด Layout ของหน้านี้ */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 20px; }
        .full-width { grid-column: span 2; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } .form-card { padding: 25px; } }
        
        .form-group { display: flex; flex-direction: column; }
        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); backdrop-filter: blur(5px); border-radius: var(--radius-xl); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        .btn-group button { flex: 1; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="staff.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="page-title">ข้อมูลสถานีตำรวจ</div>
        </div>
    </nav>

    <div class="container container-sm">
        <div class="form-card">
            <div id="loading" class="loading-overlay">
                <i class="fa-solid fa-circle-notch loading-spinner"></i>
                <p style="color:var(--text-light); margin-top:10px;">กำลังโหลดข้อมูล...</p>
            </div>
            <form id="stationForm">
                <div class="form-grid">
                    <div class="form-group"><label class="form-label">ชื่อสถานีแบบเต็ม</label><input type="text" class="form-input" id="field0"></div>
                    <div class="form-group"><label class="form-label">ชื่อสถานีแบบย่อ</label><input type="text" class="form-input" id="field1"></div>
                    <div class="form-group"><label class="form-label">ตำแหน่งหัวหน้าสถานีแบบเต็ม</label><input type="text" class="form-input" id="field2"></div>
                    <div class="form-group"><label class="form-label">ตำแหน่งหัวหน้าสถานีแบบย่อ</label><input type="text" class="form-input" id="field3"></div>
                    <div class="form-group"><label class="form-label">ตำบล</label><input type="text" class="form-input" id="field4"></div>
                    <div class="form-group"><label class="form-label">อำเภอ</label><input type="text" class="form-input" id="field5"></div>
                    <div class="form-group"><label class="form-label">จังหวัด</label><input type="text" class="form-input" id="field6"></div>
                    <div class="form-group"><label class="form-label">รหัสไปรษณีย์</label><input type="number" class="form-input" id="field7"></div>
                    <div class="form-group full-width"><label class="form-label">หัวหนังสือราชการ</label><input type="text" class="form-input" id="field8"></div>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn-secondary" onclick="resetForm()">ยกเลิก</button>
                    <button type="button" class="btn-primary" id="btnSave" onclick="saveData()" disabled>บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let originalData = [];
        const inputs = document.querySelectorAll('.form-input');
        const btnSave = document.getElementById('btnSave');
        const loading = document.getElementById('loading');

        async function loadData() {
            try {
                const response = await fetch(API_URL + '?action=getStation');
                const data = await response.json();
                originalData = data;
                inputs.forEach((input, index) => { input.value = data[index] || ''; });
                loading.style.display = 'none';
            } catch (error) {
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลได้', 'error');
                loading.innerHTML = '<p style="color:var(--danger); font-weight:500;">โหลดข้อมูลไม่สำเร็จ</p>';
            }
        }

        function checkChanges() {
            let hasChange = false;
            inputs.forEach((input, index) => { if (input.value !== String(originalData[index] || '')) hasChange = true; });
            btnSave.disabled = !hasChange;
        }

        inputs.forEach(input => { input.addEventListener('input', checkChanges); });

        function resetForm() { 
            inputs.forEach((input, index) => { input.value = originalData[index] || ''; }); 
            checkChanges(); 
        }
        
        async function saveData() {
            btnSave.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> กำลังบันทึก...';
            btnSave.disabled = true;
            const newData = Array.from(inputs).map(input => input.value);
            
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'saveStation', data: newData })
                });
                originalData = [...newData];
                Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', timer: 2000, showConfirmButton: false });
                btnSave.innerHTML = 'บันทึก';
                checkChanges();
            } catch (error) {
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้', 'error');
                btnSave.innerHTML = 'บันทึก';
                btnSave.disabled = false;
            }
        }

        loadData();
    </script>
</body>
</html>
