<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - สภ.พระธาตุช่อแฮ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="auth.js"></script>
    
    <script>
        // ป้องกันคนล็อกอินแล้วเข้ามาหน้านี้ซ้ำ
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'staff.html';
        }
    </script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="../assets/theme.css">

    <style>
        body { justify-content: center; align-items: center; }
        
        .login-card { 
            padding: 60px 40px; 
            width: 90%; 
            max-width: 480px; 
            text-align: center; 
            cursor: default !important; 
        }
        
        .login-card:hover {
            transform: none !important;
            box-shadow: var(--shadow-soft) !important;
        }
        
        .login-card h2 { 
            color: var(--text-main); 
            margin-bottom: 15px; 
            font-weight: 600; 
            font-size: 2.2rem; 
        }
        
        .login-card p {
            font-size: 1.05rem; 
        }
        
        .back-link { display: inline-block; margin-top: 35px; color: var(--text-light); font-size: 1rem; transition: var(--transition); cursor: pointer; }
        .back-link:hover { color: var(--navy-main); transform: translateX(-5px); } 
        
        .google-btn-wrapper { 
            display: flex; 
            justify-content: center; 
            align-items: center;
            margin-top: 35px; 
            height: 44px; 
            width: 100%;
            animation: smoothRender 0.8s ease-in-out forwards;
            opacity: 0;
        }

        @keyframes smoothRender {
            0% { opacity: 0; }
            40% { opacity: 0; } 
            100% { opacity: 1; } 
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <h2>เข้าสู่ระบบ</h2>
        <p style="color: var(--text-light); margin-bottom: 10px;">สงวนสิทธิ์เฉพาะเจ้าหน้าที่ที่ได้รับอนุญาต</p>
        
        <div id="g_id_onload"
             data-client_id="298931412406-s91ak2nnd6hng8a225r1mkajq37m6hal.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="google-btn-wrapper" id="googleBtnWrapper">
            <div class="g_id_signin" 
                 data-type="standard" 
                 data-shape="pill" 
                 data-theme="outline" 
                 data-text="signin_with" 
                 data-size="large" 
                 data-logo_alignment="left"
                 data-width="300">
            </div>
        </div>

        <div id="loadingText" class="premium-loader-container" style="display: none; margin-top: 20px;">
            <div class="premium-loader"></div>
            <div class="premium-loader-text">กำลังตรวจสอบสิทธิ์...</div>
        </div>

        <a href="../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก</a>
    </div>

    <script>
        // ✨ แก้ไข: ลบ const AUTH_API_URL ออก เพราะ auth.js ประกาศไว้แล้ว
        // ใช้ AUTH_API_URL จาก auth.js ได้เลย

        async function handleCredentialResponse(response) {
            const token = response.credential; 
            
            document.getElementById('googleBtnWrapper').style.display = 'none';
            document.getElementById('loadingText').style.display = 'flex';

            try {
                const res = await fetch(AUTH_API_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'verifyUser', token: token })
                });
                const result = await res.json();
                
                if (result.status === 'success') {
                    // บันทึกข้อมูลลงเครื่อง
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userEmail', result.email);
                    localStorage.setItem('userRole', result.role);
                    localStorage.setItem('userName', result.name); 
                    
                    // แสดงข้อความต้อนรับ
                    Swal.fire({ 
                        icon: 'success', 
                        title: `ยินดีต้อนรับ, ${result.name}`, 
                        timer: 1500, 
                        showConfirmButton: false 
                    });
                    
                    // หน่วงเวลา 1.5 วินาทีให้ข้อความแสดงเสร็จก่อน แล้วค่อยเปลี่ยนหน้า
                    setTimeout(() => {
                        window.location.href = 'staff.html';
                    }, 1500);
                } else {
                    Swal.fire('ปฏิเสธการเข้าถึง', result.message, 'error');
                    document.getElementById('googleBtnWrapper').style.display = 'flex';
                    document.getElementById('loadingText').style.display = 'none';
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
                document.getElementById('googleBtnWrapper').style.display = 'flex';
                document.getElementById('loadingText').style.display = 'none';
            }
        }
    </script>
</body>
</html>
