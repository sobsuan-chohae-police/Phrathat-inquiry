<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- URL Web App ของคุณ -->
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxFrju7Ml8KoMQ6fEEr7V4Fy-u6bsvBWf8PAeBPqHpoEutHVTigMiJyjpzdbHIJ-zzL/exec';
    </script>
    
    <title>ข้อมูลเจ้าหน้าที่ - สภ.พระธาตุช่อแฮ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <!-- ✨ เพิ่มไลบรารีปฏิทิน Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>
    
    <!-- ดึงระบบความปลอดภัยและธีมมาใช้ -->
    <script src="../auth.js"></script>
    <link rel="stylesheet" href="../../theme.css">

    <style>
        /* CSS เฉพาะการจัด Layout ของหน้านี้ */
        .role-section { background: var(--card-bg); padding: 30px; border-radius: var(--radius-xl); box-shadow: var(--shadow-soft); margin-bottom: 30px; border: 1px solid rgba(0,0,0,0.05); }
        .role-row { margin-bottom: 20px; }
        .role-label { font-size: 0.95rem; color: var(--text-main); font-weight: 500; margin-bottom: 8px; display: block; }
        .role-select { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 12px; font-family: 'Kanit'; font-size: 1rem; color: var(--text-main); background: #fff; transition: var(--transition); -webkit-appearance: none; }
        .role-select:focus { border-color: var(--gold-main); outline: none; box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15); }
        
        .table-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-sort { background: #fff; border: 1px solid #e0e0e0; padding: 8px 20px; border-radius: 50px; font-family: 'Kanit'; font-size: 0.95rem; cursor: pointer; color: var(--text-main); transition: var(--transition); }
        .btn-sort:hover { background: #f1f5f9; }
        .btn-sort.active { background: var(--navy-main); color: white; border-color: var(--navy-main); }
        .drag-handle { cursor: grab; color: #94a3b8; font-size: 1.2rem; }
        .drag-handle:active { cursor: grabbing; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 5px; } 
        .form-group.full { grid-column: span 2; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } .form-group.full { grid-column: span 1; } }

        /* ตกแต่งปฏิทิน Flatpickr */
        .flatpickr-calendar { border-radius: 16px !important; box-shadow: 0 10px 30px rgba(0,0,0,0.1) !important; border: none !important; z-index: 99999 !important; }
        .flatpickr-day.selected { background: var(--navy-main) !important; border-color: var(--navy-main) !important; }
        .flatpickr-today-btn { text-align: center; padding: 12px; background: #f8fafc; cursor: pointer; font-family: 'Kanit'; font-size: 0.95rem; color: var(--navy-main); border-top: 1px solid #e2e8f0; font-weight: 500; border-radius: 0 0 16px 16px; }
        .flatpickr-today-btn:hover { background: #f1f5f9; }

        /* ✨ CSS เพิ่มเติม: ตกแต่งสีวันเสาร์-อาทิตย์ในปฏิทิน */
        span.flatpickr-weekday:nth-child(6) { color: #8b5cf6 !important; font-weight: 600; } 
        span.flatpickr-weekday:nth-child(7) { color: #ef4444 !important; font-weight: 600; } 

        .flatpickr-day:not(.prevMonthDay):not(.nextMonthDay):not(.selected):nth-child(7n+6) { color: #8b5cf6; font-weight: 500; }
        .flatpickr-day:not(.prevMonthDay):not(.nextMonthDay):not(.selected):nth-child(7n+7) { color: #ef4444; font-weight: 500; }

        .flatpickr-day.prevMonthDay:nth-child(7n+6), .flatpickr-day.nextMonthDay:nth-child(7n+6) { color: rgba(139, 92, 246, 0.4); }
        .flatpickr-day.prevMonthDay:nth-child(7n+7), .flatpickr-day.nextMonthDay:nth-child(7n+7) { color: rgba(239, 68, 68, 0.4); }
        
        .flatpickr-day.selected:nth-child(7n+6), .flatpickr-day.selected:nth-child(7n+7) { color: #ffffff !important; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="../staff.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="page-title">ข้อมูลเจ้าหน้าที่</div>
        </div>
    </nav>

    <div class="container">
        <div class="role-section">
            <div class="role-row">
                <label class="role-label"><i class="fa-solid fa-star" style="color:var(--warning); margin-right:5px;"></i> หัวหน้าสถานี</label>
                <select id="selectChiefStation" class="role-select"><option value="">-- เลือก --</option></select>
            </div>
            <div class="role-row">
                <label class="role-label"><i class="fa-solid fa-magnifying-glass" style="color:var(--primary); margin-right:5px;"></i> หัวหน้างานสอบสวน</label>
                <select id="selectChiefInvest" class="role-select"><option value="">-- เลือก --</option></select>
            </div>
            <button class="btn-primary" id="btnSaveRoles" onclick="confirmSaveRoles()" disabled style="margin-top: 10px;"><i class="fa-solid fa-save"></i> บันทึกการแก้ไขหัวหน้า</button>
        </div>

        <div class="table-header-row">
            <h3 style="color:var(--text-main); font-size:1.1rem; font-weight:600; margin:0;">รายชื่อเจ้าหน้าที่</h3>
            <button class="btn-sort" id="btnSort" onclick="toggleSortMode()"><i class="fa-solid fa-sort"></i> จัดเรียง</button>
        </div>

        <div class="table-responsive">
            <table id="officerTable">
                <thead>
                    <tr>
                        <th style="width: 80px; text-align: center;">จัดการ</th>
                        <th>ชื่อ-สกุล</th>
                        <th>ตำแหน่งย่อ</th>
                        <th>หน้าที่</th>
                        <th>โทรศัพท์</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" style="text-align:center; padding: 40px;">
                            <div class="premium-loader-container">
                                <div class="premium-loader"></div>
                                <div class="premium-loader-text">กำลังโหลดข้อมูล...</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <button class="fab" onclick="openModal('add')"><i class="fa-solid fa-plus"></i> เพิ่มเจ้าหน้าที่</button>

    <div id="officerModal" class="modal-overlay">
        <div class="modal-card modal-padded">
            <button class="close-modal-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="modalTitle" style="margin-top:0; color:var(--text-main); margin-bottom: 25px; font-weight:600;">เพิ่มเจ้าหน้าที่</h3>
            <form id="officerForm">
                <div class="form-grid">
                    <div class="form-group"><label class="form-label">ยศ</label><input type="text" class="form-input required" id="inpA"></div>
                    <div class="form-group"><label class="form-label">ยศเต็ม</label><input type="text" class="form-input required" id="inpB"></div>
                    <div class="form-group"><label class="form-label">ชื่อ</label><input type="text" class="form-input required" id="inpC"></div>
                    <div class="form-group"><label class="form-label">สกุล</label><input type="text" class="form-input required" id="inpD"></div>
                    <div class="form-group"><label class="form-label">ตำแหน่งย่อ</label><input type="text" class="form-input required" id="inpG"></div>
                    <div class="form-group"><label class="form-label">ตำแหน่งเต็ม</label><input type="text" class="form-input required" id="inpH"></div>
                    <div class="form-group full">
                        <label class="form-label">หน้าที่</label>
                        <select class="form-input required" id="inpI">
                            <option value="">-- เลือกหน้าที่ --</option>
                            <option value="พนักงานสอบสวน">พนักงานสอบสวน</option>
                            <option value="ผู้ช่วยพนักงานสอบสวน">ผู้ช่วยพนักงานสอบสวน</option>
                            <option value="เสมียนประจำวัน">เสมียนประจำวัน</option>
                        </select>
                    </div>
                    <div class="form-group full"><label class="form-label">โทรศัพท์</label><input type="text" class="form-input required" id="inpK"></div>
                    <div class="form-group"><label class="form-label">Email Police <small style="color:var(--text-light);">(ไม่บังคับ)</small></label><input type="text" class="form-input" id="inpL"></div>
                    <div class="form-group"><label class="form-label">Gmail <small style="color:var(--text-light);">(ไม่บังคับ)</small></label><input type="text" class="form-input" id="inpM"></div>
                    
                    <!-- ✨ ช่อง วัน เดือน ปีเกิด -->
                    <div class="form-group full">
                        <label class="form-label">วัน เดือน ปีเกิด</label>
                        <input type="text" class="form-input required datepicker" id="inpDOB" placeholder="เลือกวันเกิด">
                    </div>

                    <!-- ช่องเลือกระดับสิทธิ์ -->
                    <div class="form-group full">
                        <label class="form-label">สิทธิ์การใช้งานระบบ</label>
                        <select class="form-input required" id="inpRole">
                            <option value="เจ้าหน้าที่ทั่วไป">เจ้าหน้าที่ทั่วไป (Officer)</option>
                            <option value="ผู้ดูแลระบบ">ผู้ดูแลระบบ (Admin)</option>
                        </select>
                    </div>
                </div>
                <div style="display:flex; gap:15px; margin-top:25px;">
                    <button type="button" class="btn-secondary" style="flex:1;" onclick="closeModal()">ยกเลิก</button>
                    <button type="button" class="btn-primary" style="flex:1;" id="btnSave" disabled onclick="saveData()">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allOfficers = [];
        let currentMode = 'add';
        let editIndex = -1;
        let originalValues = {};
        let originalRoles = { station: "", invest: "" };
        let isSortMode = false;
        let sortableInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            initDatepickers();
            loadData();
        });

        // ✨ ฟังก์ชันปฏิทิน (ก๊อปปี้มาจากระบบเมาขับ)
        function initDatepickers() {
            flatpickr(".datepicker", {
                locale: "th",
                dateFormat: "j F Y",
                disableMobile: "true",
                onReady: function(selectedDates, dateStr, fp) {
                    addTodayButton(fp);
                    if (fp.currentYearElement && !fp.currentYearElement.hasAttribute('data-patched')) {
                        fp.currentYearElement.setAttribute('data-patched', 'true');
                        const originalSet = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
                        const originalGet = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').get;
                        Object.defineProperty(fp.currentYearElement, 'value', {
                            set: function(val) {
                                let year = parseInt(val, 10);
                                if (!isNaN(year) && year < 2400) { year += 543; }
                                originalSet.call(this, year);
                            },
                            get: function() { return originalGet.call(this); }
                        });
                        fp.currentYearElement.value = fp.currentYear;
                    }
                },
                onYearChange: function(selectedDates, dateStr, fp) {
                    if (fp.currentYear > 2400) { fp.changeYear(fp.currentYear - 543); }
                },
                formatDate: (date, format, locale) => {
                    const thaiYear = date.getFullYear() + 543;
                    return flatpickr.formatDate(date, format, locale).replace(date.getFullYear(), thaiYear);
                }
            });
        }

        function addTodayButton(fp) {
            const btn = document.createElement('div');
            btn.className = 'flatpickr-today-btn';
            btn.innerHTML = 'วันนี้';
            btn.addEventListener('click', () => { fp.setDate(new Date(), true); fp.close(); });
            fp.calendarContainer.appendChild(btn);
        }

        // ✨ ฟังก์ชันแปลงวันที่ไทยเป็น ค.ศ. ก่อนส่งไปหลังบ้าน
        function convertThaiDateToAD(thaiDateStr) {
            if (!thaiDateStr) return "";
            const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const parts = thaiDateStr.split(' ');
            if (parts.length !== 3) return "";
            const day = parts[0];
            const monthIndex = thaiMonths.indexOf(parts[1]);
            const thaiYear = parseInt(parts[2]);
            if (monthIndex === -1 || isNaN(thaiYear)) return "";
            const adYear = thaiYear - 543;
            return `${day}/${monthIndex + 1}/${adYear}`;
        }

        async function loadData() {
            try {
                const res = await fetch(API_URL + '?action=getOfficers');
                const json = await res.json();
                allOfficers = json.officers;
                renderTable(allOfficers);
                renderDropdowns(allOfficers, json.roles);
            } catch (err) { Swal.fire('Error', 'โหลดข้อมูลไม่สำเร็จ', 'error'); }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            if (data.length === 0) { 
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; color:var(--text-light);">ไม่พบข้อมูล</td></tr>'; 
                return; 
            }
            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.dataset.index = index; 
                let actionHtml = isSortMode ? `<i class="fa-solid fa-grip-lines drag-handle"></i>` : `<button class="action-btn btn-edit" onclick="openModal('edit', ${index})"><i class="fa-solid fa-pen"></i></button><button class="action-btn btn-delete" onclick="deleteItem(${index})"><i class="fa-solid fa-trash"></i></button>`;
                tr.innerHTML = `<td style="text-align:center;">${actionHtml}</td><td>${row[4]}</td><td>${row[6]}</td><td>${row[8]}</td><td>${row[10]}</td>`;
                tbody.appendChild(tr);
            });
        }

        function toggleSortMode() {
            isSortMode = !isSortMode;
            const btnSort = document.getElementById('btnSort');
            const tbody = document.getElementById('tableBody');
            if (isSortMode) {
                btnSort.classList.add('active'); 
                btnSort.innerHTML = '<i class="fa-solid fa-check"></i> บันทึกการจัดเรียง';
                renderTable(allOfficers); 
                sortableInstance = new Sortable(tbody, { handle: '.drag-handle', animation: 150 });
            } else { saveReorder(); }
        }

        async function saveReorder() {
            const btnSort = document.getElementById('btnSort');
            btnSort.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin" style="margin-right: 8px;"></i>กำลังบันทึก...';
            const rows = document.querySelectorAll('#tableBody tr');
            const newOrderData = [];
            rows.forEach(row => { newOrderData.push(allOfficers[row.dataset.index]); });

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'reorderOfficers', data: newOrderData })
                });
                allOfficers = newOrderData; isSortMode = false;
                btnSort.classList.remove('active'); 
                btnSort.innerHTML = '<i class="fa-solid fa-sort"></i> จัดเรียง';
                if (sortableInstance) sortableInstance.destroy();
                renderTable(allOfficers);
                Swal.fire({ icon: 'success', title: 'จัดเรียงเรียบร้อย', timer: 1500, showConfirmButton: false });
            } catch (err) { 
                Swal.fire('Error', 'จัดเรียงไม่สำเร็จ', 'error'); 
                isSortMode = false; 
                btnSort.classList.remove('active'); 
                btnSort.innerHTML = '<i class="fa-solid fa-sort"></i> จัดเรียง';
                renderTable(allOfficers); 
            }
        }

        function renderDropdowns(data, roles) {
            const selStation = document.getElementById('selectChiefStation');
            const selInvest = document.getElementById('selectChiefInvest');
            let options = '<option value="">-- เลือก --</option>';
            data.forEach(row => { options += `<option value="${row[4]}">${row[4]}</option>`; });
            selStation.innerHTML = options; selInvest.innerHTML = options;
            selStation.value = roles.chiefStation; selInvest.value = roles.chiefInvest;
            originalRoles = { station: roles.chiefStation, invest: roles.chiefInvest };
            checkRolesChange();
        }

        document.getElementById('selectChiefStation').addEventListener('change', checkRolesChange);
        document.getElementById('selectChiefInvest').addEventListener('change', checkRolesChange);

        function checkRolesChange() {
            const curStation = document.getElementById('selectChiefStation').value;
            const curInvest = document.getElementById('selectChiefInvest').value;
            document.getElementById('btnSaveRoles').disabled = !((curStation !== originalRoles.station) || (curInvest !== originalRoles.invest));
        }

        function confirmSaveRoles() {
            const chiefStation = document.getElementById('selectChiefStation').value;
            const chiefInvest = document.getElementById('selectChiefInvest').value;
            if (chiefStation && chiefStation === chiefInvest) return Swal.fire('ข้อผิดพลาด', 'หัวหน้าสถานีและหัวหน้างานสอบสวน ต้องไม่ใช่คนเดียวกัน', 'warning');
            Swal.fire({ title: 'ยืนยันการบันทึก?', showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก' }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'saveChiefs', chiefStation: chiefStation, chiefInvest: chiefInvest })
                        });
                        Swal.fire('สำเร็จ', 'บันทึกตำแหน่งเรียบร้อย', 'success'); setTimeout(loadData, 1000);
                    } catch (err) { Swal.fire('Error', 'บันทึกไม่สำเร็จ', 'error'); }
                }
            });
        }

        function openModal(mode, index) {
            currentMode = mode; editIndex = index;
            document.querySelectorAll('.form-input').forEach(inp => inp.value = '');
            if (document.getElementById('inpDOB')._flatpickr) document.getElementById('inpDOB')._flatpickr.clear();
            document.getElementById('btnSave').disabled = true;

            if (mode === 'edit') {
                document.getElementById('modalTitle').innerText = 'แก้ไขข้อมูลเจ้าหน้าที่';
                const d = allOfficers[index];
                document.getElementById('inpA').value = d[0]; document.getElementById('inpB').value = d[1];
                document.getElementById('inpC').value = d[2]; document.getElementById('inpD').value = d[3];
                document.getElementById('inpG').value = d[6]; document.getElementById('inpH').value = d[7];
                document.getElementById('inpI').value = d[8]; document.getElementById('inpK').value = d[10];
                document.getElementById('inpL').value = d[11]; document.getElementById('inpM').value = d[12];
                document.getElementById('inpRole').value = d[13] || 'เจ้าหน้าที่ทั่วไป'; 
                
                // ✨ ดึงข้อมูลวันเกิดมาแสดงในปฏิทิน (รองรับทั้งแบบ String และ ISO Date จาก Google Sheets)
                let formattedDOB = '';
                if (d[14]) {
                    let dateObj = null;
                    const dobStr = String(d[14]);
                    
                    if (dobStr.includes('/')) {
                        const parts = dobStr.split('/');
                        if (parts.length === 3) {
                            dateObj = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
                        }
                    } else {
                        dateObj = new Date(dobStr);
                    }

                    if (dateObj && !isNaN(dateObj.getTime())) {
                        if (document.getElementById('inpDOB')._flatpickr) {
                            document.getElementById('inpDOB')._flatpickr.setDate(dateObj);
                        }
                        // แปลงกลับเป็น D/M/YYYY เพื่อเก็บไว้เทียบค่า (Dirty Check)
                        formattedDOB = `${dateObj.getDate()}/${dateObj.getMonth() + 1}/${dateObj.getFullYear()}`;
                    } else {
                        formattedDOB = dobStr;
                    }
                }

                originalValues = { 
                    A: d[0], B: d[1], C: d[2], D: d[3], G: d[6], H: d[7], I: d[8], K: d[10], L: d[11], M: d[12], 
                    N: d[13] || 'เจ้าหน้าที่ทั่วไป', 
                    O: formattedDOB 
                };
            } else {
                document.getElementById('modalTitle').innerText = 'เพิ่มเจ้าหน้าที่';
                document.getElementById('inpRole').value = 'เจ้าหน้าที่ทั่วไป';
                originalValues = {};
            }
            document.getElementById('officerModal').style.display = 'flex';
            checkFormValidity();
        }

        function closeModal() { document.getElementById('officerModal').style.display = 'none'; }

        document.querySelectorAll('.form-input').forEach(inp => { inp.addEventListener('input', checkFormValidity); inp.addEventListener('change', checkFormValidity); });

        function checkFormValidity() {
            let isValid = true; let isChanged = false;
            document.querySelectorAll('.required').forEach(inp => { if (inp.value.trim() === '') isValid = false; });
            if (currentMode === 'edit') {
                const currentValues = {
                    A: document.getElementById('inpA').value, B: document.getElementById('inpB').value,
                    C: document.getElementById('inpC').value, D: document.getElementById('inpD').value,
                    G: document.getElementById('inpG').value, H: document.getElementById('inpH').value,
                    I: document.getElementById('inpI').value, K: document.getElementById('inpK').value,
                    L: document.getElementById('inpL').value, M: document.getElementById('inpM').value,
                    N: document.getElementById('inpRole').value,
                    O: convertThaiDateToAD(document.getElementById('inpDOB').value) // เช็คความเปลี่ยนแปลงของวันเกิด
                };
                if (JSON.stringify(currentValues) !== JSON.stringify(originalValues)) isChanged = true;
            } else { isChanged = true; }
            document.getElementById('btnSave').disabled = !(isValid && isChanged);
        }

        async function saveData() {
            const btn = document.getElementById('btnSave');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin" style="margin-right: 8px;"></i>กำลังบันทึก...'; 
            btn.disabled = true;
            
            // ส่งข้อมูลวันเกิด (แปลงเป็น ค.ศ. แล้ว) ไปด้วย
            const dataToSend = [
                document.getElementById('inpA').value, document.getElementById('inpB').value,
                document.getElementById('inpC').value, document.getElementById('inpD').value,
                document.getElementById('inpG').value, document.getElementById('inpH').value,
                document.getElementById('inpI').value, document.getElementById('inpK').value,
                document.getElementById('inpL').value, document.getElementById('inpM').value,
                document.getElementById('inpRole').value,
                convertThaiDateToAD(document.getElementById('inpDOB').value) 
            ];
            
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'saveOfficer', mode: currentMode, rowIndex: editIndex, data: dataToSend })
                });
                closeModal(); Swal.fire('สำเร็จ', 'บันทึกข้อมูลเรียบร้อย', 'success'); loadData();
            } catch (err) { Swal.fire('Error', 'บันทึกไม่สำเร็จ', 'error'); } 
            finally { btn.innerHTML = 'บันทึก'; }
        }

        function deleteItem(index) {
            Swal.fire({ title: 'ยืนยันการลบ?', showCancelButton: true, confirmButtonColor: '#e11d48', confirmButtonText: 'ลบเลย', cancelButtonText: 'ยกเลิก' }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'deleteOfficer', rowIndex: index })
                        });
                        Swal.fire('ลบแล้ว!', 'ข้อมูลถูกลบเรียบร้อย', 'success'); loadData();
                    } catch (err) { Swal.fire('Error', 'ลบไม่สำเร็จ', 'error'); }
                }
            });
        }
        
    </script>
</body>
</html>
