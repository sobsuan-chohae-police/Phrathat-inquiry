<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เบิกค่าตอบแทนพยาน</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>
    
    <!-- Authentication (Run first) -->
    <script src="../auth.js"></script>

    <!-- Theme & Global Styles -->
    <link rel="stylesheet" href="../../theme.css">

    <style>
        /* Base Animation Settings */
        .soft-scale { animation: softScaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes softScaleIn { from { transform: scale(0.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Navbar Specific Adjustments */
        nav { position: sticky; top: 0; z-index: 1000; }
        .ghost-balancer { width: 84px; height: 42px; visibility: hidden; pointer-events: none; }
        
        /* Content Layout */
        .page-container {
            display: flex; flex-direction: column;
            padding: 20px; width: 100%; max-width: 1400px; margin: 0 auto;
            flex: 1;
        }

        /* Sticky Table Layout */
        .table-card {
            display: flex; flex-direction: column;
            background: #fff; border-radius: var(--radius-xl); box-shadow: var(--shadow-soft);
            height: calc(100vh - 120px); overflow: hidden; position: relative;
        }
        
        /* Loading Overlay (Blocks only content) */
        .content-loader-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(5px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50; transition: opacity 0.3s;
        }

        /* Inner Scroll for Table Body */
        .table-header-container { background: #f8fafc; z-index: 10; border-bottom: 1px solid #e2e8f0; }
        .table-body-container { flex: 1; overflow-y: auto; overflow-x: auto; background: #fff; position: relative; }
        
        table { width: 100%; min-width: 1000px; border-collapse: collapse; }
        th, td { padding: 15px 20px; text-align: left; }
        th { font-weight: 600; color: var(--text-light); font-size: 0.95rem; white-space: nowrap; position: sticky; top: 0; background: #f8fafc; box-shadow: 0 1px 0 #e2e8f0; }
        td { font-size: 0.95rem; border-bottom: 1px solid #f1f5f9; color: var(--text-main); }
        tr:hover td { background-color: #f8fafc; }
        
        /* Pagination Animations */
        @keyframes slideLeft { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideRight { from { transform: translateX(-30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .slide-left { animation: slideLeft 0.35s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
        .slide-right { animation: slideRight 0.35s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }

        /* Toolbar */
        .table-toolbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: #fff; border-top: 1px solid #e2e8f0; z-index: 10;
        }
        .pagination-ctrl { display: flex; align-items: center; gap: 15px; }
        .page-info { font-weight: 500; color: var(--text-light); font-size: 0.95rem; }
        .page-btn {
            background: #f1f5f9; border: none; width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            color: var(--navy-main); transition: var(--transition);
        }
        .page-btn:hover:not(:disabled) { background: var(--navy-main); color: #fff; }
        .page-btn:disabled { color: #cbd5e1; cursor: not-allowed; background: #f8fafc; }
        
        .add-btn {
            background: var(--navy-gradient); color: #fff; border: none;
            padding: 10px 24px; border-radius: 50px; font-family: 'Kanit'; font-weight: 500;
            display: flex; align-items: center; gap: 8px; cursor: pointer; transition: var(--transition);
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.2);
        }
        .add-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-gold); }

        .doc-link { color: var(--navy-main); font-size: 1.2rem; transition: var(--transition); display: inline-flex; }
        .doc-link:hover { color: var(--gold-dark); transform: scale(1.15); }

        /* Form Modal Settings */
        .modal-body { padding: 25px 30px; overflow-y: auto; flex: 1; }
        .modal-footer {
            padding: 15px 30px; border-top: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;
        }
        .btn-group-left { display: flex; gap: 12px; }

        /* Tabs */
        .tabs-header { position: relative; display: flex; border-bottom: 1px solid #e2e8f0; padding: 0 30px; }
        .tab-btn {
            padding: 15px 25px; border: none; background: transparent; font-family: 'Kanit';
            font-size: 1.05rem; font-weight: 500; color: var(--text-light); cursor: pointer; transition: color 0.3s;
        }
        .tab-btn.active { color: var(--navy-main); }
        .tab-indicator {
            position: absolute; bottom: -1px; height: 3px; background: var(--navy-main);
            border-radius: 3px 3px 0 0; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .tab-content { display: none; animation: fadeUp 0.3s ease forwards; }
        .tab-content.active { display: block; }

        /* Form Grid Responsive */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .col-full { grid-column: 1 / -1; }
        .col-half-left { grid-column: 1 / 2; }
        .col-half-right { grid-column: 2 / 3; }
        
        .input-hint::placeholder { color: #cbd5e1; font-weight: 300; }

        /* Autocomplete Dropdown */
        .autocomplete-wrapper { position: relative; width: 100%; }
        .autocomplete-list {
            position: absolute; top: 100%; left: 0; right: 0; background: #fff;
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-height: 200px; overflow-y: auto; z-index: 100; margin-top: 5px;
            display: none; border: 1px solid #e2e8f0;
        }
        .autocomplete-item {
            padding: 10px 15px; cursor: pointer; font-size: 0.95rem; border-bottom: 1px solid #f8fafc;
        }
        .autocomplete-item:hover { background: #f1f5f9; color: var(--navy-main); }
        .autocomplete-item:last-child { border-bottom: none; }

        /* Action Buttons */
        .modal-action-bar { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 20; }
        .btn-trash { 
            background: #fff1f2; color: var(--danger); border: none; width: 36px; height: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition); font-size: 1.1rem;
        }
        .btn-trash:hover { background: var(--danger); color: white; transform: rotate(10deg); }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .col-half-left, .col-half-right { grid-column: 1 / -1; }
            .tabs-header { padding: 0 15px; }
            .tab-btn { padding: 12px 15px; font-size: 0.95rem; }
            .modal-body { padding: 20px 15px; }
            .modal-footer { padding: 15px; }
            .table-card { height: calc(100vh - 100px); }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            <a href="../staff.html" class="nav-btn btn-back">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <span class="page-title">เบิกค่าตอบแทนพยาน</span>
        </div>
        <div class="nav-right">
            <!-- Ghost element to balance layout -->
            <div class="ghost-balancer"></div>
        </div>
    </nav>

    <div class="page-container soft-scale">
        <div class="table-card">
            <!-- Loader Overlay -->
            <div class="content-loader-overlay" id="mainLoader">
                <div class="premium-loader"></div>
                <div class="premium-loader-text" style="margin-top: 15px;">กำลังโหลดข้อมูล...</div>
            </div>

            <!-- Table Header -->
            <div class="table-header-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px;"></th>
                            <th>วันที่สอบปากคำ</th>
                            <th>คดี</th>
                            <th>เลขคดี</th>
                            <th>ชื่อพยาน</th>
                            <th>ชื่อผู้ต้องหา</th>
                            <th>พนักงานสอบสวน</th>
                            <th style="text-align: center;">เอกสาร</th>
                        </tr>
                    </thead>
                </table>
            </div>

            <!-- Table Body (Scrollable) -->
            <div class="table-body-container">
                <table id="dataTable" style="margin-top: -46px;"> <!-- Offset header height for visual sync -->
                    <thead style="visibility: hidden;">
                        <tr>
                            <th style="width: 60px;"></th><th></th><th></th><th></th><th></th><th></th><th></th><th></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data rows injected here -->
                    </tbody>
                </table>
            </div>

            <!-- Toolbar -->
            <div class="table-toolbar">
                <button class="add-btn" onclick="openModal()"><i class="fa-solid fa-plus"></i> เพิ่มข้อมูล</button>
                <div class="pagination-ctrl">
                    <button class="page-btn" id="btnPrevPage" onclick="changePage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                    <span class="page-info" id="pageInfo">1 / 1</span>
                    <button class="page-btn" id="btnNextPage" onclick="changePage(1)"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="formModal" class="modal-overlay">
        <div class="modal-card" style="height: 90vh;">
            
            <div class="modal-action-bar">
                <button class="btn-trash" id="btnDelete" onclick="confirmDelete()" style="display: none;" data-tooltip="ลบข้อมูลรายการนี้" class="tooltip-left"><i class="fa-solid fa-trash-can"></i></button>
                <button class="close-modal-btn" onclick="closeModal()" style="position: static;"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchTab(0)" id="tabBtn0">ข้อมูลคดี</button>
                <button class="tab-btn" onclick="switchTab(1)" id="tabBtn1">ข้อมูลพยาน</button>
                <div class="tab-indicator" id="tabIndicator"></div>
            </div>

            <div class="modal-body">
                <!-- Tab 1: ข้อมูลคดี -->
                <div class="tab-content active" id="tabContent0">
                    <div class="form-grid">
                        <div class="col-half-left">
                            <label class="form-label">ประเภทคดี</label>
                            <select class="form-input form-field" id="caseType">
                                <option value="" disabled selected>เลือกประเภทคดี</option>
                                <option value="อาญา">อาญา</option>
                                <option value="จราจร">จราจร</option>
                            </select>
                        </div>
                        <div class="col-half-right">
                            <label class="form-label">เลขคดี</label>
                            <input type="text" class="form-input form-field input-hint" id="caseNumber" placeholder="XX/25XX" autocomplete="off">
                        </div>

                        <div class="col-full autocomplete-wrapper">
                            <label class="form-label">ชื่อผู้กล่าวหา</label>
                            <input type="text" class="form-input form-field" id="accuserName" placeholder="ระบุชื่อผู้กล่าวหา" autocomplete="off">
                            <div class="autocomplete-list" id="accuserDropdown"></div>
                        </div>

                        <div class="col-full autocomplete-wrapper">
                            <label class="form-label">ชื่อผู้ต้องหา</label>
                            <input type="text" class="form-input form-field" id="suspectName" placeholder="ระบุชื่อผู้ต้องหา" autocomplete="off">
                            <div class="autocomplete-list" id="suspectDropdown"></div>
                        </div>

                        <div class="col-half-left">
                            <label class="form-label">พนักงานสอบสวน</label>
                            <select class="form-input form-field" id="investigatorName">
                                <option value="" disabled selected>เลือกพนักงานสอบสวน</option>
                                <!-- Injected options -->
                            </select>
                        </div>
                        <div class="col-half-right">
                            <label class="form-label">วันที่สอบปากคำพยาน</label>
                            <input type="text" class="form-input form-field datepicker" id="witnessDate" placeholder="เลือกวันที่">
                        </div>

                        <div class="col-half-left">
                            <label class="form-label">ประจำวันข้อ</label>
                            <input type="text" class="form-input form-field" id="dailyReportNum" placeholder="ระบุตัวเลข" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        </div>
                        <div class="col-half-right">
                            <label class="form-label">เวลา</label>
                            <input type="text" class="form-input form-field input-hint" id="dailyReportTime" placeholder="XX.XX" autocomplete="off">
                        </div>
                    </div>
                </div>

                <!-- Tab 2: ข้อมูลพยาน -->
                <div class="tab-content" id="tabContent1">
                    <div class="form-grid">
                        <div class="col-full">
                            <label class="form-label">ประเภทพยาน</label>
                            <select class="form-input form-field" id="witnessType">
                                <option value="" disabled selected>เลือกประเภทพยาน</option>
                                <option value="ตำรวจ">ตำรวจ</option>
                                <option value="ประชาชน">ประชาชน</option>
                            </select>
                        </div>

                        <div class="col-half-left">
                            <label class="form-label">คำนำหน้าชื่อ</label>
                            <select class="form-input form-field" id="titleName" onchange="toggleCustomTitle()">
                                <option value="" disabled selected>เลือกคำนำหน้า</option>
                                <option value="นาย">นาย</option>
                                <option value="นาง">นาง</option>
                                <option value="นางสาว">นางสาว</option>
                                <option value="ระบุอื่นๆ">ระบุอื่นๆ</option>
                            </select>
                        </div>
                        <div class="col-half-right" id="customTitleWrapper" style="display: none;">
                            <label class="form-label">ระบุคำนำหน้า</label>
                            <input type="text" class="form-input" id="customTitleName" placeholder="ระบุคำนำหน้า" autocomplete="off">
                        </div>

                        <div class="col-half-left">
                            <label class="form-label">ชื่อ</label>
                            <input type="text" class="form-input form-field input-hint" id="firstName" placeholder="เฉพาะชื่อเท่านั้น" autocomplete="off">
                        </div>
                        <div class="col-half-right">
                            <label class="form-label">นามสกุล</label>
                            <input type="text" class="form-input form-field input-hint" id="lastName" placeholder="เฉพาะนามสกุลเท่านั้น" autocomplete="off">
                        </div>

                        <div class="col-half-left">
                            <label class="form-label">เลขประจำตัวประชาชน</label>
                            <input type="text" class="form-input form-field input-hint" id="idCard" placeholder="ไม่ต้องใส่ขีดระหว่างตัวเลข" oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value.length > 13) this.value = this.value.slice(0,13);" autocomplete="off">
                        </div>
                        <div class="col-half-right">
                            <label class="form-label">เขตที่พักอาศัย</label>
                            <select class="form-input form-field" id="residenceArea">
                                <option value="" disabled selected>เลือกเขตที่พักอาศัย</option>
                                <option value="ในเขตจังหวัด">ในเขตจังหวัด</option>
                                <option value="นอกเขตจังหวัด">นอกเขตจังหวัด</option>
                            </select>
                        </div>

                        <div class="col-half-left">
                            <label class="form-label">ที่อยู่พยาน</label>
                            <input type="text" class="form-input form-field" id="address" placeholder="ระบุที่อยู่" autocomplete="off">
                        </div>
                        <div class="col-half-right">
                            <label class="form-label">หมายเลขโทรศัพท์</label>
                            <input type="text" class="form-input form-field input-hint" id="phone" placeholder="ไม่ต้องใส่ขีดระหว่างตัวเลข" oninput="this.value = this.value.replace(/[^0-9]/g, '');" autocomplete="off">
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <div class="btn-group-left">
                    <button class="btn-secondary" id="btnBackTab" onclick="navigateTab(-1)" disabled>กลับ</button>
                    <button class="btn-secondary" id="btnNextTab" onclick="navigateTab(1)">ต่อไป</button>
                </div>
                <button class="btn-primary" id="btnSave" onclick="saveData()" disabled>บันทึก</button>
            </div>
        </div>
    </div>

    <script src="../../datepicker.js"></script>
    <script>
        // API Configurations
        const API_URL = 'https://script.google.com/macros/s/AKfycbwQgE82l4gmYJ3PtAutWa34Xv2bGREB2EbjSr51Y6gPS5eJoaoG6NQytyppi0PMcwMr/exec';
        
        // System State
        let currentData = [];
        let currentPage = 1;
        const ITEMS_PER_PAGE = 10;
        
        let currentTab = 0;
        let isEditMode = false;
        let currentEditId = null;
        let currentDocUrl = null;
        let originalFormData = {};

        // Auto-complete Datalists
        let uniqueAccusers = [];
        let uniqueSuspects = [];

        // Setup on Load
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            setupFormListeners();
        });

        async function initApp() {
            try {
                const response = await fetch(API_URL + '?action=getAllData');
                const result = await response.json();
                
                if(result.status === 'success') {
                    // Cache to sessionStorage
                    sessionStorage.setItem('witnesses', JSON.stringify(result.witnesses));
                    sessionStorage.setItem('officers', JSON.stringify(result.officers));
                    sessionStorage.setItem('station', JSON.stringify(result.station));
                    
                    prepareDropdowns();
                    loadDataToTable(true);
                    
                    document.getElementById('mainLoader').style.opacity = '0';
                    setTimeout(() => document.getElementById('mainLoader').style.display = 'none', 300);
                } else {
                    throw new Error(result.message || 'Unknown Error');
                }
            } catch (error) {
                console.error('Fetch Data Error:', error);
                document.getElementById('mainLoader').style.display = 'none';
                Swal.fire({
                    title: 'เกิดข้อผิดพลาด',
                    text: 'ไม่สามารถโหลดข้อมูลได้ โปรดลองใหม่อีกครั้ง',
                    icon: 'error',
                    confirmButtonText: 'ตกลง'
                });
            }
        }

        function prepareDropdowns() {
            const officers = JSON.parse(sessionStorage.getItem('officers') || '[]');
            const investigators = officers.filter(o => o[8] === 'พนักงานสอบสวน'); // I หน้าที่1
            
            const invSelect = document.getElementById('investigatorName');
            invSelect.innerHTML = '<option value="" disabled selected>เลือกพนักงานสอบสวน</option>';
            investigators.forEach(o => {
                const option = document.createElement('option');
                option.value = o[4]; // E ยศ ชื่อ สกุล
                option.textContent = o[4];
                invSelect.appendChild(option);
            });

            // Extract uniques for autocomplete
            const witnesses = JSON.parse(sessionStorage.getItem('witnesses') || '[]');
            uniqueAccusers = [...new Set(witnesses.map(w => w[2]).filter(Boolean))];
            uniqueSuspects = [...new Set(witnesses.map(w => w[3]).filter(Boolean))];

            setupAutocomplete(document.getElementById('accuserName'), document.getElementById('accuserDropdown'), uniqueAccusers);
            setupAutocomplete(document.getElementById('suspectName'), document.getElementById('suspectDropdown'), uniqueSuspects);
            
            ThaiDatePicker.init('.datepicker');
            updateTabIndicator();
        }

        function loadDataToTable(resetPage = false) {
            const rawData = JSON.parse(sessionStorage.getItem('witnesses') || '[]');
            // Sort: Newest (bottom of sheet) to top
            currentData = [...rawData].reverse();
            
            if (resetPage) currentPage = 1;
            renderTable();
        }

        function renderTable(direction = '') {
            const tbody = document.getElementById('tableBody');
            const totalPages = Math.ceil(currentData.length / ITEMS_PER_PAGE) || 1;
            
            if(currentPage > totalPages) currentPage = totalPages;
            if(currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const pageData = currentData.slice(startIndex, endIndex);

            // Apply animation class if direction provided
            tbody.className = ''; 
            if(direction) {
                void tbody.offsetWidth; // trigger reflow
                tbody.classList.add(direction === 'next' ? 'slide-left' : 'slide-right');
            }

            tbody.innerHTML = '';
            
            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-light); padding: 40px;">ไม่พบข้อมูล</td></tr>`;
            } else {
                pageData.forEach(row => {
                    const id = row[17];
                    const docUrl = row[16];
                    const rawDate = row[5];
                    const thaiDate = rawDate ? formatDateThai(rawDate) : '';
                    const fullName = `${row[9] || ''}${row[10] || ''} ${row[11] || ''}`.trim();

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="text-align: center;">
                            <button class="action-btn btn-edit" onclick="editData('${id}')" data-tooltip="แก้ไข" class="tooltip-right">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                        </td>
                        <td>${thaiDate}</td>
                        <td>${row[0] || '-'}</td>
                        <td>${row[1] || '-'}</td>
                        <td>${fullName || '-'}</td>
                        <td>${row[3] || '-'}</td>
                        <td>${row[4] || '-'}</td>
                        <td style="text-align: center;">
                            ${docUrl ? `<a href="${docUrl}" target="_blank" class="doc-link" data-tooltip="เปิดเอกสาร" class="tooltip-left"><i class="fa-solid fa-file-lines"></i></a>` : '-'}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Update Pagination UI
            document.getElementById('pageInfo').innerText = `${currentPage} / ${totalPages}`;
            document.getElementById('btnPrevPage').disabled = currentPage === 1;
            document.getElementById('btnNextPage').disabled = currentPage === totalPages;
        }

        function changePage(step) {
            const totalPages = Math.ceil(currentData.length / ITEMS_PER_PAGE);
            if((step === -1 && currentPage === 1) || (step === 1 && currentPage === totalPages)) return;
            
            currentPage += step;
            renderTable(step === 1 ? 'next' : 'prev');
        }

        function formatDateThai(isoString) {
            if (!isoString) return '';
            const parts = isoString.split('-');
            if (parts.length !== 3) return isoString;
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]) - 1;
            const day = parseInt(parts[2]);
            
            const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            return `${day} ${thaiMonths[month]} ${year + 543}`;
        }

        function openModal() {
            isEditMode = false;
            currentEditId = null;
            currentDocUrl = null;
            originalFormData = {};
            
            document.querySelectorAll('.form-field').forEach(el => el.value = '');
            document.getElementById('customTitleName').value = '';
            document.getElementById('customTitleWrapper').style.display = 'none';
            ThaiDatePicker.clear('witnessDate');
            
            document.getElementById('btnDelete').style.display = 'none';
            document.getElementById('btnSave').disabled = true;
            
            switchTab(0);
            document.getElementById('formModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('formModal').style.display = 'none';
        }

        function toggleCustomTitle() {
            const val = document.getElementById('titleName').value;
            const wrapper = document.getElementById('customTitleWrapper');
            if (val === 'ระบุอื่นๆ') {
                wrapper.style.display = 'block';
                document.getElementById('customTitleName').classList.add('form-field');
            } else {
                wrapper.style.display = 'none';
                document.getElementById('customTitleName').classList.remove('form-field');
                document.getElementById('customTitleName').value = '';
            }
            checkFormValidity();
        }

        // --- Tabs Logic ---
        function switchTab(index) {
            currentTab = index;
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.tab-content').forEach((content, i) => {
                content.classList.toggle('active', i === index);
            });
            
            document.getElementById('btnBackTab').disabled = (index === 0);
            document.getElementById('btnNextTab').disabled = (index === 1);
            
            updateTabIndicator();
            
            // Scroll to top of modal body on change
            document.querySelector('.modal-body').scrollTop = 0;
        }

        function navigateTab(step) {
            const newIndex = currentTab + step;
            if(newIndex >= 0 && newIndex <= 1) switchTab(newIndex);
        }

        function updateTabIndicator() {
            const indicator = document.getElementById('tabIndicator');
            const activeBtn = document.querySelectorAll('.tab-btn')[currentTab];
            if(activeBtn && indicator) {
                indicator.style.width = activeBtn.offsetWidth + 'px';
                indicator.style.left = activeBtn.offsetLeft + 'px';
            }
        }
        window.addEventListener('resize', updateTabIndicator);

        function setupFormListeners() {
            const fields = document.querySelectorAll('.form-field, #customTitleName');
            fields.forEach(field => {
                field.addEventListener('input', checkFormValidity);
                field.addEventListener('change', checkFormValidity);
            });
            
            // Listen to flatpickr custom update
            const dateInput = document.getElementById('witnessDate');
            if(dateInput) dateInput.addEventListener('change', checkFormValidity);
        }

        function checkFormValidity() {
            // Must fill all visible fields with class .form-field
            let isValid = true;
            document.querySelectorAll('.form-field').forEach(field => {
                // Skip invisible custom title if not "ระบุอื่นๆ"
                if(field.id === 'customTitleName' && document.getElementById('titleName').value !== 'ระบุอื่นๆ') return;
                
                if (!field.value || field.value.trim() === '') {
                    isValid = false;
                }
            });

            const btnSave = document.getElementById('btnSave');
            
            if (isValid) {
                if (isEditMode) {
                    // Check if anything changed
                    const currentValues = getCurrentFormValues();
                    const hasChanged = Object.keys(currentValues).some(key => currentValues[key] !== originalFormData[key]);
                    btnSave.disabled = !hasChanged;
                } else {
                    btnSave.disabled = false;
                }
            } else {
                btnSave.disabled = true;
            }
        }

        function getCurrentFormValues() {
            const customTitle = document.getElementById('titleName').value === 'ระบุอื่นๆ' 
                ? document.getElementById('customTitleName').value 
                : document.getElementById('titleName').value;

            return {
                caseType: document.getElementById('caseType').value,
                caseNum: document.getElementById('caseNumber').value,
                accuser: document.getElementById('accuserName').value,
                suspect: document.getElementById('suspectName').value,
                investigator: document.getElementById('investigatorName').value,
                date: ThaiDatePicker.getISODate('witnessDate'),
                reportNum: document.getElementById('dailyReportNum').value,
                reportTime: document.getElementById('dailyReportTime').value,
                witnessType: document.getElementById('witnessType').value,
                title: customTitle,
                fname: document.getElementById('firstName').value,
                lname: document.getElementById('lastName').value,
                idCard: document.getElementById('idCard').value,
                area: document.getElementById('residenceArea').value,
                addr: document.getElementById('address').value,
                phone: document.getElementById('phone').value
            };
        }

        function setupAutocomplete(inputEl, dropdownEl, dataList) {
            let currentFocus = -1;
            
            inputEl.addEventListener('input', function() {
                const val = this.value.trim();
                dropdownEl.innerHTML = '';
                if (!val) { dropdownEl.style.display = 'none'; return; }
                
                const matches = dataList.filter(item => item.toLowerCase().includes(val.toLowerCase()));
                if(matches.length === 0) { dropdownEl.style.display = 'none'; return; }
                
                matches.forEach((match, index) => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    div.innerHTML = match.replace(new RegExp(val, "gi"), (match) => `<strong>${match}</strong>`);
                    div.addEventListener('click', () => {
                        inputEl.value = match;
                        dropdownEl.style.display = 'none';
                        checkFormValidity();
                    });
                    dropdownEl.appendChild(div);
                });
                dropdownEl.style.display = 'block';
            });
            
            inputEl.addEventListener('focus', function() {
                if(!this.value && dataList.length > 0) {
                    dropdownEl.innerHTML = '';
                    dataList.slice(0, 100).forEach(item => { // Limit initial view
                        const div = document.createElement('div');
                        div.className = 'autocomplete-item';
                        div.textContent = item;
                        div.addEventListener('click', () => {
                            inputEl.value = item;
                            dropdownEl.style.display = 'none';
                            checkFormValidity();
                        });
                        dropdownEl.appendChild(div);
                    });
                    dropdownEl.style.display = 'block';
                }
            });
            
            document.addEventListener('click', (e) => {
                if(e.target !== inputEl && e.target !== dropdownEl) {
                    dropdownEl.style.display = 'none';
                }
            });
        }

        function editData(id) {
            const rawData = JSON.parse(sessionStorage.getItem('witnesses') || '[]');
            const row = rawData.find(r => String(r[17]) === String(id));
            if (!row) return;

            isEditMode = true;
            currentEditId = id;
            currentDocUrl = row[16];

            document.getElementById('caseType').value = row[0];
            document.getElementById('caseNumber').value = row[1];
            document.getElementById('accuserName').value = row[2];
            document.getElementById('suspectName').value = row[3];
            document.getElementById('investigatorName').value = row[4];
            ThaiDatePicker.setISODate('witnessDate', row[5]);
            document.getElementById('dailyReportNum').value = row[6];
            document.getElementById('dailyReportTime').value = row[7];
            document.getElementById('witnessType').value = row[8];
            
            // Handle Title
            const presetTitles = ['นาย', 'นาง', 'นางสาว'];
            if (presetTitles.includes(row[9])) {
                document.getElementById('titleName').value = row[9];
                document.getElementById('customTitleWrapper').style.display = 'none';
                document.getElementById('customTitleName').classList.remove('form-field');
            } else {
                document.getElementById('titleName').value = 'ระบุอื่นๆ';
                document.getElementById('customTitleWrapper').style.display = 'block';
                document.getElementById('customTitleName').classList.add('form-field');
                document.getElementById('customTitleName').value = row[9];
            }
            
            document.getElementById('firstName').value = row[10];
            document.getElementById('lastName').value = row[11];
            document.getElementById('idCard').value = row[12];
            document.getElementById('residenceArea').value = row[13];
            document.getElementById('address').value = row[14];
            document.getElementById('phone').value = row[15];

            originalFormData = getCurrentFormValues();
            
            document.getElementById('btnDelete').style.display = 'flex';
            document.getElementById('btnSave').disabled = true; // disabled until changed
            
            switchTab(0);
            document.getElementById('formModal').style.display = 'flex';
        }

        async function saveData() {
            const vals = getCurrentFormValues();
            
            // Master Object Creation
            const id = isEditMode ? currentEditId : Date.now().toString();
            
            // Data array strictly 16 items for A-P columns
            const sheetRow = [
                vals.caseType, vals.caseNum, vals.accuser, vals.suspect, vals.investigator,
                vals.date, vals.reportNum, vals.reportTime, vals.witnessType, vals.title,
                vals.fname, vals.lname, vals.idCard, vals.area, vals.addr, vals.phone
            ];

            const thaiDateText = formatDateThai(vals.date);
            const isInArea = vals.area === 'ในเขตจังหวัด';
            
            // Officers Lookup
            const officers = JSON.parse(sessionStorage.getItem('officers') || '[]');
            
            // Helper function to find officer by duty
            const findOffByDuty = (duty) => {
                const off = officers.find(o => o[9] === duty); // J หน้าที่2
                return off ? { rank: off[0], name: off[2]+' '+off[3], pos: off[6] } : { rank:'', name:'', pos:'' };
            };
            
            // Find Investigator specific info
            const invOff = officers.find(o => o[4] === vals.investigator) || [];
            
            const headInvestigator = findOffByDuty('หัวหน้างานสอบสวน');
            const headAdmin = findOffByDuty('หัวหน้างานอำนวยการ');
            const headStation = findOffByDuty('หัวหน้าสถานี');
            const financeOfficer = findOffByDuty('เจ้าหน้าที่การเงิน');

            const placeholders = {
                '<<ID>>': id,
                '<<ประเภทคดี>>': vals.caseType,
                '<<เลขคดี>>': vals.caseNum,
                '<<ชื่อผู้กล่าวหา>>': vals.accuser,
                '<<ชื่อผู้ต้องหา>>': vals.suspect,
                '<<วันที่ไทย>>': thaiDateText,
                '<<ประจำวันข้อ>>': vals.reportNum,
                '<<เวลา>>': vals.reportTime,
                '<<คำนำหน้า>>': vals.title,
                '<<ชื่อสกุลพยาน>>': `${vals.fname} ${vals.lname}`,
                '<<เลขประจำตัวประชาชน>>': vals.idCard,
                '<<ที่อยู่พยาน>>': vals.addr,
                '<<ใน>>': isInArea ? '(✓)' : '(   )',
                '<<นอก>>': isInArea ? '(   )' : '(✓)',
                '<<ค่าตอบแทน>>': isInArea ? '300' : '600',
                '<<ตัวหนังสือค่าตอบแทน>>': isInArea ? 'สามร้อยบาทถ้วน' : 'หกร้อยบาทถ้วน',
                
                '<<ยศ พงส>>': invOff[0] || '',
                '<<ชื่อสกุล พงส>>': (invOff[2] || '') + ' ' + (invOff[3] || ''),
                '<<ตำแหน่ง พงส>>': invOff[6] || '',
                
                '<<ยศหัวหน้างาน>>': headInvestigator.rank,
                '<<ชื่อสกุลหัวหน้างาน>>': headInvestigator.name,
                '<<ตำแหน่งหัวหน้างาน>>': headInvestigator.pos,
                
                '<<ยศผู้ตรวจสอบ>>': headAdmin.rank,
                '<<ชื่อสกุลผู้ตรวจสอบ>>': headAdmin.name,
                '<<ตำแหน่งผู้ตรวจสอบ>>': headAdmin.pos,
                
                '<<ยศผู้อนุมัติ>>': headStation.rank,
                '<<ชื่อสกุลผู้อนุมัติ>>': headStation.name,
                '<<ตำแหน่งผู้อนุมัติ>>': headStation.pos,
                
                '<<ยศผู้จ่ายเงิน>>': financeOfficer.rank,
                '<<ชื่อสกุลผู้จ่ายเงิน>>': financeOfficer.name
            };

            const payload = {
                action: isEditMode ? 'updateData' : 'saveData',
                data: {
                    placeholders: placeholders,
                    sheetRow: sheetRow,
                    oldUrl: isEditMode ? currentDocUrl : null
                }
            };

            Swal.fire({
                title: isEditMode ? 'กำลังบันทึกและสร้างเอกสารใหม่...' : 'กำลังบันทึกข้อมูลและสร้างเอกสาร...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    // Update Local SessionStorage
                    let witnesses = JSON.parse(sessionStorage.getItem('witnesses') || '[]');
                    
                    const finalRow = [...sheetRow, result.url, id];
                    
                    if (isEditMode) {
                        const idx = witnesses.findIndex(r => String(r[17]) === String(id));
                        if(idx > -1) witnesses[idx] = finalRow;
                    } else {
                        witnesses.push(finalRow);
                    }
                    
                    sessionStorage.setItem('witnesses', JSON.stringify(witnesses));
                    
                    // Cleanup & UI
                    closeModal();
                    loadDataToTable(true); // reload table to page 1
                    
                    Swal.fire({
                        title: 'เสร็จสมบูรณ์',
                        text: isEditMode ? 'อัพเดทข้อมูลและสร้างเอกสารสำเร็จ' : 'บันทึกข้อมูลและสร้างเอกสารใหม่สำเร็จ',
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false
                    });
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error(error);
                Swal.fire('เกิดข้อผิดพลาด', 'โปรดลองใหม่อีกครั้ง หรือติดต่อผู้ดูแลระบบ', 'error');
            }
        }

        function confirmDelete() {
            Swal.fire({
                title: 'ยืนยันการลบข้อมูล',
                text: 'คุณต้องการลบข้อมูลนี้ใช่หรือไม่?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'ลบข้อมูล',
                cancelButtonText: 'ยกเลิก',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    executeDelete();
                }
            });
        }

        async function executeDelete() {
            Swal.fire({
                title: 'กำลังลบข้อมูล...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const payload = {
                    action: 'deleteData',
                    data: {
                        id: currentEditId,
                        url: currentDocUrl
                    }
                };
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if(result.status === 'success') {
                    let witnesses = JSON.parse(sessionStorage.getItem('witnesses') || '[]');
                    witnesses = witnesses.filter(r => String(r[17]) !== String(currentEditId));
                    sessionStorage.setItem('witnesses', JSON.stringify(witnesses));
                    
                    closeModal();
                    loadDataToTable(false); // retain current page if possible
                    
                    Swal.fire({
                        title: 'ลบข้อมูลสำเร็จ',
                        icon: 'success',
                        timer: 1500,
                        showConfirmButton: false
                    });
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error(error);
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถลบข้อมูลได้ โปรดลองใหม่อีกครั้ง', 'error');
            }
        }
    </script>
