<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เบิกค่าตอบแทนพยาน</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>
    
    <!-- Core Scripts & Styles (Relative Paths) -->
    <script src="../auth.js"></script>
    <script src="../../assets/datepicker.js"></script>
    <link rel="stylesheet" href="../../assets/theme.css">

    <style>
        /* ==========================================================================
           UI/UX & Animations
           ========================================================================== */

        /* Navbar */
        .nav-btn { 
            background: #f1f5f9; border: none; font-size: 1.1rem; color: var(--text-light); 
            cursor: pointer; width: 42px; height: 42px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            transition: var(--transition); text-decoration: none; flex-shrink: 0; 
        }
        .btn-back {
            background: transparent !important; 
            color: var(--text-main);
            font-size: 1.3rem; 
            width: auto; 
            height: auto;
            padding: 5px 15px 5px 0; 
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-back i { transition: var(--transition); }
        .btn-back:hover { color: var(--navy-main); }
        .btn-back:hover i { transform: translateX(-5px) scaleX(1.1); }
        .nav-left { flex: 1; display: flex; align-items: center; }
        
        .btn-add-nav { background: #e2e8f0 !important; color: #365f70 !important; border: none !important; }
        .btn-add-nav i { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .btn-add-nav:hover { background: #365f70 !important; color: white !important; transform: none !important; box-shadow: 0 6px 15px rgba(54, 95, 112, 0.4) !important; }
        .btn-add-nav:hover i { transform: scale(1.3); }

        .btn-police-nav {
            background: #e2e8f0; color: #365f70; border: none;
            height: 42px; padding: 0 16px; border-radius: 50px;
            display: inline-flex; align-items: center; gap: 8px;
            font-family: inherit; font-size: 0.92rem; font-weight: 500;
            cursor: pointer; transition: var(--transition); flex-shrink: 0;
        }
        .btn-police-nav:hover {
            background: #365f70; color: white;
            box-shadow: 0 6px 15px rgba(54, 95, 112, 0.35);
        }
        @media (max-width: 576px) {
            .btn-police-nav { padding: 0 12px; font-size: 0.85rem; }
        }
        
        /* Dropdown Styles */
        .dropdown-container { position: relative; display: inline-block; }
        @keyframes fadeDown { from { opacity: 0; transform: scaleY(0.8); } to { opacity: 1; transform: scaleY(1); } }
        .dropdown-menu {
            display: none; position: absolute; top: 100%; right: 0;
            background: white; min-width: 180px;
            border-radius: 16px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
            padding: 8px; flex-direction: column; gap: 4px;
            z-index: 1000; transform-origin: top right; border: 1px solid #f1f5f9;
            margin-top: 8px;
        }
        .dropdown-menu.show { display: flex; animation: fadeDown 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .dropdown-item {
            padding: 10px 15px; border-radius: 8px; color: var(--text-main);
            text-decoration: none; display: flex; align-items: center;
            font-size: 0.95rem; font-weight: 500; transition: var(--transition);
            background: transparent; border: none; cursor: pointer;
            width: 100%; text-align: left; font-family: inherit;
        }
        .dropdown-item i {
            margin-right: 12px; color: var(--text-light); font-size: 1.1rem;
            transition: var(--transition); width: 20px; text-align: center;
        }
        
        /* Colored Actions */
        .dropdown-item.action-blue { color: var(--navy-main); }
        .dropdown-item.action-blue i { color: var(--navy-main); }
        .dropdown-item.action-blue:hover { background: var(--navy-main); color: white; transform: translateX(4px); }
        .dropdown-item.action-blue:hover i { color: white; }

        .dropdown-item.action-green { color: #10b981; }
        .dropdown-item.action-green i { color: #10b981; }
        .dropdown-item.action-green:hover { background: #10b981; color: white; transform: translateX(4px); }
        .dropdown-item.action-green:hover i { color: white; }

        .dropdown-item.action-red { color: var(--danger); }
        .dropdown-item.action-red i { color: var(--danger); }
        .dropdown-item.action-red:hover { background: var(--danger); color: white; transform: translateX(4px); }
        .dropdown-item.action-red:hover i { color: white; }
        
        .dropdown-item:not(.action-blue):not(.action-green):not(.action-red):hover { background: #f8fafc; color: var(--navy-main); transform: translateX(4px); }
        .dropdown-item:not(.action-blue):not(.action-green):not(.action-red):hover i { color: var(--navy-main); }
        
        /* Row Menu Button */
        .btn-row-menu {
            background: #e2e8f0; color: #365f70; border: none;
            width: 32px; height: 32px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1rem; cursor: pointer; transition: var(--transition);
        }
        .btn-row-menu:hover, .btn-row-menu.active {
            background: #365f70; color: white;
            transform: scale(1.15); box-shadow: 0 4px 10px rgba(54, 95, 112, 0.3);
        }

        /* Modern Loading Animation */
        .modern-wave-loader {
            display: flex; gap: 6px; justify-content: center; align-items: center; height: 40px; margin-bottom: 10px;
        }
        .modern-wave-loader .bar {
            width: 5px; height: 12px; border-radius: 4px;
            background: var(--navy-main);
            animation: elegantWave 1.2s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
        }
        .modern-wave-loader .bar:nth-child(2) { animation-delay: 0.1s; background: var(--gold-main); }
        .modern-wave-loader .bar:nth-child(3) { animation-delay: 0.2s; background: #10b981; }
        .modern-wave-loader .bar:nth-child(4) { animation-delay: 0.3s; background: var(--navy-main); }
        
        @keyframes elegantWave {
            0%, 100% { height: 12px; opacity: 0.4; }
            50% { height: 32px; opacity: 1; transform: translateY(-4px); }
        }
        
        .doc-link { color: var(--navy-main); font-size: 1.2rem; transition: var(--transition); }
        .doc-link:hover { color: var(--gold-main); transform: scale(1.1); }

        /* Table Toolbar (Search & Pagination) */
        .table-toolbar {
            display: flex; justify-content: space-between; align-items: center;
            gap: 15px; flex-wrap: wrap;
            padding-bottom: 16px;
            margin-top: -10px;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 380px;
            min-width: 240px;
        }
        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.95rem;
            pointer-events: none;
        }
        .search-input {
            width: 100%;
            padding: 10px 38px 10px 42px;
            border-radius: 50px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: var(--transition);
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
            box-sizing: border-box;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--navy-main);
            box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.08);
        }
        .search-input::placeholder { color: #94a3b8; font-weight: 300; }
        .btn-clear-search {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: #f1f5f9;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: var(--transition);
        }
        .btn-clear-search:hover {
            background: #e2e8f0;
            color: var(--danger);
        }

        .pagination-controls { display: flex; align-items: center; gap: 15px; margin-left: auto; }
        .page-info { font-size: 0.95rem; color: var(--text-light); font-weight: 500; }
        .btn-page {
            background: #f1f5f9; border: none; width: 36px; height: 36px; border-radius: 50%;
            color: var(--text-main); cursor: pointer; transition: var(--transition);
        }
        .btn-page:hover:not(:disabled) { background: var(--gold-main); color: white; }
        .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ==========================================================================
           Modal & Form
           ========================================================================== */
        .modal-card { max-width: 700px; height: 85vh; max-height: 800px; padding: 0; }
        .modal-header-area { padding: 25px 30px 0; border-bottom: 1px solid #e2e8f0; }
        .modal-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title-row h3 { font-size: 1.3rem; font-weight: 600; color: var(--navy-main); margin: 0; }
        
        .modal-actions { display: flex; gap: 10px; }
        .btn-close-modal { background: #f1f5f9; color: var(--text-light); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: var(--transition); }
        .btn-close-modal:hover { background: var(--danger); color: white; transform: scale(1.15); }

        /* Tabs */
        .tabs-container { display: flex; position: relative; gap: 30px; }
        .tab-btn {
            background: none; border: none; font-family: inherit; font-size: 1.05rem; font-weight: 500;
            color: var(--text-light); padding: 10px 5px; cursor: pointer; transition: color 0.3s;
        }
        .tab-btn.active { color: var(--navy-main); }
        .tab-indicator {
            position: absolute; bottom: -1px; left: 0; height: 3px; background: var(--gold-main);
            border-radius: 3px 3px 0 0; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            will-change: left, width;
        }

        /* Form Body */
        .modal-body { padding: 25px 30px; overflow-y: auto; flex: 1; }
        .tab-content { display: none; animation: fadeUp 0.4s ease; }
        .tab-content.active { display: block; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group.full-width { grid-column: 1 / -1; }
        
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; gap: 15px; }
            .modal-card { height: 95vh; width: 100%; border-radius: 20px 20px 0 0; margin-top: auto; }
            .modal-header-area, .modal-body { padding: 20px; }
            .search-box { max-width: 100%; width: 100%; }
        }

        /* Form Inputs */
        .form-input { background: #f8fafc; border: 1px solid #e2e8f0; }
        .form-input:focus { background: #fff; border-color: var(--navy-main); box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.1); }
        .form-input::placeholder { color: #cbd5e1; font-weight: 300; }

        /* Police Selector Box in Tab 2 */
        .police-pull-box {
            background: #f0f9ff;
            border: 1px dashed #7dd3fc;
            border-radius: 14px;
            padding: 14px 16px;
            animation: fadeDown 0.25s ease;
            transition: all 0.3s ease;
        }
        .police-pull-box.pulled {
            background: #f0fdf4;
            border-color: #86efac;
        }
        .police-pull-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .police-pull-header label {
            margin: 0;
            color: #0369a1;
            font-weight: 500;
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .police-applied-badge {
            display: none;
            align-items: center;
            gap: 4px;
            background: #dcfce7;
            color: #15803d;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 2px 9px;
            border-radius: 20px;
        }
        .police-applied-badge.show {
            display: inline-flex;
        }
        .btn-manage-inline {
            background: none;
            border: none;
            color: var(--navy-main);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: underline;
            padding: 2px 6px;
        }
        .btn-manage-inline:hover { color: #0284c7; }
        
        /* Autocomplete */
        .autocomplete-wrapper { position: relative; }
        .autocomplete-list {
            position: absolute; top: 100%; left: 0; right: 0; background: #fff;
            border: 1px solid #e2e8f0; border-radius: 12px; margin-top: 5px;
            box-shadow: var(--shadow-modal); max-height: 200px; overflow-y: auto;
            z-index: 100; display: none;
        }
        .autocomplete-item { padding: 12px 16px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid #f1f5f9; }
        .autocomplete-item:hover { background: #f8fafc; color: var(--navy-main); }

        /* Modal Footer */
        .modal-footer {
            padding: 20px 30px; border-top: 1px solid #e2e8f0; background: #fff;
            display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 var(--radius-xl) var(--radius-xl);
        }
        .footer-left { display: flex; gap: 10px; }
        
        button:disabled { opacity: 0.5 !important; cursor: not-allowed !important; transform: none !important; box-shadow: none !important; background: #e2e8f0 !important; color: #94a3b8 !important; }

        /* ==========================================================================
           Police Witness Management Modal
           ========================================================================== */
        .police-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .police-form-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
            animation: fadeDown 0.25s ease;
        }
        .police-form-card.show { display: block; }
        .police-form-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--navy-main);
            margin: 0 0 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .police-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .police-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
        }
        .police-card:hover {
            border-color: #cbd5e1;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
        }
        .police-card-info { flex: 1; min-width: 0; }
        .police-card-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .zone-badge {
            font-size: 0.75rem;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 20px;
            background: #e0f2fe;
            color: #0369a1;
        }
        .zone-badge.out {
            background: #fef3c7;
            color: #b45309;
        }
        .police-card-meta {
            font-size: 0.85rem;
            color: var(--text-light);
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
        }
        .police-card-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-icon-sm {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: var(--transition);
        }
        .btn-icon-edit { background: #ecfdf5; color: #10b981; }
        .btn-icon-edit:hover { background: #10b981; color: white; transform: scale(1.1); }
        .btn-icon-del { background: #fff1f2; color: var(--danger); }
        .btn-icon-del:hover { background: var(--danger); color: white; transform: scale(1.1); }
        .empty-police-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
            background: #f8fafc;
            border-radius: 14px;
            border: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="nav-left">
            <a href="../staff.html" class="btn-back">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <span class="page-title">เบิกค่าตอบแทนพยาน</span>
        </div>
        <div class="nav-right">
            <button class="btn-police-nav" onclick="openPoliceModal()">
                <i class="fa-solid fa-user-shield"></i>
                <span>ข้อมูลพยานตำรวจ</span>
            </button>
            <button class="nav-btn btn-add-nav tooltip-right" onclick="openModal()" data-tooltip="เพิ่มข้อมูล">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        
        <!-- Toolbar (Search & Pagination) -->
        <div class="table-toolbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="ค้นหา เลขคดี, ชื่อพยาน, ผู้ต้องหา, พงส...." oninput="handleSearchInput()" onkeydown="if(event.key==='Enter'){ event.preventDefault(); executeSearch(); }">
                <button type="button" id="btnClearSearch" class="btn-clear-search" onclick="clearSearch()" title="ล้างการค้นหา" style="display: none;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="pagination-controls">
                <button class="btn-page" id="btnPrevPage" onclick="changePage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <span class="page-info" id="pageInfo">หน้า 1 / 1</span>
                <button class="btn-page" id="btnNextPage" onclick="changePage(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-card">
            <div class="table-responsive">
                <table id="dataTable">
                    <thead style="display: none;">
                        <tr>
                            <th style="width: 60px; text-align: center;">จัดการ</th>
                            <th>วันที่สอบปากคำ</th>
                            <th>คดี</th>
                            <th>เลขคดี</th>
                            <th>ชื่อพยาน</th>
                            <th>ชื่อผู้ต้องหา</th>
                            <th>พนักงานสอบสวน</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="7" style="text-align:center; padding:60px 20px;">
                                <div class="modern-wave-loader">
                                    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                                </div>
                                <div class="premium-loader-text" style="color: var(--text-light); font-size: 0.95rem;">กำลังโหลดข้อมูลพยาน...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Form (เบิกค่าตอบแทนพยาน) -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-card">
            
            <!-- Modal Header -->
            <div class="modal-header-area">
                <div class="modal-title-row">
                    <h3 id="modalTitle">เพิ่มข้อมูลใหม่</h3>
                    <div class="modal-actions">
                        <button class="btn-close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
                
                <!-- Tabs -->
                <div class="tabs-container">
                    <button class="tab-btn active" onclick="switchTab(1)" id="tabBtn1">ข้อมูลคดี</button>
                    <button class="tab-btn" onclick="switchTab(2)" id="tabBtn2">ข้อมูลพยาน</button>
                    <div class="tab-indicator" id="tabIndicator"></div>
                </div>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <form id="mainForm">
                    
                    <!-- Tab 1: ข้อมูลคดี -->
                    <div class="tab-content active" id="tab1">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">ประเภทคดี</label>
                                <select class="form-input" id="caseType" required>
                                    <option value="" disabled selected>เลือกประเภท</option>
                                    <option value="อาญา">อาญา</option>
                                    <option value="จราจร">จราจร</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">เลขคดี</label>
                                <input type="text" class="form-input" id="caseNo" placeholder="XX/25XX" required>
                            </div>
                            
                            <div class="form-group full-width autocomplete-wrapper">
                                <label class="form-label">ชื่อผู้กล่าวหา</label>
                                <input type="text" class="form-input" id="accuser" placeholder="พิมพ์เพื่อค้นหาหรือเพิ่มใหม่" required autocomplete="off">
                                <div class="autocomplete-list" id="accuserList"></div>
                            </div>
                            
                            <div class="form-group full-width autocomplete-wrapper">
                                <label class="form-label">ชื่อผู้ต้องหา</label>
                                <input type="text" class="form-input" id="suspect" placeholder="พิมพ์เพื่อค้นหาหรือเพิ่มใหม่" required autocomplete="off">
                                <div class="autocomplete-list" id="suspectList"></div>
                            </div>

                            <div class="form-group full-width">

    <script>
        // ==========================================================================
        // CONFIG & STATE
        // ==========================================================================
        // ⚠️ สำคัญ: เปลี่ยน URL นี้เป็น Web App URL ล่าสุดหลังจาก Deploy หลังบ้านใหม่
        const API_URL = 'https://script.google.com/macros/s/AKfycbycuS5nABfycyQMpi3FzAJdX9Dyah9XCYWJO-32fczZqMU9uzE9-reFZdgt1wyzF9DI/exec';
        
        let allData = [];
        let currentPage = 1;
        let totalPages = 1;
        let currentSearch = '';
        let searchTimeout = null;
        
        let editMode = false;
        let currentEditRowIndex = -1;
        let originalDataStr = ""; 
        let currentTab = 1;

        // ข้อมูลสำหรับ Autocomplete & พยานตำรวจ
        let autocompleteData = {
            accusers: [],
            suspects: []
        };
        let policeWitnesses = [];
        let editingPoliceId = null;

        // ==========================================================================
        // HELPERS
        // ==========================================================================
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPhone(rawPhone) {
            let phoneStr = rawPhone ? rawPhone.toString() : "";
            phoneStr = phoneStr.replace(/^'/, '').trim();
            if (phoneStr.match(/^[1-9]\d{7,8}$/)) {
                phoneStr = "0" + phoneStr;
            }
            return phoneStr;
        }

        // ==========================================================================
        // DROPDOWN LOGIC
        // ==========================================================================
        let activeDropdown = null;
        let activeDropdownBtn = null;

        function toggleRowDropdown(event, index) {
            event.stopPropagation();
            const dropdown = document.getElementById(`rowDropdown-${index}`);
            const btn = event.currentTarget;
            
            if (activeDropdown && activeDropdown !== dropdown) {
                activeDropdown.classList.remove('show');
                if (activeDropdownBtn) activeDropdownBtn.classList.remove('active');
            }
            
            dropdown.classList.toggle('show');
            btn.classList.toggle('active');
            
            if (dropdown.classList.contains('show')) {
                activeDropdown = dropdown;
                activeDropdownBtn = btn;
                
                const rect = btn.getBoundingClientRect();
                dropdown.style.position = 'fixed';
                dropdown.style.marginTop = '0';
                
                let dropdownHeight = dropdown.offsetHeight;
                if (dropdownHeight === 0) dropdownHeight = 160; 

                if (rect.bottom + dropdownHeight + 10 > window.innerHeight) {
                    dropdown.style.top = `${rect.top - dropdownHeight - 8}px`;
                    dropdown.style.transformOrigin = 'bottom left';
                } else {
                    dropdown.style.top = `${rect.bottom + 8}px`;
                    dropdown.style.transformOrigin = 'top left';
                }
                
                dropdown.style.left = `${rect.left}px`;
                dropdown.style.right = 'auto';
            } else {
                activeDropdown = null;
                activeDropdownBtn = null;
            }
        }

        window.addEventListener('click', function() {
            if (activeDropdown) {
                activeDropdown.classList.remove('show');
                if (activeDropdownBtn) activeDropdownBtn.classList.remove('active');
                activeDropdown = null;
                activeDropdownBtn = null;
            }
        });

        window.addEventListener('scroll', function() {
            if (activeDropdown) {
                activeDropdown.classList.remove('show');
                if (activeDropdownBtn) activeDropdownBtn.classList.remove('active');
                activeDropdown = null;
                activeDropdownBtn = null;
            }
        }, true);

        // ==========================================================================
        // INITIALIZATION
        // ==========================================================================
        document.addEventListener('DOMContentLoaded', () => {
            ThaiDatePicker.init('#witnessDate');
            
            const inputs = document.querySelectorAll('#mainForm input, #mainForm select');
            inputs.forEach(input => {
                input.addEventListener('input', checkFormChanges);
                input.addEventListener('change', checkFormChanges);
            });

            setupAutocomplete('accuser', 'accuserList', 'accusers');
            setupAutocomplete('suspect', 'suspectList', 'suspects');

            loadTable(1);
            loadOptions();
        });

        // ==========================================================================
        // SEARCH LOGIC
        // ==========================================================================
        function handleSearchInput() {
            const val = document.getElementById('searchInput').value;
            document.getElementById('btnClearSearch').style.display = val.length > 0 ? 'flex' : 'none';
            
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                executeSearch();
            }, 500);
        }

        function executeSearch() {
            clearTimeout(searchTimeout);
            const val = document.getElementById('searchInput').value.trim();
            if (val !== currentSearch) {
                currentSearch = val;
                loadTable(1);
            }
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('btnClearSearch').style.display = 'none';
            if (currentSearch !== '') {
                currentSearch = '';
                loadTable(1);
            }
        }

        // ==========================================================================
        // REQUEST 1: โหลดข้อมูลตาราง (Server-side Pagination + Search)
        // ==========================================================================
        async function loadTable(page) {
            const tbody = document.getElementById('tableBody');
            const thead = document.querySelector('#dataTable thead');
            thead.style.display = 'none';
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:60px 20px; border-radius: var(--radius-xl);"><div class="modern-wave-loader"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><div class="premium-loader-text" style="color: var(--text-light); font-size: 0.95rem;">กำลังโหลดข้อมูลพยาน...</div></td></tr>';
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getData', page: page, search: currentSearch })
                });
                const json = await response.json();
                if (json.status === 'error') throw new Error(json.message);
                
                allData = json.data;
                renderTable(allData);
                updatePagination(page, json.total);
                
            } catch (e) {
                console.error("loadTable error:", e);
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--danger); border-radius: var(--radius-xl);">โหลดข้อมูลไม่สำเร็จ: ${escapeHtml(e.message || 'ไม่ทราบสาเหตุ')}</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            const thead = document.querySelector('#dataTable thead');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                thead.style.display = 'table-header-group';
                const emptyMsg = currentSearch ? `ไม่พบข้อมูลที่ตรงกับ "${escapeHtml(currentSearch)}"` : 'ไม่มีข้อมูล';
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-light); padding: 30px;">${emptyMsg}</td></tr>`;
                return;
            }
            
            thead.style.display = 'table-header-group';
            
            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                
                let docAction = '';
                if (row.display.docUrl) {
                    docAction = `<button class="dropdown-item action-blue" onclick="window.open('${escapeHtml(row.display.docUrl)}', '_blank')"><i class="fa-solid fa-file-lines"></i> เปิดเอกสาร</button>`;
                } else {
                    docAction = `<button class="dropdown-item action-blue" disabled style="opacity: 0.5; cursor: not-allowed;"><i class="fa-solid fa-file-lines"></i> ไม่มีเอกสาร</button>`;
                }

                tr.innerHTML = `
                    <td style="text-align: center; overflow: visible;">
                        <div class="dropdown-container">
                            <button class="btn-row-menu" onclick="toggleRowDropdown(event, ${index})"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                            <div class="dropdown-menu" id="rowDropdown-${index}" style="left: 0; right: auto; transform-origin: top left; margin-left: 10px;">
                                ${docAction}
                                <button class="dropdown-item action-green" onclick="editData(${index})"><i class="fa-solid fa-pen"></i> แก้ไขข้อมูล</button>
                                <button class="dropdown-item action-red" onclick="deleteData(${index})"><i class="fa-solid fa-trash-can"></i> ลบข้อมูล</button>
                            </div>
                        </div>
                    </td>
                    <td>${escapeHtml(row.display.date)}</td>
                    <td>${escapeHtml(row.display.caseType)}</td>
                    <td>${escapeHtml(row.display.caseNo)}</td>
                    <td>${escapeHtml(row.display.witnessName)}</td>
                    <td>${escapeHtml(row.display.suspect)}</td>
                    <td>${escapeHtml(row.display.investigator)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updatePagination(page, total) {
            currentPage = page;
            totalPages = Math.ceil(total / 10) || 1;
            document.getElementById('pageInfo').innerText = `${page} / ${totalPages}`;
            document.getElementById('btnPrevPage').disabled = page === 1;
            document.getElementById('btnNextPage').disabled = page === totalPages || totalPages === 0;
        }

        function changePage(step) {
            const newPage = currentPage + step;
            if (newPage >= 1 && newPage <= totalPages) {
                loadTable(newPage);
            }
        }

        // ==========================================================================
        // REQUEST 2: โหลดข้อมูลตัวเลือก (Dropdown, Autocomplete & พยานตำรวจ)
        // ==========================================================================
        async function loadOptions() {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getOptions' })
                });
                const json = await res.json();
                if (json.status === 'error') throw new Error(json.message);
                
                // 1. เติม Dropdown พนักงานสอบสวน
                const select = document.getElementById('investigator');
                const currentInv = select.value;
                select.innerHTML = '<option value="" disabled selected>เลือกพนักงานสอบสวน</option>';
                json.officers.forEach(off => {
                    const option = document.createElement('option');
                    option.value = off;
                    option.textContent = off;
                    select.appendChild(option);
                });
                if (currentInv) select.value = currentInv;

                // 2. เก็บข้อมูล Autocomplete
                autocompleteData.accusers = json.accusers || [];
                autocompleteData.suspects = json.suspects || [];

                // 3. เก็บข้อมูลพยานตำรวจที่บันทึกไว้ล่วงหน้า
                policeWitnesses = json.policeWitnesses || [];
                populateSavedPoliceSelect();
                renderPoliceList();
                
            } catch (e) {
                console.error('Failed to load options:', e);
                Swal.fire({ toast: true, position: 'top-end', icon: 'error', title: 'โหลดข้อมูลตัวเลือกบางส่วนไม่สำเร็จ', text: e.message, showConfirmButton: false, timer: 4000 });
            }
        }

        function populateSavedPoliceSelect() {
            const select = document.getElementById('savedPoliceSelect');
            const prevVal = select.value;
            select.innerHTML = '<option value="">-- เลือกรายชื่อพยานตำรวจเพื่อกรอกข้อมูลอัตโนมัติ --</option>';
            
            policeWitnesses.forEach(pw => {
                const option = document.createElement('option');
                option.value = pw.id;
                option.textContent = `${pw.titleName}${pw.firstName} ${pw.lastName} (${pw.zone})`;
                select.appendChild(option);
            });
            
            if (prevVal && policeWitnesses.some(pw => pw.id === prevVal)) {
                select.value = prevVal;
            }
        }

        function setupAutocomplete(inputId, listId, dataKey) {
            const input = document.getElementById(inputId);
            const list = document.getElementById(listId);
            
            input.addEventListener('focus', () => showList(input.value));
            input.addEventListener('input', () => showList(input.value));
            input.addEventListener('blur', () => setTimeout(() => list.style.display = 'none', 200));
            
            function showList(query) {
                const sourceData = autocompleteData[dataKey] || [];
                const filtered = sourceData.filter(val => val.toLowerCase().includes(query.toLowerCase()));
                
                list.innerHTML = '';
                if (filtered.length > 0) {
                    filtered.forEach(val => {
                        const div = document.createElement('div');
                        div.className = 'autocomplete-item';
                        div.textContent = val;
                        div.onmousedown = () => {
                            input.value = val;
                            list.style.display = 'none';
                            checkFormChanges();
                        };
                        list.appendChild(div);
                    });
                    list.style.display = 'block';
                } else {
                    list.style.display = 'none';
                }
            }
        }

        // ==========================================================================
        // POLICE WITNESS SELECTION IN MAIN FORM
        // ==========================================================================
        function resetPolicePullIndicator() {
            document.getElementById('policeSelectorGroup').classList.remove('pulled');
            document.getElementById('policeAppliedBadge').classList.remove('show');
        }

        function handleWitnessTypeChange() {
            const type = document.getElementById('witnessType').value;
            const selectorGroup = document.getElementById('policeSelectorGroup');
            
            if (type === 'ตำรวจ') {
                selectorGroup.style.display = 'block';
            } else {
                selectorGroup.style.display = 'none';
                document.getElementById('savedPoliceSelect').value = '';
                resetPolicePullIndicator();
            }
            checkFormChanges();
        }

        function applyPoliceWitness() {
            const selectedId = document.getElementById('savedPoliceSelect').value;
            if (!selectedId) {
                resetPolicePullIndicator();
                return;
            }

            const pw = policeWitnesses.find(item => item.id === selectedId);
            if (!pw) return;

            if (['นาย', 'นาง', 'นางสาว'].includes(pw.titleName)) {
                document.getElementById('titleName').value = pw.titleName;
                document.getElementById('otherTitle').value = '';
            } else {
                document.getElementById('titleName').value = 'ระบุอื่นๆ';
                document.getElementById('otherTitle').value = pw.titleName;
            }
            toggleOtherTitle();

            document.getElementById('firstName').value = pw.firstName || '';
            document.getElementById('lastName').value = pw.lastName || '';
            document.getElementById('idCard').value = pw.idCard || '';
            document.getElementById('zone').value = pw.zone || '';
            document.getElementById('address').value = pw.address || '';
            document.getElementById('phone').value = formatPhone(pw.phone);

            document.getElementById('policeSelectorGroup').classList.add('pulled');
            document.getElementById('policeAppliedBadge').classList.add('show');

            checkFormChanges();
        }

        // ==========================================================================
        // POLICE WITNESS MANAGEMENT MODAL (CRUD)
        // ==========================================================================
        function openPoliceModal() {
            if (activeDropdown) {
                activeDropdown.classList.remove('show');
                if (activeDropdownBtn) activeDropdownBtn.classList.remove('active');
                activeDropdown = null;
                activeDropdownBtn = null;
            }
            document.getElementById('policeSearchInput').value = '';
            closePoliceForm();
            renderPoliceList();
            document.getElementById('policeModal').style.display = 'flex';
        }

        function closePoliceModal() {
            document.getElementById('policeModal').style.display = 'none';
            closePoliceForm();
        }

        function openPoliceForm(pwId = null) {
            const card = document.getElementById('policeFormCard');
            const titleEl = document.getElementById('policeFormTitle');
            document.getElementById('policeForm').reset();

            if (pwId) {
                const pw = policeWitnesses.find(item => item.id === pwId);
                if (!pw) return;
                editingPoliceId = pw.id;
                titleEl.innerText = 'แก้ไขข้อมูลพยานตำรวจ';
                document.getElementById('pwTitle').value = pw.titleName;
                document.getElementById('pwFirstName').value = pw.firstName;
                document.getElementById('pwLastName').value = pw.lastName;
                document.getElementById('pwIdCard').value = pw.idCard;
                document.getElementById('pwZone').value = pw.zone;
                document.getElementById('pwAddress').value = pw.address;
                document.getElementById('pwPhone').value = formatPhone(pw.phone);
            } else {
                editingPoliceId = null;
                titleEl.innerText = 'เพิ่มพยานตำรวจใหม่';
            }

            card.classList.add('show');
            document.getElementById('pwTitle').focus();
        }

        function closePoliceForm() {
            editingPoliceId = null;
            document.getElementById('policeFormCard').classList.remove('show');
            document.getElementById('policeForm').reset();
        }

        function renderPoliceList() {
            const container = document.getElementById('policeListContainer');
            const query = (document.getElementById('policeSearchInput').value || '').trim().toLowerCase();

            const filtered = policeWitnesses.filter(pw => {
                const full = `${pw.titleName}${pw.firstName} ${pw.lastName} ${pw.idCard} ${pw.phone}`.toLowerCase();
                return full.includes(query);
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-police-state">
                        <i class="fa-solid fa-user-shield" style="font-size: 2rem; color: #94a3b8; margin-bottom: 8px; display: block;"></i>
                        ${query ? 'ไม่พบรายชื่อพยานตำรวจที่ค้นหา' : 'ยังไม่มีข้อมูลพยานตำรวจที่บันทึกไว้ กดปุ่ม "+ เพิ่มพยานตำรวจ" เพื่อเริ่มบันทึก'}
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(pw => {
                const isOut = pw.zone === 'นอกเขตจังหวัด';
                return `
                    <div class="police-card">
                        <div class="police-card-info">
                            <div class="police-card-name">
                                <span>${escapeHtml(pw.titleName)}${escapeHtml(pw.firstName)} ${escapeHtml(pw.lastName)}</span>
                                <span class="zone-badge ${isOut ? 'out' : ''}">${escapeHtml(pw.zone)}</span>
                            </div>
                            <div class="police-card-meta">
                                <span><i class="fa-regular fa-id-card"></i> ${escapeHtml(pw.idCard)}</span>
                                <span><i class="fa-solid fa-phone"></i> ${escapeHtml(formatPhone(pw.phone))}</span>
                                <span><i class="fa-solid fa-location-dot"></i> ${escapeHtml(pw.address)}</span>
                            </div>
                        </div>
                        <div class="police-card-actions">
                            <button type="button" class="btn-icon-sm btn-icon-edit" title="แก้ไข" onclick="openPoliceForm('${escapeHtml(pw.id)}')">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button type="button" class="btn-icon-sm btn-icon-del" title="ลบ" onclick="deletePoliceWitness('${escapeHtml(pw.id)}')">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function savePoliceWitness(event) {
            event.preventDefault();
            const formData = {
                id: editingPoliceId,
                titleName: document.getElementById('pwTitle').value.trim(),
                firstName: document.getElementById('pwFirstName').value.trim(),
                lastName: document.getElementById('pwLastName').value.trim(),
                idCard: document.getElementById('pwIdCard').value.trim(),
                zone: document.getElementById('pwZone').value,
                address: document.getElementById('pwAddress').value.trim(),
                phone: document.getElementById('pwPhone').value.trim()
            };

            showLoading('กำลังบันทึกข้อมูลพยานตำรวจ...');
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'savePoliceWitness',
                        mode: editingPoliceId ? 'edit' : 'add',
                        formData: formData
                    })
                });
                const json = await res.json();
                if (json.status !== 'success') throw new Error(json.message);

                policeWitnesses = json.policeWitnesses || [];
                populateSavedPoliceSelect();
                renderPoliceList();
                closePoliceForm();

                Swal.fire({
                    icon: 'success',
                    title: 'สำเร็จ',
                    text: 'บันทึกข้อมูลพยานตำรวจเรียบร้อยแล้ว',
                    timer: 1500,
                    showConfirmButton: false
                });
            } catch (e) {
                Swal.fire('ข้อผิดพลาด', e.message || 'บันทึกข้อมูลไม่สำเร็จ', 'error');
            }
        }

        function deletePoliceWitness(id) {
            const pw = policeWitnesses.find(item => item.id === id);
            const name = pw ? `${pw.titleName}${pw.firstName} ${pw.lastName}` : 'รายการนี้';

            Swal.fire({
                title: 'ยืนยันการลบพยานตำรวจ',
                text: `ต้องการลบ "${name}" ออกจากรายชื่อที่บันทึกไว้หรือไม่?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'ลบข้อมูล',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#e11d48',
                reverseButtons: true
            }).then(async (result) => {
                if (!result.isConfirmed) return;
                showLoading('กำลังลบข้อมูลพยานตำรวจ...');
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'deletePoliceWitness', id: id })
                    });
                    const json = await res.json();
                    if (json.status !== 'success') throw new Error(json.message);

                    policeWitnesses = json.policeWitnesses || [];
                    populateSavedPoliceSelect();
                    renderPoliceList();

                    Swal.fire({
                        icon: 'success',
                        title: 'ลบเรียบร้อยแล้ว',
                        timer: 1500,
                        showConfirmButton: false
                    });
                } catch (e) {
                    Swal.fire('ข้อผิดพลาด', e.message || 'ลบข้อมูลไม่สำเร็จ', 'error');
                }
            });
        }

        // ==========================================================================
        // MODAL & TABS LOGIC (MAIN FORM)
        // ==========================================================================
        function openModal() {
            editMode = false;
            currentEditRowIndex = -1;
            document.getElementById('mainForm').reset();
            ThaiDatePicker.clear('witnessDate');
            document.getElementById('policeSelectorGroup').style.display = 'none';
            document.getElementById('savedPoliceSelect').value = '';
            resetPolicePullIndicator();
            toggleOtherTitle();
            
            document.getElementById('modalTitle').innerText = 'เพิ่มข้อมูลใหม่';
            
            switchTab(1);
            document.getElementById('formModal').style.display = 'flex';
            checkFormChanges();
        }

        function closeModal() {
            document.getElementById('formModal').style.display = 'none';
        }

        function switchTab(tabIndex) {
            currentTab = tabIndex;
            document.getElementById('tab1').classList.toggle('active', tabIndex === 1);
            document.getElementById('tab2').classList.toggle('active', tabIndex === 2);
            
            const btn1 = document.getElementById('tabBtn1');
            const btn2 = document.getElementById('tabBtn2');
            btn1.classList.toggle('active', tabIndex === 1);
            btn2.classList.toggle('active', tabIndex === 2);
            
            const activeBtn = tabIndex === 1 ? btn1 : btn2;
            const indicator = document.getElementById('tabIndicator');
            indicator.style.width = `${activeBtn.offsetWidth}px`;
            indicator.style.left = `${activeBtn.offsetLeft}px`;
            
            document.getElementById('btnBack').disabled = (tabIndex === 1);
            document.getElementById('btnNext').disabled = (tabIndex === 2);
            document.querySelector('#formModal .modal-body').scrollTop = 0;
        }

        // ==========================================================================
        // FORM LOGIC & CHANGE DETECTION
        // ==========================================================================
        function toggleOtherTitle() {
            const title = document.getElementById('titleName').value;
            const otherDiv = document.getElementById('otherTitleDiv');
            const otherInput = document.getElementById('otherTitle');
            
            if (title === 'ระบุอื่นๆ') {
                otherDiv.style.display = 'block';
                otherInput.required = true;
            } else {
                otherDiv.style.display = 'none';
                otherInput.required = false;
                otherInput.value = '';
            }
            checkFormChanges();
        }

        function getFormData() {
            const titleSelect = document.getElementById('titleName').value;
            const finalTitle = titleSelect === 'ระบุอื่นๆ' ? document.getElementById('otherTitle').value : titleSelect;
            
            return {
                caseType: document.getElementById('caseType').value,
                caseNo: document.getElementById('caseNo').value,
                accuser: document.getElementById('accuser').value,
                suspect: document.getElementById('suspect').value,
                investigator: document.getElementById('investigator').value,
                witnessDate: ThaiDatePicker.getISODate('witnessDate'),
                dailyNo: document.getElementById('dailyNo').value,
                time: document.getElementById('time').value,
                witnessType: document.getElementById('witnessType').value,
                titleName: finalTitle,
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                idCard: document.getElementById('idCard').value,
                zone: document.getElementById('zone').value,
                address: document.getElementById('address').value,
                phone: document.getElementById('phone').value.trim()
            };
        }

        function validateForm() {
            const form = document.getElementById('mainForm');
            return form.checkValidity() && ThaiDatePicker.getISODate('witnessDate') !== "";
        }

        function checkFormChanges() {
            const isValid = validateForm();
            const btnSave = document.getElementById('btnSave');
            
            if (!editMode) {
                btnSave.disabled = !isValid;
            } else {
                const currentDataStr = JSON.stringify(getFormData());
                btnSave.disabled = !(isValid && currentDataStr !== originalDataStr);
            }
        }

        // ==========================================================================
        // EDIT, SAVE & DELETE
        // ==========================================================================
        function editData(index) {
            const row = allData[index];
            if (!row) return;

            editMode = true;
            currentEditRowIndex = row.rowIndex;
            const raw = row.rawData;
            
            document.getElementById('modalTitle').innerText = 'แก้ไขข้อมูล';
            
            document.getElementById('caseType').value = raw.caseType;
            document.getElementById('caseNo').value = raw.caseNo;
            document.getElementById('accuser').value = raw.accuser;
            document.getElementById('suspect').value = raw.suspect;
            document.getElementById('investigator').value = raw.investigator;
            ThaiDatePicker.setISODate('witnessDate', raw.witnessDate);
            document.getElementById('dailyNo').value = raw.dailyNo;
            document.getElementById('time').value = raw.time;
            document.getElementById('witnessType').value = raw.witnessType;
            document.getElementById('savedPoliceSelect').value = '';
            resetPolicePullIndicator();
            document.getElementById('policeSelectorGroup').style.display = (raw.witnessType === 'ตำรวจ') ? 'block' : 'none';
            
            const title = raw.titleName;
            if (['นาย', 'นาง', 'นางสาว'].includes(title)) {
                document.getElementById('titleName').value = title;
            } else {
                document.getElementById('titleName').value = 'ระบุอื่นๆ';
                document.getElementById('otherTitle').value = title;
            }
            toggleOtherTitle();
            
            document.getElementById('firstName').value = raw.firstName;
            document.getElementById('lastName').value = raw.lastName;
            document.getElementById('idCard').value = raw.idCard;
            document.getElementById('zone').value = raw.zone;
            document.getElementById('address').value = raw.address;
            document.getElementById('phone').value = formatPhone(raw.phone);
            
            originalDataStr = JSON.stringify(getFormData());
            
            switchTab(1);
            document.getElementById('formModal').style.display = 'flex';
            checkFormChanges();
        }

        async function saveData() {
            const formData = getFormData();
            
            Swal.fire({
                title: 'ยืนยันการบันทึก',
                text: 'ตรวจสอบข้อมูลให้ครบถ้วนก่อนบันทึก',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'บันทึก',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: 'var(--navy-main)',
                reverseButtons: true
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const payload = {
                        action: 'saveData',
                        mode: editMode ? 'edit' : 'add',
                        rowIndex: currentEditRowIndex,
                        formData: formData
                    };
                    
                    showLoading('กำลังบันทึกข้อมูลและสร้างเอกสาร...');
                    
                    try {
                        const res = await fetch(API_URL, { 
                            method: 'POST', 
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(payload) 
                        });
                        const json = await res.json();
                        
                        if (json.status === 'success') {
                            closeModal();
                            loadTable(1);
                            loadOptions();
                            Swal.fire('สำเร็จ', editMode ? 'อัปเดตข้อมูลและสร้างเอกสารสำเร็จ' : 'การดำเนินการเสร็จสมบูรณ์', 'success');
                        } else {
                            throw new Error(json.message);
                        }
                    } catch (error) {
                        Swal.fire('ข้อผิดพลาด', 'เกิดข้อผิดพลาด โปรดลองใหม่อีกครั้ง', 'error');
                    }
                }
            });
        }

        function deleteData(index = -1) {
            if (index !== -1) {
                currentEditRowIndex = allData[index].rowIndex;
            }
            
            Swal.fire({
                title: 'ยืนยันการลบข้อมูล',
                text: '',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'ลบข้อมูล',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#e11d48',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    processDelete();
                }
            });
        }

        async function processDelete() {
            showLoading('กำลังลบข้อมูล...');
            try {
                const payload = {
                    action: 'deleteData',
                    rowIndex: currentEditRowIndex
                };
                
                const res = await fetch(API_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload) 
                });
                const json = await res.json();
                
                if (json.status === 'success') {
                    closeModal();
                    loadTable(currentPage);
                    Swal.fire('สำเร็จ', 'ลบข้อมูลเรียบร้อยแล้ว', 'success');
                } else {
                    throw new Error(json.message);
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'เกิดข้อผิดพลาด โปรดลองใหม่อีกครั้ง', 'error');
            }
        }

        function showLoading(text) {
            Swal.fire({
                title: text,
                allowOutsideClick: false,
                allowEscapeKey: false,
                showConfirmButton: false,
                didOpen: () => { Swal.showLoading(); }
            });
        }
    </script>
</body>
</html>
