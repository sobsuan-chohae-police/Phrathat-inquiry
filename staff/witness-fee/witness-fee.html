<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เบิกค่าตอบแทนพยาน</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>
    
    <!-- Core Scripts & Styles (Relative Paths) -->
    <script src="../auth.js"></script>
    <script src="../../assets/datepicker.js"></script>
    <link rel="stylesheet" href="../../assets/theme.css">

    <style>
        /* ==========================================================================
           UI/UX & Animations
           ========================================================================== */

        /* Navbar */
        .nav-btn { 
            background: #f1f5f9; border: none; font-size: 1.1rem; color: var(--text-light); 
            cursor: pointer; width: 42px; height: 42px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            transition: var(--transition); text-decoration: none; flex-shrink: 0; 
        }
        .btn-back {
            background: transparent !important; 
            color: var(--text-main);
            font-size: 1.3rem; 
            width: auto; 
            height: auto;
            padding: 5px 15px 5px 0; 
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-back i { transition: var(--transition); }
        .btn-back:hover { color: var(--navy-main); }
        .btn-back:hover i { transform: translateX(-5px) scaleX(1.1); }
        .nav-left { flex: 1; display: flex; align-items: center; }
        
        .btn-add-nav { background: #e2e8f0 !important; color: #365f70 !important; border: none !important; }
        .btn-add-nav i { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .btn-add-nav:hover { background: #365f70 !important; color: white !important; transform: none !important; box-shadow: 0 6px 15px rgba(54, 95, 112, 0.4) !important; }
        .btn-add-nav:hover i { transform: scale(1.3); }
        
        .btn-menu-nav { background: #e2e8f0 !important; color: #365f70 !important; border: none !important; }
        .btn-menu-nav i { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .btn-menu-nav:hover, .btn-menu-nav.active { background: #365f70 !important; color: white !important; transform: none !important; box-shadow: 0 6px 15px rgba(54, 95, 112, 0.4) !important; }
        .btn-menu-nav:hover i, .btn-menu-nav.active i { transform: scale(1.3); }
        
        /* Dropdown Styles */
        .dropdown-container { position: relative; display: inline-block; }
        @keyframes fadeDown { from { opacity: 0; transform: scaleY(0.8); } to { opacity: 1; transform: scaleY(1); } }
        .dropdown-menu {
            display: none; position: absolute; top: 100%; right: 0;
            background: white; min-width: 180px;
            border-radius: 16px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
            padding: 8px; flex-direction: column; gap: 4px;
            z-index: 1000; transform-origin: top right; border: 1px solid #f1f5f9;
            margin-top: 8px;
        }
        .dropdown-menu.show { display: flex; animation: fadeDown 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .dropdown-item {
            padding: 10px 15px; border-radius: 8px; color: var(--text-main);
            text-decoration: none; display: flex; align-items: center;
            font-size: 0.95rem; font-weight: 500; transition: var(--transition);
            background: transparent; border: none; cursor: pointer;
            width: 100%; text-align: left;
        }
        .dropdown-item i {
            margin-right: 12px; color: var(--text-light); font-size: 1.1rem;
            transition: var(--transition); width: 20px; text-align: center;
        }
        
        /* Colored Actions */
        .dropdown-item.action-blue { color: var(--navy-main); }
        .dropdown-item.action-blue i { color: var(--navy-main); }
        .dropdown-item.action-blue:hover { background: var(--navy-main); color: white; transform: translateX(4px); }
        .dropdown-item.action-blue:hover i { color: white; }

        .dropdown-item.action-green { color: #10b981; }
        .dropdown-item.action-green i { color: #10b981; }
        .dropdown-item.action-green:hover { background: #10b981; color: white; transform: translateX(4px); }
        .dropdown-item.action-green:hover i { color: white; }

        .dropdown-item.action-red { color: var(--danger); }
        .dropdown-item.action-red i { color: var(--danger); }
        .dropdown-item.action-red:hover { background: var(--danger); color: white; transform: translateX(4px); }
        .dropdown-item.action-red:hover i { color: white; }
        
        .dropdown-item:not(.action-blue):not(.action-green):not(.action-red):hover { background: #f8fafc; color: var(--navy-main); transform: translateX(4px); }
        .dropdown-item:not(.action-blue):not(.action-green):not(.action-red):hover i { color: var(--navy-main); }
        
        /* Row Menu Button */
        .btn-row-menu {
            background: #e2e8f0; color: #365f70; border: none;
            width: 32px; height: 32px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1rem; cursor: pointer; transition: var(--transition);
        }
        .btn-row-menu:hover, .btn-row-menu.active {
            background: #365f70; color: white;
            transform: scale(1.15); box-shadow: 0 4px 10px rgba(54, 95, 112, 0.3);
        }

        /* Modern Loading Animation */
        .modern-wave-loader {
            display: flex; gap: 6px; justify-content: center; align-items: center; height: 40px; margin-bottom: 10px;
        }
        .modern-wave-loader .bar {
            width: 5px; height: 12px; border-radius: 4px;
            background: var(--navy-main);
            animation: elegantWave 1.2s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
        }
        .modern-wave-loader .bar:nth-child(2) { animation-delay: 0.1s; background: var(--gold-main); }
        .modern-wave-loader .bar:nth-child(3) { animation-delay: 0.2s; background: #10b981; }
        .modern-wave-loader .bar:nth-child(4) { animation-delay: 0.3s; background: var(--navy-main); }
        
        @keyframes elegantWave {
            0%, 100% { height: 12px; opacity: 0.4; }
            50% { height: 32px; opacity: 1; transform: translateY(-4px); }
        }
        
        .doc-link { color: var(--navy-main); font-size: 1.2rem; transition: var(--transition); }
        .doc-link:hover { color: var(--gold-main); transform: scale(1.1); }

        /* Table Toolbar (Pagination) */
        .table-toolbar {
            display: flex; justify-content: flex-end; align-items: center;
            padding-bottom: 16px;
            margin-top: -10px;
        }

        .btn-add {
            background: var(--navy-gradient); color: white; border: none;
            width: 45px; height: 45px; border-radius: 50%; font-size: 1.2rem;
            cursor: pointer; transition: var(--transition); box-shadow: 0 4px 15px rgba(30, 58, 138, 0.2);
            display: flex; align-items: center; justify-content: center;
        }
        .btn-add:hover { transform: translateY(-2px) rotate(90deg); box-shadow: var(--shadow-gold); }

        .pagination-controls { display: flex; align-items: center; gap: 15px; }
        .page-info { font-size: 0.95rem; color: var(--text-light); font-weight: 500; }
        .btn-page {
            background: #f1f5f9; border: none; width: 36px; height: 36px; border-radius: 50%;
            color: var(--text-main); cursor: pointer; transition: var(--transition);
        }
        .btn-page:hover:not(:disabled) { background: var(--gold-main); color: white; }
        .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Slide Animations for Table Body */
        .slide-left { animation: slideLeft 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .slide-right { animation: slideRight 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
        @keyframes slideLeft { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideRight { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }

        /* Removed content-loader */

        /* ==========================================================================
           Modal & Form
           ========================================================================== */
        .modal-card { max-width: 700px; height: 85vh; max-height: 800px; padding: 0; }
        .modal-header-area { padding: 25px 30px 0; border-bottom: 1px solid #e2e8f0; }
        .modal-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title-row h3 { font-size: 1.3rem; font-weight: 600; color: var(--navy-main); margin: 0; }
        
        .modal-actions { display: flex; gap: 10px; }
        .btn-delete-modal { background: #fff1f2; color: var(--danger); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: var(--transition); display: none; }
        .btn-delete-modal:hover { background: var(--danger); color: white; transform: scale(1.1); }
        .btn-close-modal { background: #f1f5f9; color: var(--text-light); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: var(--transition); }
        .btn-close-modal:hover { background: var(--danger); color: white; transform: scale(1.15); }

        /* Tabs */
        .tabs-container { display: flex; position: relative; gap: 30px; }
        .tab-btn {
            background: none; border: none; font-family: inherit; font-size: 1.05rem; font-weight: 500;
            color: var(--text-light); padding: 10px 5px; cursor: pointer; transition: color 0.3s;
        }
        .tab-btn.active { color: var(--navy-main); }
        .tab-indicator {
            position: absolute; bottom: -1px; left: 0; height: 3px; background: var(--gold-main);
            border-radius: 3px 3px 0 0; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            will-change: left, width;
        }

        /* Form Body */
        .modal-body { padding: 25px 30px; overflow-y: auto; flex: 1; }
        .tab-content { display: none; animation: fadeUp 0.4s ease; }
        .tab-content.active { display: block; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group.full-width { grid-column: 1 / -1; }
        
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; gap: 15px; }
            .modal-card { height: 95vh; width: 100%; border-radius: 20px 20px 0 0; margin-top: auto; }
            .modal-header-area, .modal-body { padding: 20px; }
        }

        /* Form Inputs */
        .form-input { background: #f8fafc; border: 1px solid #e2e8f0; }
        .form-input:focus { background: #fff; border-color: var(--navy-main); box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.1); }
        .form-input::placeholder { color: #cbd5e1; font-weight: 300; }
        
        /* Autocomplete */
        .autocomplete-wrapper { position: relative; }
        .autocomplete-list {
            position: absolute; top: 100%; left: 0; right: 0; background: #fff;
            border: 1px solid #e2e8f0; border-radius: 12px; margin-top: 5px;
            box-shadow: var(--shadow-modal); max-height: 200px; overflow-y: auto;
            z-index: 100; display: none;
        }
        .autocomplete-item { padding: 12px 16px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid #f1f5f9; }
        .autocomplete-item:hover { background: #f8fafc; color: var(--navy-main); }

        /* Modal Footer */
        .modal-footer {
            padding: 20px 30px; border-top: 1px solid #e2e8f0; background: #fff;
            display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 var(--radius-xl) var(--radius-xl);
        }
        .footer-left { display: flex; gap: 10px; }
        
        button:disabled { opacity: 0.5 !important; cursor: not-allowed !important; transform: none !important; box-shadow: none !important; background: #e2e8f0 !important; color: #94a3b8 !important; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="nav-left">
            <a href="../staff.html" class="btn-back">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <span class="page-title">เบิกค่าตอบแทนพยาน</span>
        </div>
        <div class="nav-right">
            <button class="nav-btn btn-add-nav tooltip-right" onclick="openModal()" data-tooltip="เพิ่มข้อมูล">
                <i class="fa-solid fa-plus"></i>
            </button>
            <div class="dropdown-container">
                <button class="nav-btn btn-menu-nav tooltip-right" onclick="toggleDropdown(event)" data-tooltip="เรียกเมนู">
                    <i class="fa-solid fa-caret-down"></i>
                </button>
                <div class="dropdown-menu" id="toolsDropdown">
                    <button class="dropdown-item" onclick="handleMenuAction('เมนู 1')">
                        <i class="fa-solid fa-file-invoice"></i> เมนู 1
                    </button>
                    <button class="dropdown-item" onclick="handleMenuAction('เมนู 2')">
                        <i class="fa-solid fa-print"></i> เมนู 2
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        
        <!-- Toolbar (Pagination) -->
        <div class="table-toolbar">
            <div class="pagination-controls">
                <button class="btn-page" id="btnPrevPage" onclick="changePage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <span class="page-info" id="pageInfo">หน้า 1 / 1</span>
                <button class="btn-page" id="btnNextPage" onclick="changePage(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-card">
            <div class="table-responsive">
                <table id="dataTable">
                    <thead style="display: none;">
                        <tr>
                            <th style="width: 60px; text-align: center;">จัดการ</th>
                            <th>วันที่สอบปากคำ</th>
                            <th>คดี</th>
                            <th>เลขคดี</th>
                            <th>ชื่อพยาน</th>
                            <th>ชื่อผู้ต้องหา</th>
                            <th>พนักงานสอบสวน</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="7" style="text-align:center; padding:60px 20px;">
                                <div class="modern-wave-loader">
                                    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                                </div>
                                <div class="premium-loader-text" style="color: var(--text-light); font-size: 0.95rem;">กำลังโหลดข้อมูลพยาน...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-card">
            
            <!-- Modal Header -->
            <div class="modal-header-area">
                <div class="modal-title-row">
                    <h3 id="modalTitle">เพิ่มข้อมูลใหม่</h3>
                    <div class="modal-actions">
                        <button class="btn-close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
                
                <!-- Tabs -->
                <div class="tabs-container">
                    <button class="tab-btn active" onclick="switchTab(1)" id="tabBtn1">ข้อมูลคดี</button>
                    <button class="tab-btn" onclick="switchTab(2)" id="tabBtn2">ข้อมูลพยาน</button>
                    <div class="tab-indicator" id="tabIndicator"></div>
                </div>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <form id="mainForm">
                    
                    <!-- Tab 1: ข้อมูลคดี -->
                    <div class="tab-content active" id="tab1">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">ประเภทคดี</label>
                                <select class="form-input" id="caseType" required>
                                    <option value="" disabled selected>เลือกประเภท</option>
                                    <option value="อาญา">อาญา</option>
                                    <option value="จราจร">จราจร</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">เลขคดี</label>
                                <input type="text" class="form-input" id="caseNo" placeholder="XX/25XX" required>
                            </div>
                            
                            <div class="form-group full-width autocomplete-wrapper">
                                <label class="form-label">ชื่อผู้กล่าวหา</label>
                                <input type="text" class="form-input" id="accuser" placeholder="พิมพ์เพื่อค้นหาหรือเพิ่มใหม่" required autocomplete="off">
                                <div class="autocomplete-list" id="accuserList"></div>
                            </div>
                            
                            <div class="form-group full-width autocomplete-wrapper">
                                <label class="form-label">ชื่อผู้ต้องหา</label>
                                <input type="text" class="form-input" id="suspect" placeholder="พิมพ์เพื่อค้นหาหรือเพิ่มใหม่" required autocomplete="off">
                                <div class="autocomplete-list" id="suspectList"></div>
                            </div>

                            <div class="form-group full-width">
                                <label class="form-label">พนักงานสอบสวน</label>
                                <select class="form-input" id="investigator" required>
                                    <option value="" disabled selected>เลือกพนักงานสอบสวน</option>
                                    <!-- เติมด้วย JS -->
                                </select>
                            </div>

                            <div class="form-group full-width">
                                <label class="form-label">วันที่สอบปากคำพยาน</label>
                                <input type="text" class="form-input" id="witnessDate" placeholder="เลือกวันที่" required>
                            </div>

                            <div class="form-group">
                                <label class="form-label">ประจำวันข้อ</label>
                                <input type="number" class="form-input" id="dailyNo" placeholder="ระบุตัวเลข" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">เวลา</label>
                                <input type="text" class="form-input" id="time" placeholder="XX.XX" required>
                            </div>
                        </div>
                    </div>

                    <!-- Tab 2: ข้อมูลพยาน -->
                    <div class="tab-content" id="tab2">
                        <div class="form-grid">
                            <div class="form-group full-width">
                                <label class="form-label">ประเภทพยาน</label>
                                <select class="form-input" id="witnessType" required>
                                    <option value="" disabled selected>เลือกประเภท</option>
                                    <option value="ตำรวจ">ตำรวจ</option>
                                    <option value="ประชาชน">ประชาชน</option>
                                </select>
                            </div>

                            <div class="form-group full-width" style="display: flex; gap: 15px;">
                                <div style="flex: 1;">
                                    <label class="form-label">คำนำหน้าชื่อ</label>
                                    <select class="form-input" id="titleName" onchange="toggleOtherTitle()" required>
                                        <option value="" disabled selected>เลือก</option>
                                        <option value="นาย">นาย</option>
                                        <option value="นาง">นาง</option>
                                        <option value="นางสาว">นางสาว</option>
                                        <option value="ระบุอื่นๆ">ระบุอื่นๆ</option>
                                    </select>
                                </div>
                                <div style="flex: 1; display: none;" id="otherTitleDiv">
                                    <label class="form-label">ระบุ</label>
                                    <input type="text" class="form-input" id="otherTitle" placeholder="พิมพ์คำนำหน้า">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label">ชื่อ</label>
                                <input type="text" class="form-input" id="firstName" placeholder="เฉพาะชื่อเท่านั้น" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">นามสกุล</label>
                                <input type="text" class="form-input" id="lastName" placeholder="เฉพาะนามสกุลเท่านั้น" required>
                            </div>

                            <div class="form-group">
                                <label class="form-label">เลขประจำตัวประชาชน</label>
                                <input type="text" class="form-input" id="idCard" placeholder="ไม่ต้องใส่ขีดระหว่างตัวเลข" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">เขตที่พักอาศัย</label>
                                <select class="form-input" id="zone" required>
                                    <option value="" disabled selected>เลือกเขต</option>
                                    <option value="ในเขตจังหวัด">ในเขตจังหวัด</option>
                                    <option value="นอกเขตจังหวัด">นอกเขตจังหวัด</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label">ที่อยู่พยาน</label>
                                <input type="text" class="form-input" id="address" placeholder="ระบุที่อยู่" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">หมายเลขโทรศัพท์</label>
                                <input type="text" class="form-input" id="phone" placeholder="ไม่ต้องใส่ขีดระหว่างตัวเลข" required>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer">
                <div class="footer-left">
                    <button type="button" class="btn-secondary" id="btnBack" onclick="switchTab(1)" disabled>กลับ</button>
                    <button type="button" class="btn-secondary" id="btnNext" onclick="switchTab(2)">ต่อไป</button>
                </div>
                <button type="button" class="btn-primary" id="btnSave" onclick="saveData()" disabled>บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================================================
        // CONFIG & STATE
        // ==========================================================================
        // ⚠️ สำคัญ: เปลี่ยน URL นี้เป็น Web App URL อันใหม่ที่คุณเพิ่ง Deploy
        const API_URL = 'https://script.google.com/macros/s/AKfycbycuS5nABfycyQMpi3FzAJdX9Dyah9XCYWJO-32fczZqMU9uzE9-reFZdgt1wyzF9DI/exec';
        
        let allData = [];
        let currentPage = 1;
        let totalPages = 1;
        
        let editMode = false;
        let currentEditRowIndex = -1;
        let originalDataStr = ""; 
        let currentTab = 1;

        // เก็บข้อมูลสำหรับ Autocomplete
        let autocompleteData = {
            accusers: [],
            suspects: []
        };

        // ==========================================================================
        // DROPDOWN LOGIC
        // ==========================================================================
        let activeDropdown = null;
        let activeDropdownBtn = null;

        function toggleRowDropdown(event, index) {
            event.stopPropagation();
            const dropdown = document.getElementById(`rowDropdown-${index}`);
            const btn = event.currentTarget;
            
            if (activeDropdown && activeDropdown !== dropdown) {
                activeDropdown.classList.remove('show');
                if (activeDropdownBtn) activeDropdownBtn.classList.remove('active');
            }
            
            dropdown.classList.toggle('show');
            btn.classList.toggle('active');
            
            if (dropdown.classList.contains('show')) {
                activeDropdown = dropdown;
                activeDropdownBtn = btn;
                
                // ใช้ position: fixed เพื่อให้เมนูลอยทะลุกรอบตารางที่ตั้ง overflow ไว้
                const rect = btn.getBoundingClientRect();
                dropdown.style.position = 'fixed';
                dropdown.style.marginTop = '0';
                
                // หาความสูงของเมนูเพื่อตรวจสอบการล้นขอบจอ
                let dropdownHeight = dropdown.offsetHeight;
                if (dropdownHeight === 0) dropdownHeight = 160; 

                // หากเปิดลงล่างแล้วทะลุขอบจอ ให้สลับเป็นเปิดขึ้นบนแทน
                if (rect.bottom + dropdownHeight + 10 > window.innerHeight) {
                    dropdown.style.top = `${rect.top - dropdownHeight - 8}px`;
                    dropdown.style.transformOrigin = 'bottom left';
                } else {
                    dropdown.style.top = `${rect.bottom + 8}px`;
                    dropdown.style.transformOrigin = 'top left';
                }
                
                dropdown.style.left = `${rect.left}px`;
                dropdown.style.right = 'auto';
            } else {
                activeDropdown = null;
                activeDropdownBtn = null;
            }
        }

        function toggleDropdown(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('toolsDropdown');
            const btn = event.currentTarget;
            
            if (activeDropdown && activeDropdown !== dropdown) {
                activeDropdown.classList.remove('show');
                if (activeDropdownBtn) activeDropdownBtn.classList.remove('active');
            }
            
            dropdown.classList.toggle('show');
            btn.classList.toggle('active');
            
            if (dropdown.classList.contains('show')) {
                activeDropdown = dropdown;
                activeDropdownBtn = btn;
            } else {
                activeDropdown = null;
                activeDropdownBtn = null;
            }
        }

        window.addEventListener('click', function(event) {
            if (activeDropdown) {
                activeDropdown.classList.remove('show');
                if (activeDropdownBtn) activeDropdownBtn.classList.remove('active');
                activeDropdown = null;
                activeDropdownBtn = null;
            }
        });

        // ปิดเมนูเมื่อมีการเลื่อนหน้าจอหรือเลื่อนตาราง
        window.addEventListener('scroll', function(event) {
            if (activeDropdown) {
                activeDropdown.classList.remove('show');
                if (activeDropdownBtn) activeDropdownBtn.classList.remove('active');
                activeDropdown = null;
                activeDropdownBtn = null;
            }
        }, true);

        function handleMenuAction(menuName) {
            document.getElementById('toolsDropdown').classList.remove('show');
            if (activeDropdownBtn) activeDropdownBtn.classList.remove('active');
            activeDropdown = null;
            activeDropdownBtn = null;
            Swal.fire({
                title: menuName,
                text: 'ฟังก์ชันนี้กำลังอยู่ในช่วงการพัฒนา',
                icon: 'info',
                confirmButtonText: 'ตกลง',
                confirmButtonColor: 'var(--navy-main)'
            });
        }

        // ==========================================================================
        // INITIALIZATION
        // ==========================================================================
        document.addEventListener('DOMContentLoaded', () => {
            ThaiDatePicker.init('#witnessDate');
            
            const inputs = document.querySelectorAll('#mainForm input, #mainForm select');
            inputs.forEach(input => {
                input.addEventListener('input', checkFormChanges);
                input.addEventListener('change', checkFormChanges);
            });

            setupAutocomplete('accuser', 'accuserList', 'accusers');
            setupAutocomplete('suspect', 'suspectList', 'suspects');

            // ยิง 2 Request แยกกัน เหมือนระบบเมาขับ
            loadTable(1);
            loadOptions();
        });

        // ==========================================================================
        // REQUEST 1: โหลดข้อมูลตาราง (Server-side Pagination)
        // ==========================================================================
        async function loadTable(page) {
            const tbody = document.getElementById('tableBody');
            const thead = document.querySelector('#dataTable thead');
            thead.style.display = 'none';
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:60px 20px; border-radius: var(--radius-xl);"><div class="modern-wave-loader"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><div class="premium-loader-text" style="color: var(--text-light); font-size: 0.95rem;">กำลังโหลดข้อมูลพยาน...</div></td></tr>';
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getData', page: page })
                });
                const json = await response.json();
                if (json.status === 'error') throw new Error(json.message);
                
                allData = json.data; // เก็บข้อมูล 10 แถวของหน้านี้ไว้ใช้ตอนกดแก้ไข
                renderTable(allData);
                updatePagination(page, json.total);
                
            } catch (e) {
                console.error("loadTable error:", e);
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--danger); border-radius: var(--radius-xl);">โหลดข้อมูลไม่สำเร็จ: ${e.message || 'ไม่ทราบสาเหตุ'}</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            const thead = document.querySelector('#dataTable thead');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                thead.style.display = 'table-header-group';
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-light); padding: 30px;">ไม่มีข้อมูล</td></tr>`;
                return;
            }
            
            thead.style.display = 'table-header-group';
            
            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                
                let docAction = '';
                if (row.display.docUrl) {
                    docAction = `<button class="dropdown-item action-blue" onclick="window.open('${row.display.docUrl}', '_blank')"><i class="fa-solid fa-file-lines"></i> เปิดเอกสาร</button>`;
                } else {
                    docAction = `<button class="dropdown-item action-blue" disabled style="opacity: 0.5; cursor: not-allowed;"><i class="fa-solid fa-file-lines"></i> ไม่มีเอกสาร</button>`;
                }

                tr.innerHTML = `
                    <td style="text-align: center; overflow: visible;">
                        <div class="dropdown-container">
                            <button class="btn-row-menu" onclick="toggleRowDropdown(event, ${index})"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                            <div class="dropdown-menu" id="rowDropdown-${index}" style="left: 0; right: auto; transform-origin: top left; margin-left: 10px;">
                                ${docAction}
                                <button class="dropdown-item action-green" onclick="editData(${index})"><i class="fa-solid fa-pen"></i> แก้ไขข้อมูล</button>
                                <button class="dropdown-item action-red" onclick="deleteData(${index})"><i class="fa-solid fa-trash-can"></i> ลบข้อมูล</button>
                            </div>
                        </div>
                    </td>
                    <td>${row.display.date}</td>
                    <td>${row.display.caseType}</td>
                    <td>${row.display.caseNo}</td>
                    <td>${row.display.witnessName}</td>
                    <td>${row.display.suspect}</td>
                    <td>${row.display.investigator}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updatePagination(page, total) {
            currentPage = page;
            totalPages = Math.ceil(total / 10) || 1; // โหลดทีละ 10 แถว
            document.getElementById('pageInfo').innerText = `${page} / ${totalPages}`;
            document.getElementById('btnPrevPage').disabled = page === 1;
            document.getElementById('btnNextPage').disabled = page === totalPages || totalPages === 0;
        }

        function changePage(step) {
            const newPage = currentPage + step;
            if (newPage >= 1 && newPage <= totalPages) {
                loadTable(newPage);
            }
        }

        // ==========================================================================
        // REQUEST 2: โหลดข้อมูลตัวเลือก (Dropdown & Autocomplete)
        // ==========================================================================
        async function loadOptions() {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getOptions' })
                });
                const json = await res.json();
                if (json.status === 'error') throw new Error(json.message);
                
                // 1. เติม Dropdown พนักงานสอบสวน
                const select = document.getElementById('investigator');
                select.innerHTML = '<option value="" disabled selected>เลือกพนักงานสอบสวน</option>';
                json.officers.forEach(off => {
                    const option = document.createElement('option');
                    option.value = off;
                    option.textContent = off;
                    select.appendChild(option);
                });

                // 2. เก็บข้อมูล Autocomplete ไว้ในตัวแปร
                autocompleteData.accusers = json.accusers;
                autocompleteData.suspects = json.suspects;
                
            } catch (e) {
                console.error('Failed to load options:', e);
                Swal.fire({ toast: true, position: 'top-end', icon: 'error', title: 'โหลดข้อมูลตัวเลือกบางส่วนไม่สำเร็จ', text: e.message, showConfirmButton: false, timer: 4000 });
            }
        }

        function setupAutocomplete(inputId, listId, dataKey) {
            const input = document.getElementById(inputId);
            const list = document.getElementById(listId);
            
            input.addEventListener('focus', () => showList(input.value));
            input.addEventListener('input', () => showList(input.value));
            input.addEventListener('blur', () => setTimeout(() => list.style.display = 'none', 200));
            
            function showList(query) {
                const sourceData = autocompleteData[dataKey] || [];
                const filtered = sourceData.filter(val => val.toLowerCase().includes(query.toLowerCase()));
                
                list.innerHTML = '';
                if (filtered.length > 0) {
                    filtered.forEach(val => {
                        const div = document.createElement('div');
                        div.className = 'autocomplete-item';
                        div.textContent = val;
                        div.onmousedown = () => {
                            input.value = val;
                            list.style.display = 'none';
                            checkFormChanges();
                        };
                        list.appendChild(div);
                    });
                    list.style.display = 'block';
                } else {
                    list.style.display = 'none';
                }
            }
        }

        // ==========================================================================
        // MODAL & TABS LOGIC
        // ==========================================================================
        function openModal() {
            editMode = false;
            currentEditRowIndex = -1;
            document.getElementById('mainForm').reset();
            ThaiDatePicker.clear('witnessDate');
            toggleOtherTitle();
            
            document.getElementById('modalTitle').innerText = 'เพิ่มข้อมูลใหม่';
            
            switchTab(1);
            document.getElementById('formModal').style.display = 'flex';
            checkFormChanges();
        }

        function closeModal() {
            document.getElementById('formModal').style.display = 'none';
        }

        function switchTab(tabIndex) {
            currentTab = tabIndex;
            document.getElementById('tab1').classList.toggle('active', tabIndex === 1);
            document.getElementById('tab2').classList.toggle('active', tabIndex === 2);
            
            const btn1 = document.getElementById('tabBtn1');
            const btn2 = document.getElementById('tabBtn2');
            btn1.classList.toggle('active', tabIndex === 1);
            btn2.classList.toggle('active', tabIndex === 2);
            
            const activeBtn = tabIndex === 1 ? btn1 : btn2;
            const indicator = document.getElementById('tabIndicator');
            indicator.style.width = `${activeBtn.offsetWidth}px`;
            indicator.style.left = `${activeBtn.offsetLeft}px`;
            
            document.getElementById('btnBack').disabled = (tabIndex === 1);
            document.getElementById('btnNext').disabled = (tabIndex === 2);
            document.querySelector('.modal-body').scrollTop = 0;
        }

        // ==========================================================================
        // FORM LOGIC & CHANGE DETECTION
        // ==========================================================================
        function toggleOtherTitle() {
            const title = document.getElementById('titleName').value;
            const otherDiv = document.getElementById('otherTitleDiv');
            const otherInput = document.getElementById('otherTitle');
            
            if (title === 'ระบุอื่นๆ') {
                otherDiv.style.display = 'block';
                otherInput.required = true;
            } else {
                otherDiv.style.display = 'none';
                otherInput.required = false;
                otherInput.value = '';
            }
            checkFormChanges();
        }

        function getFormData() {
            const titleSelect = document.getElementById('titleName').value;
            const finalTitle = titleSelect === 'ระบุอื่นๆ' ? document.getElementById('otherTitle').value : titleSelect;
            
            return {
                caseType: document.getElementById('caseType').value,
                caseNo: document.getElementById('caseNo').value,
                accuser: document.getElementById('accuser').value,
                suspect: document.getElementById('suspect').value,
                investigator: document.getElementById('investigator').value,
                witnessDate: ThaiDatePicker.getISODate('witnessDate'),
                dailyNo: document.getElementById('dailyNo').value,
                time: document.getElementById('time').value,
                witnessType: document.getElementById('witnessType').value,
                titleName: finalTitle,
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                idCard: document.getElementById('idCard').value,
                zone: document.getElementById('zone').value,
                address: document.getElementById('address').value,
                phone: document.getElementById('phone').value.trim()
            };
        }

        function validateForm() {
            const form = document.getElementById('mainForm');
            return form.checkValidity() && ThaiDatePicker.getISODate('witnessDate') !== "";
        }

        function checkFormChanges() {
            const isValid = validateForm();
            const btnSave = document.getElementById('btnSave');
            
            if (!editMode) {
                btnSave.disabled = !isValid;
            } else {
                const currentDataStr = JSON.stringify(getFormData());
                btnSave.disabled = !(isValid && currentDataStr !== originalDataStr);
            }
        }

        // ==========================================================================
        // EDIT, SAVE & DELETE
        // ==========================================================================
        function editData(index) {
            const row = allData[index];
            if (!row) return;

            editMode = true;
            currentEditRowIndex = row.rowIndex; // ใช้ rowIndex จากหลังบ้าน
            const raw = row.rawData;
            
            document.getElementById('modalTitle').innerText = 'แก้ไขข้อมูล';
            
            // Pre-fill Data
            document.getElementById('caseType').value = raw.caseType;
            document.getElementById('caseNo').value = raw.caseNo;
            document.getElementById('accuser').value = raw.accuser;
            document.getElementById('suspect').value = raw.suspect;
            document.getElementById('investigator').value = raw.investigator;
            ThaiDatePicker.setISODate('witnessDate', raw.witnessDate);
            document.getElementById('dailyNo').value = raw.dailyNo;
            document.getElementById('time').value = raw.time;
            document.getElementById('witnessType').value = raw.witnessType;
            
            const title = raw.titleName;
            if (['นาย', 'นาง', 'นางสาว'].includes(title)) {
                document.getElementById('titleName').value = title;
            } else {
                document.getElementById('titleName').value = 'ระบุอื่นๆ';
                document.getElementById('otherTitle').value = title;
            }
            toggleOtherTitle();
            
            document.getElementById('firstName').value = raw.firstName;
            document.getElementById('lastName').value = raw.lastName;
            document.getElementById('idCard').value = raw.idCard;
            document.getElementById('zone').value = raw.zone;
            document.getElementById('address').value = raw.address;
            let phoneStr = raw.phone ? raw.phone.toString() : "";
            phoneStr = phoneStr.replace(/^'/, '').trim();
            if (phoneStr.match(/^[1-9]\d{7,8}$/)) { 
                phoneStr = "0" + phoneStr;
            }
            document.getElementById('phone').value = phoneStr;
            
            originalDataStr = JSON.stringify(getFormData());
            
            switchTab(1);
            document.getElementById('formModal').style.display = 'flex';
            checkFormChanges();
        }

        async function saveData() {
            const formData = getFormData();
            
            Swal.fire({
                title: 'ยืนยันการบันทึก',
                text: 'ตรวจสอบข้อมูลให้ครบถ้วนก่อนบันทึก',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'บันทึก',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: 'var(--navy-main)',
                reverseButtons: true
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const payload = {
                        action: 'saveData',
                        mode: editMode ? 'edit' : 'add',
                        rowIndex: currentEditRowIndex,
                        formData: formData
                    };
                    
                    showLoading('กำลังบันทึกข้อมูลและสร้างเอกสาร...');
                    
                    try {
                        const res = await fetch(API_URL, { 
                            method: 'POST', 
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(payload) 
                        });
                        const json = await res.json();
                        
                        if (json.status === 'success') {
                            closeModal();
                            loadTable(1); // โหลดตารางหน้าแรกใหม่
                            loadOptions(); // อัปเดตรายชื่อ Autocomplete ใหม่
                            Swal.fire('สำเร็จ', editMode ? 'อัปเดตข้อมูลและสร้างเอกสารสำเร็จ' : 'การดำเนินการเสร็จสมบูรณ์', 'success');
                        } else {
                            throw new Error(json.message);
                        }
                    } catch (error) {
                        Swal.fire('ข้อผิดพลาด', 'เกิดข้อผิดพลาด โปรดลองใหม่อีกครั้ง', 'error');
                    }
                }
            });
        }

        function deleteData(index = -1) {
            if (index !== -1) {
                currentEditRowIndex = allData[index].rowIndex;
            }
            
            Swal.fire({
                title: 'ยืนยันการลบข้อมูล',
                text: '',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'ลบข้อมูล',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#e11d48',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    processDelete();
                }
            });
        }

        async function processDelete() {
            showLoading('กำลังลบข้อมูล...');
            try {
                const payload = {
                    action: 'deleteData',
                    rowIndex: currentEditRowIndex
                };
                
                const res = await fetch(API_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload) 
                });
                const json = await res.json();
                
                if (json.status === 'success') {
                    closeModal();
                    loadTable(currentPage); // โหลดตารางหน้าปัจจุบันใหม่
                    Swal.fire('สำเร็จ', 'ลบข้อมูลเรียบร้อยแล้ว', 'success');
                } else {
                    throw new Error(json.message);
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'เกิดข้อผิดพลาด โปรดลองใหม่อีกครั้ง', 'error');
            }
        }

        function showLoading(text) {
            Swal.fire({
                title: text,
                allowOutsideClick: false,
                allowEscapeKey: false,
                showConfirmButton: false,
                didOpen: () => { Swal.showLoading(); }
            });
        }
    </script>
</body>
</html>
