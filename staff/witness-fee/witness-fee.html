<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เบิกค่าตอบแทนพยาน</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>

    <!-- Core System Files -->
    <script src="../auth.js"></script>
    <link rel="stylesheet" href="../../theme.css">
    
    <style>
        /* ==========================================================================
           [Specific Styles] ระบบเบิกค่าตอบแทนพยาน
           ========================================================================== */
        
        /* Navbar Override for Subpage */
        .nav-btn { 
            background: #f1f5f9; border: none; font-size: 1.1rem; color: var(--text-light); 
            cursor: pointer; width: 42px; height: 42px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            transition: var(--transition); text-decoration: none; flex-shrink: 0; 
        }
        .btn-back { background: transparent !important; color: var(--text-main); font-size: 1.3rem; width: auto; height: auto; padding: 5px 15px 5px 0; }
        .btn-back:hover { color: var(--navy-main); }
        .btn-back:hover i { transform: translateX(-5px) scaleX(1.1); }
        
        /* Loading Overlay (Full Screen Lock) */
        #globalLoading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }

        /* Table Layout Options */
        .table-container {
            background: var(--card-bg); border-radius: var(--radius-xl);
            box-shadow: var(--shadow-soft); padding: 20px; margin-bottom: 20px;
            display: flex; flex-direction: column; min-height: 65vh; /* Lock height */
            position: relative; overflow: hidden;
        }
        .table-wrapper { flex: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .table-responsive { flex: 1; display: flex; flex-direction: column; }
        table { flex: 1; display: flex; flex-direction: column; }
        thead { flex-shrink: 0; }
        tbody { flex: 1; display: flex; flex-direction: column; transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s; will-change: transform, opacity; }
        tr { display: table; table-layout: fixed; width: 100%; }
        tbody tr { flex: 1; display: flex; align-items: center; border-bottom: 1px solid #f1f5f9;}
        td { display: table-cell; flex: 1; padding: 12px 15px; } /* ข้อมูลตารางเฉลี่ยความสูงอัตโนมัติ */
        
        .action-cell { width: 60px; text-align: center; }
        .doc-cell { width: 70px; text-align: center; }

        /* Pagination & Toolbar */
        .table-toolbar {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 15px; border-top: 1px solid #e2e8f0; flex-shrink: 0; gap: 10px; flex-wrap: wrap;
        }
        .toolbar-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 250px;}
        .toolbar-right { display: flex; align-items: center; gap: 15px; }
        
        .search-box {
            display: flex; background: #f8fafc; border-radius: 50px; padding: 5px 15px;
            align-items: center; flex: 1; max-width: 300px; border: 1px solid transparent;
            transition: var(--transition);
        }
        .search-box:focus-within { background: #fff; border-color: var(--gold-main); box-shadow: 0 0 0 3px rgba(212,175,55,0.1); }
        .search-box input { border: none; background: transparent; outline: none; padding: 5px; flex: 1; font-family: 'Kanit'; }
        .btn-search { background: transparent; border: none; color: var(--text-light); cursor: pointer; transition: 0.2s; padding: 5px; }
        .btn-search:hover { color: var(--navy-main); transform: scale(1.1); }
        
        .btn-add { background: var(--navy-gradient); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); box-shadow: 0 4px 10px rgba(30,58,138,0.2); }
        .btn-add:hover { transform: translateY(-2px) rotate(90deg); box-shadow: var(--shadow-gold); }

        .pagination-info { font-size: 0.95rem; font-weight: 500; color: var(--text-main); }
        .pagination-btn { background: #f1f5f9; border: none; width: 36px; height: 36px; border-radius: 50%; color: var(--text-main); cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .pagination-btn:hover:not(:disabled) { background: var(--gold-light); color: var(--gold-dark); transform: scale(1.1); }
        .pagination-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Document Icon Link */
        .doc-link { color: #3b82f6; font-size: 1.4rem; transition: 0.2s; display: inline-block; }
        .doc-link:hover { color: var(--navy-main); transform: scale(1.2); }

        /* Custom Modal Layout */
        .modal-card { max-width: 700px; height: 85vh; padding: 0; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header-fixed { padding: 25px 30px 0; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
        .modal-header-fixed h3 { font-size: 1.3rem; background: var(--navy-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .btn-trash { background: transparent; border: none; color: var(--danger); font-size: 1.2rem; cursor: pointer; transition: 0.2s; padding: 8px; border-radius: 50%; display: none; }
        .btn-trash:hover { background: #ffe4e6; transform: scale(1.1); }
        .btn-close-form { background: #f1f5f9; border: none; color: var(--text-light); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: 0.2s; }
        .btn-close-form:hover { background: var(--text-main); color: white; transform: rotate(90deg); }

        /* Tabs System */
        .tab-nav { display: flex; padding: 15px 30px 0; border-bottom: 2px solid #e2e8f0; position: relative; flex-shrink: 0; }
        .tab-btn { background: none; border: none; padding: 12px 20px; font-family: 'Kanit'; font-size: 1.05rem; color: var(--text-light); cursor: pointer; transition: 0.3s; z-index: 1; font-weight: 500; }
        .tab-btn.active { color: var(--navy-main); font-weight: 600; }
        .tab-indicator { position: absolute; bottom: -2px; left: 0; height: 3px; background: var(--gold-main); transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 2; border-radius: 3px 3px 0 0; }

        /* Scrollable Form Body */
        .modal-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 25px 30px; position: relative; scroll-behavior: smooth; }
        .tab-content { display: none; animation: fadeUp 0.3s ease-out forwards; will-change: transform, opacity; }
        .tab-content.active { display: block; }

        /* Form Grid (Responsive) */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group.full-width { grid-column: span 2; }
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .modal-card { height: 95vh; width: 100%; border-radius: 20px 20px 0 0; position: absolute; bottom: 0; animation: slideUp 0.4s ease-out forwards; }
            @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        }

        /* Inputs & Previews */
        .form-group { position: relative; display: flex; flex-direction: column; }
        .preview-text { position: absolute; top: 40px; left: 16px; color: #94a3b8; pointer-events: none; transition: 0.2s; font-size: 0.95rem; }
        .form-input:focus + .preview-text, .form-input:not(:placeholder-shown) + .preview-text { opacity: 0; visibility: hidden; }

        /* Autocomplete Dropdown */
        .autocomplete-wrapper { position: relative; }
        .autocomplete-dropdown { 
            position: absolute; top: 100%; left: 0; width: 100%; max-height: 200px; 
            background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-modal); 
            overflow-y: auto; z-index: 100; display: none; border: 1px solid #e2e8f0; margin-top: 5px;
        }
        .autocomplete-item { padding: 10px 15px; cursor: pointer; transition: 0.2s; border-bottom: 1px solid #f8fafc; font-size: 0.95rem; }
        .autocomplete-item:hover { background: #f8fafc; color: var(--navy-main); padding-left: 20px; }

        /* Special input layout */
        .input-with-other { display: flex; gap: 10px; align-items: center; }
        .input-with-other select { flex: 1; }
        .input-other-box { flex: 1; display: none; animation: popUp 0.3s ease-out; }

        /* Form Footer Fixed */
        .modal-footer-fixed { padding: 20px 30px; border-top: 1px solid #f1f5f9; background: white; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .footer-left { flex: 1; }
        .footer-right { display: flex; gap: 15px; flex: 1; justify-content: flex-end; }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-light); width: 100%; }
        .empty-state i { font-size: 3rem; color: #cbd5e1; margin-bottom: 15px; }
        
    </style>
</head>

    <!-- Scripts -->
    <script src="../../datepicker.js"></script>
    <script>
        // ==========================================================================
        // Config & State
        // ==========================================================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbxFrju7Ml8KoMQ6fEEr7V4Fy-u6bsvBWf8PAeBPqHpoEutHVTigMiJyjpzdbHIJ-zzL/exec'; 
        
        let currentState = {
            dataList: [],
            filteredList: [],
            centralOfficers: [],
            currentPage: 1,
            itemsPerPage: 10,
            currentMode: 'add',
            originalDataStr: '',
            currentTab: 0,
            searchQuery: ''
        };

        const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];

        // ==========================================================================
        // Initialization
        // ==========================================================================
        document.addEventListener('DOMContentLoaded', async () => {
            ThaiDatePicker.init('.datepicker');
            await initData();
            setupAutocomplete('accuser', 'C'); // Index for ชื่อผู้กล่าวหา
            setupAutocomplete('suspect', 'D'); // Index for ชื่อผู้ต้องหา
            setupFormMonitors();
        });

        async function initData() {
            try {
                // Fetch Data from GAS
                const response = await fetch(`${API_URL}?action=getWitnessSystemData`);
                const result = await response.json();
                
                if(result.status === 'success') {
                    // Process Officers
                    const headersOff = result.officers[0];
                    currentState.centralOfficers = result.officers.slice(1).map(row => {
                        let obj = {};
                        headersOff.forEach((h, i) => obj[h] = row[i] || '');
                        return obj;
                    });
                    
                    // Process Witness Records (Reverse logic applied on render, keep raw here)
                    const headersWit = result.witnessData[0];
                    currentState.dataList = result.witnessData.slice(1).map(row => {
                        let obj = {};
                        headersWit.forEach((h, i) => obj[h] = row[i] || '');
                        
                        // Data Transformation on load
                        obj['_fullName'] = `${obj['คำนำหน้าชื่อพยาน'] || ''}${obj['ชื่อพยาน'] || ''} ${obj['นามสกุลพยาน'] || ''}`.trim();
                        obj['_thaiDate'] = convertIsoToThai(obj['วันที่สอบปากคำพยาน']);
                        
                        return obj;
                    });

                    // Store in sessionStorage
                    sessionStorage.setItem('centralOfficers', JSON.stringify(currentState.centralOfficers));
                    sessionStorage.setItem('witnessData', JSON.stringify(currentState.dataList));

                    populateInvestigatorDropdown();
                    executeSearch(); // Also triggers render
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error(error);
                Swal.fire({
                    icon: 'error',
                    title: 'เกิดข้อผิดพลาด',
                    text: 'ไม่สามารถโหลดข้อมูลได้ โปรดลองใหม่อีกครั้ง',
                    confirmButtonText: 'ตกลง'
                });
            } finally {
                hideLoading();
            }
        }

        // ==========================================================================
        // UI & Render Logic
        // ==========================================================================
        function showLoading(text = 'กำลังโหลดข้อมูล...') {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('globalLoading').style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('globalLoading').style.display = 'none';
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const totalItems = currentState.filteredList.length;
            const totalPages = Math.ceil(totalItems / currentState.itemsPerPage) || 1;
            
            // Validate Current Page
            if(currentState.currentPage > totalPages) currentState.currentPage = totalPages;
            if(currentState.currentPage < 1) currentState.currentPage = 1;
            
            // Pagination Slice (Reversed - Newest first -> index length-1 to 0)
            const reversedList = [...currentState.filteredList].reverse();
            const start = (currentState.currentPage - 1) * currentState.itemsPerPage;
            const end = start + currentState.itemsPerPage;
            const pageData = reversedList.slice(start, end);

            // Setup Transition (Sliding Effect)
            tbody.style.opacity = '0';
            tbody.style.transform = 'translateX(20px)';
            
            setTimeout(() => {
                tbody.innerHTML = '';
                
                if (pageData.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><i class="fa-solid fa-folder-open"></i><p>ไม่พบข้อมูล</p></div></td></tr>`;
                } else {
                    pageData.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="action-cell">
                                <button class="action-btn btn-edit" onclick="openModal('edit', '${row['ID']}')"><i class="fa-solid fa-pen-to-square"></i></button>
                            </td>
                            <td style="width: 140px;">${row['_thaiDate']}</td>
                            <td>${row['ประเภทคดี']}</td>
                            <td>${row['เลขคดี']}</td>
                            <td>${row['_fullName']}</td>
                            <td>${row['ชื่อผู้ต้องหา']}</td>
                            <td>${row['พนักงานสอบสวน']}</td>
                            <td class="doc-cell">
                                ${row['ไฟล์เอกสาร'] ? `<a href="${row['ไฟล์เอกสาร']}" target="_blank" class="doc-link" data-tooltip="เปิดเอกสาร"><i class="fa-solid fa-file-word"></i></a>` : '-'}
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
                
                // Update Pagination UI
                document.getElementById('pageInfo').innerText = `${currentState.currentPage}/${totalPages}`;
                document.getElementById('btnPrev').disabled = currentState.currentPage === 1;
                document.getElementById('btnNext').disabled = currentState.currentPage === totalPages;
                
                // Animate In
                requestAnimationFrame(() => {
                    tbody.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s';
                    tbody.style.opacity = '1';
                    tbody.style.transform = 'translateX(0)';
                });
            }, 200); // Wait for fade out
        }

        function changePage(direction) {
            const tbody = document.getElementById('tableBody');
            // Sliding direction based on Next/Prev
            tbody.style.transform = `translateX(${direction > 0 ? '-20px' : '20px'})`;
            tbody.style.opacity = '0';
            
            setTimeout(() => {
                currentState.currentPage += direction;
                renderTable();
            }, 200);
        }

        function executeSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (query === '') {
                currentState.filteredList = [...currentState.dataList];
            } else {
                currentState.filteredList = currentState.dataList.filter(row => {
                    // Search through relevant fields including parsed Thai Date
                    return Object.values(row).some(val => String(val).toLowerCase().includes(query));
                });
            }
            currentState.currentPage = 1;
            renderTable();
        }

            currentState.currentTab = index;
            
            // Update Buttons
            document.getElementById('tabBtn0').classList.toggle('active', index === 0);

                document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-file-circle-plus"></i> เพิ่มข้อมูลเบิกค่าตอบแทน';

                document.getElementById('btnDelete').style.display = 'block';
                
                // Load Data
                const rowData = currentState.dataList.find(r => String(r['ID']) === String(id));

        function toggleOtherTitle() {
            const select = document.getElementById('titleSelect');
            const otherBox = document.getElementById('titleOtherBox');
            if(select.value === 'ระบุอื่นๆ') {
                otherBox.style.display = 'block';

        function setupAutocomplete(inputId, colRef) {
            const input = document.getElementById(inputId);
            const dropdown = document.getElementById(`${inputId}Dropdown`);
            
            // Collect unique history from sessionStorage data
            const getHistory = () => {
                const key = colRef === 'C' ? 'ชื่อผู้กล่าวหา' : 'ชื่อผู้ต้องหา';
                return [...new Set(currentState.dataList.map(r => r[key]).filter(v => v))];
            };

            input.addEventListener('focus', () => {
                renderDropdown(getHistory(), dropdown, input);
            });

            input.addEventListener('input', () => {
                const val = input.value.trim().toLowerCase();
                const filtered = getHistory().filter(item => item.toLowerCase().includes(val));
                renderDropdown(filtered, dropdown, input);
            });

            // Close when click outside
            document.addEventListener('click', (e) => {
                if(!input.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.style.display = 'none';
                }
            });
        }

        function renderDropdown(items, dropdown, input) {
            dropdown.innerHTML = '';
            if(items.length === 0) {
                dropdown.style.display = 'none';
                return;
            }
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.textContent = item;
                div.onclick = () => {
                    input.value = item;
                    dropdown.style.display = 'none';
                    checkFormChanges(); // Trigger validation
                };
                dropdown.appendChild(div);
            });
            dropdown.style.display = 'block';
        }

        function setupFormMonitors() {
            document.querySelectorAll('.form-monitor').forEach(el => {
                el.addEventListener('input', checkFormChanges);
                el.addEventListener('change', checkFormChanges);
            });
        }

        function getFormDataString() {
            // Helper to get string of all input values for comparison
            const inputs = document.querySelectorAll('#witnessForm .form-monitor');
            return Array.from(inputs).map(el => el.value).join('|');
        }

        function checkFormChanges() {
            const btnSave = document.getElementById('btnSave');
            const currentStr = getFormDataString();
            
            // 1. Check if all required fields are filled
            let isComplete = true;
            const requiredIds = ['caseType', 'caseNumber', 'accuser', 'suspect', 'investigator', 'witnessDate', 'dailyReportNo', 'time', 'witnessType', 'firstName', 'lastName', 'idCard', 'zone', 'address', 'phone'];
            
            for(let id of requiredIds) {
                if(!document.getElementById(id).value) {
                    isComplete = false;
                    break;
                }
            }
            
            // Specific check for Title
            const titleSel = document.getElementById('titleSelect').value;
            if(!titleSel) isComplete = false;
            if(titleSel === 'ระบุอื่นๆ' && !document.getElementById('titleOther').value.trim()) isComplete = false;

            // 2. Change Detection (Only for Edit Mode)
            let isChanged = currentState.currentMode === 'add' ? true : (currentStr !== currentState.originalDataStr);

            btnSave.disabled = !(isComplete && isChanged);
        }

        async function saveData() {
            const payload = preparePayload();
            showLoading(currentState.currentMode === 'add' ? 'กำลังบันทึกข้อมูลและสร้างเอกสาร...' : 'กำลังบันทึกและสร้างเอกสารใหม่...');
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if(result.status === 'success') {
                    // Update Local SessionStorage
                    const newRow = { 
                        ...payload.sheetData, 
                        'ไฟล์เอกสาร': result.docUrl, 
                        'ID': result.id,
                        '_fullName': `${payload.sheetData['คำนำหน้าชื่อพยาน']}${payload.sheetData['ชื่อพยาน']} ${payload.sheetData['นามสกุลพยาน']}`,
                        '_thaiDate': payload.data['<<วันที่ไทย>>']
                    };

                    if(currentState.currentMode === 'add') {
                        currentState.dataList.push(newRow); // Added to end (will reverse on render)
                    } else {
                        const index = currentState.dataList.findIndex(r => String(r.ID) === String(payload.ID));
                        if(index > -1) currentState.dataList[index] = newRow;
                    }
                    
                    sessionStorage.setItem('witnessData', JSON.stringify(currentState.dataList));
                    
                    Swal.fire({
                        icon: 'success',
                        title: currentState.currentMode === 'add' ? 'บันทึกข้อมูลสำเร็จ' : 'อัพเดทข้อมูลและสร้างเอกสารสำเร็จ',
                        showConfirmButton: false,
                        timer: 1500
                    });
                    
                    closeModal();
                    executeSearch(); // Refresh Table
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error(error);
                Swal.fire({
                    icon: 'error',
                    title: 'เกิดข้อผิดพลาด',
                    text: 'การสื่อสารขัดข้อง โปรดลองใหม่อีกครั้ง'
                });
            } finally {
                hideLoading();
            }
        }

        function deleteData() {
            Swal.fire({
                title: 'คุณต้องการลบข้อมูลนี้ใช่หรือไม่?',
                text: "ข้อมูลและไฟล์เอกสารจะถูกลบอย่างถาวร",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e11d48',
                cancelButtonColor: '#f1f5f9',
                confirmButtonText: 'ลบข้อมูล',
                cancelButtonText: '<span style="color:#0f172a">ยกเลิก</span>',
                reverseButtons: true
            }).then(async (result) => {
                if (result.isConfirmed) {
                    showLoading('กำลังลบข้อมูล...');
                    const id = document.getElementById('editId').value;
                    const docUrl = document.getElementById('editDocUrl').value;
                    
                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'deleteWitness',
                                ID: id,
                                docUrl: docUrl
                            })
                        });
                        
                        const res = await response.json();
                        
                        if(res.status === 'success') {
                            // Remove from local array
                            currentState.dataList = currentState.dataList.filter(r => String(r.ID) !== String(id));
                            sessionStorage.setItem('witnessData', JSON.stringify(currentState.dataList));
                            
                            Swal.fire({
                                icon: 'success',
                                title: 'ลบข้อมูลสำเร็จ',
                                showConfirmButton: false,
                                timer: 1500
                            });
                            
                            closeModal();
                            executeSearch(); // Refresh Table
                        } else {
                            throw new Error(res.message);
                        }
                    } catch(error) {
                        console.error(error);
                        Swal.fire({
                            icon: 'error',
                            title: 'เกิดข้อผิดพลาด',
                            text: 'ไม่สามารถลบข้อมูลได้ โปรดลองใหม่อีกครั้ง'
                        });
                    } finally {
                        hideLoading();
                    }
                }
            });
        }

        // ==========================================================================
        // Utility Functions
        // ==========================================================================
        function convertIsoToThai(isoDateStr) {
            if(!isoDateStr) return '-';
            // input like 2024-05-20
            const parts = isoDateStr.split('-');
            if(parts.length !== 3) return isoDateStr;
            const year = parseInt(parts[0]) + 543;
            const month = thaiMonths[parseInt(parts[1]) - 1];
            const day = parseInt(parts[2]);
            return `${day} ${month} ${year}`;
        }
