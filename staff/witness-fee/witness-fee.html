<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เบิกค่าตอบแทนพยาน</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>

    <!-- Core Scripts & Styles -->
    <script src="../auth.js"></script>
    <link rel="stylesheet" href="../../theme.css"> <!-- ปรับ Path ตามโครงสร้างจริง -->
    <script src="../../datepicker.js"></script>

    <style>
        /* ==========================================================================
           ✨ Custom Styles สำหรับหน้าเบิกค่าตอบแทนพยาน
           ========================================================================== */
        
        /* --- Layout & Table --- */
        body { overflow: hidden; } /* ป้องกัน Scrollbar นอกสุด */
        .main-wrapper { height: calc(100vh - 75px); padding: 20px; display: flex; flex-direction: column; }
        
        .table-container {
            flex: 1; display: flex; flex-direction: column;
            background: var(--card-bg); border-radius: var(--radius-xl);
            box-shadow: var(--shadow-soft); overflow: hidden;
        }
        
        .table-header-row {
            display: grid; grid-template-columns: 50px 150px 100px 120px 1.5fr 1.5fr 1.5fr 80px;
            background: #f8fafc; padding: 15px; font-weight: 600; color: var(--text-light);
            border-bottom: 1px solid #e2e8f0; text-align: left; font-size: 0.95rem;
        }
        
        .table-body-wrapper {
            flex: 1; position: relative; overflow: hidden; background: #fff;
        }
        
        .table-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.5s ease;
            will-change: transform, opacity; /* Hardware Acceleration */
        }
        
        .table-row {
            flex: 1; /* แบ่งความสูงเท่าๆ กัน */
            display: grid; grid-template-columns: 50px 150px 100px 120px 1.5fr 1.5fr 1.5fr 80px;
            padding: 0 15px; align-items: center; border-bottom: 1px solid #f1f5f9;
            font-size: 0.95rem; color: var(--text-main); transition: background 0.2s;
        }
        .table-row:hover { background: #f8fafc; }
        .table-row:last-child { border-bottom: none; }
        
        .col-ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
        
        /* --- Footer Controls --- */
        .table-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: #fff; border-top: 1px solid #e2e8f0;
        }
        
        .search-box { display: flex; align-items: center; background: #f1f5f9; border-radius: 50px; padding: 5px 15px; width: 250px; }
        .search-box input { border: none; background: transparent; outline: none; font-family: 'Kanit'; width: 100%; padding: 5px; }
        .search-btn { background: transparent; border: none; color: var(--text-light); cursor: pointer; font-size: 1.1rem; transition: 0.3s; }
        .search-btn:hover { color: var(--navy-main); transform: scale(1.1); }
        
        .add-btn-center {
            background: var(--navy-gradient); color: white; border: none;
            width: 45px; height: 45px; border-radius: 50%; font-size: 1.2rem;
            cursor: pointer; box-shadow: 0 4px 15px rgba(30, 58, 138, 0.2);
            transition: var(--transition); display: flex; align-items: center; justify-content: center;
        }
        .add-btn-center:hover { transform: translateY(-3px) scale(1.05); box-shadow: var(--shadow-gold); }
        
        .pagination-controls { display: flex; align-items: center; gap: 15px; color: var(--text-light); font-weight: 500; }
        .page-btn {
            background: #f1f5f9; border: none; width: 35px; height: 35px; border-radius: 50%;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .page-btn:hover:not(:disabled) { background: var(--navy-main); color: white; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- Modal & Tabs --- */
        .modal-card { height: 85vh; max-height: 700px; display: flex; flex-direction: column; }
        .modal-header { padding: 20px 30px 0; border-bottom: 1px solid #e2e8f0; position: relative; }
        .modal-title-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-title-area h3 { font-size: 1.3rem; color: var(--navy-main); margin: 0; }
        
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn-delete-record {
            background: #fff1f2; color: var(--danger); border: none; width: 36px; height: 36px;
            border-radius: 50%; cursor: pointer; transition: 0.3s; display: none;
        }
        .btn-delete-record:hover { background: var(--danger); color: white; transform: scale(1.1); }
        
        .tabs-container { display: flex; position: relative; gap: 20px; }
        .tab-btn {
            background: transparent; border: none; font-family: 'Kanit'; font-size: 1.05rem;
            color: var(--text-light); padding: 10px 5px; cursor: pointer; transition: 0.3s; font-weight: 500;
        }
        .tab-btn.active { color: var(--navy-main); }
        .tab-indicator {
            position: absolute; bottom: -1px; left: 0; height: 3px; background: var(--gold-main);
            border-radius: 3px 3px 0 0; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            will-change: left, width;
        }
        
        .modal-body { flex: 1; overflow-y: auto; padding: 30px; background: #f8fafc; }
        .tab-content { display: none; animation: fadeUp 0.4s ease; }
        .tab-content.active { display: block; }
        
        .modal-footer { padding: 20px 30px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; }
        
        /* --- Form Grid --- */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; position: relative; }
        
        /* Responsive Grid */
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; gap: 15px; }
            .table-header-row, .table-row {
                grid-template-columns: 50px 120px 100px 120px 150px 150px 150px 60px;
                width: max-content; /* บังคับให้ตารางเลื่อนแนวนอนได้ในมือถือ */
            }
            .table-body-wrapper { overflow-x: auto; }
            .table-page { width: max-content; min-width: 100%; }
        }

        /* --- Autocomplete Dropdown --- */
        .autocomplete-list {
            position: absolute; top: 100%; left: 0; right: 0; background: #fff;
            border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: var(--shadow-modal);
            max-height: 200px; overflow-y: auto; z-index: 100; display: none; margin-top: 5px;
        }
        .autocomplete-item { padding: 10px 15px; cursor: pointer; transition: 0.2s; border-bottom: 1px solid #f1f5f9; }
        .autocomplete-item:hover { background: #f8fafc; color: var(--navy-main); }
        
        /* --- Loading Overlay --- */
        .full-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="full-loader">
        <div class="premium-loader"></div>
        <div class="premium-loader-text" id="loadingText" style="margin-top: 15px;">กำลังโหลดข้อมูล...</div>
    </div>

    <!-- Navbar -->
    <nav>
        <div class="nav-left">
            <a href="../staff.html" class="nav-btn btn-back">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <span class="page-title">เบิกค่าตอบแทนพยาน</span>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-wrapper container">
        <div class="table-container">
            <div class="table-header-row">
                <div></div> <!-- Edit Icon -->
                <div>วันที่สอบปากคำ</div>
                <div>คดี</div>
                <div>เลขคดี</div>
                <div>ชื่อพยาน</div>
                <div>ชื่อผู้ต้องหา</div>
                <div>พนักงานสอบสวน</div>
                <div style="text-align: center;">เอกสาร</div>
            </div>
            
            <div class="table-body-wrapper" id="tableBodyWrapper">
                <!-- Pages will be injected here -->
            </div>
            
            <div class="table-footer">
                <div class="search-box">
                    <button class="search-btn" onclick="executeSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <input type="text" id="searchInput" placeholder="ค้นหาข้อมูล..." onkeypress="if(event.key === 'Enter') executeSearch()">
                </div>
                
                <button class="add-btn-center" onclick="openModal()"><i class="fa-solid fa-plus"></i></button>
                
                <div class="pagination-controls">
                    <span id="pageInfo">1/1</span>
                    <button class="page-btn" id="prevBtn" onclick="changePage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                    <button class="page-btn" id="nextBtn" onclick="changePage(1)"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Form Modal -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title-area">
                    <h3 id="modalTitle">เพิ่มข้อมูลใหม่</h3>
                    <div class="header-actions">
                        <button class="btn-delete-record" id="btnDelete" onclick="deleteRecord()" data-tooltip="ลบข้อมูล" class="tooltip-left"><i class="fa-solid fa-trash-can"></i></button>
                        <button class="close-modal-btn" onclick="closeModal()" style="position: static;"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
                <div class="tabs-container">
                    <button class="tab-btn active" onclick="switchTab(1, this)">ข้อมูลคดี</button>
                    <button class="tab-btn" onclick="switchTab(2, this)">ข้อมูลพยาน</button>
                    <div class="tab-indicator" id="tabIndicator"></div>
                </div>
            </div>
            
            <div class="modal-body" id="modalBody">
                <!-- Tab 1: ข้อมูลคดี -->
                <div class="tab-content active" id="tab1">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">ประเภทคดี</label>
                            <select class="form-input" id="f_caseType" onchange="checkFormChanges()">
                                <option value="" disabled selected>เลือกประเภทคดี</option>
                                <option value="อาญา">อาญา</option>
                                <option value="จราจร">จราจร</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">เลขคดี</label>
                            <input type="text" class="form-input" id="f_caseNo" placeholder="XX/25XX" oninput="checkFormChanges()">
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label class="form-label">ชื่อผู้กล่าวหา</label>
                        <input type="text" class="form-input" id="f_accuser" placeholder="ระบุชื่อผู้กล่าวหา" autocomplete="off" oninput="handleAutocomplete(this, 'accuser'); checkFormChanges()" onfocus="handleAutocomplete(this, 'accuser')">
                        <div class="autocomplete-list" id="list_accuser"></div>
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label class="form-label">ชื่อผู้ต้องหา</label>
                        <input type="text" class="form-input" id="f_suspect" placeholder="ระบุชื่อผู้ต้องหา" autocomplete="off" oninput="handleAutocomplete(this, 'suspect'); checkFormChanges()" onfocus="handleAutocomplete(this, 'suspect')">
                        <div class="autocomplete-list" id="list_suspect"></div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">พนักงานสอบสวน</label>
                            <select class="form-input" id="f_investigator" onchange="checkFormChanges()">
                                <option value="" disabled selected>เลือกพนักงานสอบสวน</option>
                                <!-- Options injected via JS -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">วันที่สอบปากคำพยาน</label>
                            <input type="text" class="form-input datepicker" id="f_date" placeholder="เลือกวันที่" onchange="checkFormChanges()">
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">ประจำวันข้อ</label>
                            <input type="number" class="form-input" id="f_dailyNo" placeholder="ระบุตัวเลข" oninput="checkFormChanges()">
                        </div>
                        <div class="form-group">
                            <label class="form-label">เวลา</label>
                            <input type="text" class="form-input" id="f_time" placeholder="XX.XX" oninput="checkFormChanges()">
                        </div>
                    </div>
                </div>
                
                <!-- Tab 2: ข้อมูลพยาน -->
                <div class="tab-content" id="tab2">
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label class="form-label">ประเภทพยาน</label>
                        <select class="form-input" id="f_witnessType" onchange="checkFormChanges()">
                            <option value="" disabled selected>เลือกประเภทพยาน</option>
                            <option value="ตำรวจ">ตำรวจ</option>
                            <option value="ประชาชน">ประชาชน</option>
                        </select>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">คำนำหน้าชื่อ</label>
                            <select class="form-input" id="f_title" onchange="toggleOtherTitle(); checkFormChanges()">
                                <option value="" disabled selected>เลือกคำนำหน้า</option>
                                <option value="นาย">นาย</option>
                                <option value="นาง">นาง</option>
                                <option value="นางสาว">นางสาว</option>
                                <option value="ระบุอื่นๆ">ระบุอื่นๆ</option>
                            </select>
                        </div>
                        <div class="form-group" id="group_otherTitle" style="display: none;">
                            <label class="form-label">ระบุคำนำหน้า</label>
                            <input type="text" class="form-input" id="f_otherTitle" placeholder="พิมพ์คำนำหน้า" oninput="checkFormChanges()">
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">ชื่อ</label>
                            <input type="text" class="form-input" id="f_fname" placeholder="เฉพาะชื่อเท่านั้น" oninput="checkFormChanges()">
                        </div>
                        <div class="form-group">
                            <label class="form-label">นามสกุล</label>
                            <input type="text" class="form-input" id="f_lname" placeholder="เฉพาะนามสกุลเท่านั้น" oninput="checkFormChanges()">
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">เลขประจำตัวประชาชน</label>
                            <input type="text" class="form-input" id="f_idCard" placeholder="ไม่ต้องใส่ขีดระหว่างตัวเลข" oninput="checkFormChanges()">
                        </div>
                        <div class="form-group">
                            <label class="form-label">เขตที่พักอาศัย</label>
                            <select class="form-input" id="f_zone" onchange="checkFormChanges()">
                                <option value="" disabled selected>เลือกเขต</option>
                                <option value="ในเขตจังหวัด">ในเขตจังหวัด</option>
                                <option value="นอกเขตจังหวัด">นอกเขตจังหวัด</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">ที่อยู่พยาน</label>
                            <input type="text" class="form-input" id="f_address" placeholder="ระบุที่อยู่" oninput="checkFormChanges()">
                        </div>
                        <div class="form-group">
                            <label class="form-label">หมายเลขโทรศัพท์</label>
                            <input type="text" class="form-input" id="f_phone" placeholder="ไม่ต้องใส่ขีดระหว่างตัวเลข" oninput="checkFormChanges()">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="modal-footer">
                <button class="btn-secondary" id="btnBack" onclick="navigateTab(-1)" disabled>กลับ</button>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-secondary" id="btnNext" onclick="navigateTab(1)">ต่อไป</button>
                    <button class="btn-primary" id="btnSave" onclick="saveData()" disabled>บันทึก</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================================
        // การตั้งค่าและตัวแปร Global
        // ============================================================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbzpr36ybHzJ_DL5QBR7fGSqsmvwlsdbesy0LyQQq5BgfMqTtQNBQPLw5tDgJoCag-9d/exec';
        
        let allData = []; // ข้อมูลทั้งหมดจาก Sheet
        let filteredData = []; // ข้อมูลที่ผ่านการค้นหา
        let officersData = []; // ข้อมูลเจ้าหน้าที่
        
        const ITEMS_PER_PAGE = 10;
        let currentPage = 1;
        let totalPages = 1;
        
        let currentTab = 1;
        let editModeId = null;
        let initialFormState = ""; // ไว้เช็คว่ามีการแก้ไขฟอร์มหรือไม่
        let editOldDocUrl = "";

        // ============================================================================
        // 1. Initialization
        // ============================================================================
        document.addEventListener('DOMContentLoaded', () => {
            ThaiDatePicker.init('.datepicker');
            initTabIndicator();
            fetchInitialData();
            
            // ปิด Autocomplete เมื่อคลิกที่อื่น
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.form-group')) {
                    document.querySelectorAll('.autocomplete-list').forEach(el => el.style.display = 'none');
                }
            });
        });

        async function fetchInitialData() {
            try {
                const response = await fetch(`${API_URL}?action=getInitialData`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    officersData = result.officers;
                    sessionStorage.setItem('officers', JSON.stringify(officersData));
                    
                    // ข้ามแถว Header (index 0) และกลับด้าน Array ให้ล่าสุดอยู่บน
                    allData = result.witnessFees.slice(1).reverse(); 
                    sessionStorage.setItem('witnessFees', JSON.stringify(allData));
                    
                    populateInvestigatorDropdown();
                    
                    filteredData = [...allData];
                    renderTable();
                    
                    document.getElementById('loadingScreen').style.display = 'none';
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                document.getElementById('loadingScreen').style.display = 'none';
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลได้ โปรดลองใหม่อีกครั้ง', 'error');
            }
        }

        // ============================================================================
        // 2. Table & Pagination Logic
        // ============================================================================
        function renderTable(direction = 0) {
            totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;
            
            const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIdx = startIdx + ITEMS_PER_PAGE;
            const pageData = filteredData.slice(startIdx, endIdx);
            
            const wrapper = document.getElementById('tableBodyWrapper');
            
            // สร้าง Page Element ใหม่
            const newPage = document.createElement('div');
            newPage.className = 'table-page';
            
            // กำหนดตำแหน่งเริ่มต้นสำหรับ Animation
            if (direction === 1) newPage.style.transform = 'translateX(100%)';
            else if (direction === -1) newPage.style.transform = 'translateX(-100%)';
            else newPage.style.transform = 'translateX(0)';
            
            if (pageData.length === 0) {
                newPage.innerHTML = `<div style="padding: 30px; text-align: center; color: var(--text-light);">ไม่พบข้อมูล</div>`;
            } else {
                pageData.forEach(row => {
                    // row structure: [0:ประเภทคดี, 1:เลขคดี, 2:ผู้กล่าวหา, 3:ผู้ต้องหา, 4:พงส, 5:วันที่, 6:ประจำวัน, 7:เวลา, 8:ประเภทพยาน, 9:คำนำหน้า, 10:ชื่อ, 11:สกุล, 12:เลขปชช, 13:เขต, 14:ที่อยู่, 15:โทร, 16:URL, 17:ID]
                    const thaiDate = convertToThaiDate(row[5]);
                    const witnessName = `${row[9]}${row[10]} ${row[11]}`;
                    
                    const tr = document.createElement('div');
                    tr.className = 'table-row';
                    tr.innerHTML = `
                        <div><button class="action-btn btn-edit" onclick="editRecord('${row[17]}')"><i class="fa-solid fa-pen"></i></button></div>
                        <div class="col-ellipsis">${thaiDate}</div>
                        <div class="col-ellipsis">${row[0]}</div>
                        <div class="col-ellipsis">${row[1]}</div>
                        <div class="col-ellipsis" title="${witnessName}">${witnessName}</div>
                        <div class="col-ellipsis" title="${row[3]}">${row[3]}</div>
                        <div class="col-ellipsis" title="${row[4]}">${row[4]}</div>
                        <div style="text-align: center;">
                            ${row[16] ? `<a href="${row[16]}" target="_blank" style="color: var(--navy-main); font-size: 1.2rem;"><i class="fa-solid fa-file-lines"></i></a>` : '-'}
                        </div>
                    `;
                    newPage.appendChild(tr);
                });
            }
            
            wrapper.appendChild(newPage);
            
            // Animate
            setTimeout(() => {
                const oldPages = wrapper.querySelectorAll('.table-page:not(:last-child)');
                oldPages.forEach(p => {
                    p.style.transform = direction === 1 ? 'translateX(-100%)' : 'translateX(100%)';
                    p.style.opacity = '0';
                });
                newPage.style.transform = 'translateX(0)';
                
                setTimeout(() => {
                    oldPages.forEach(p => p.remove());
                }, 500); // รอ transition จบ
            }, 10);
            
            // Update Footer
            document.getElementById('pageInfo').innerText = `${currentPage}/${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }

        function changePage(step) {
            const newPage = currentPage + step;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderTable(step);
            }
        }

        function executeSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                filteredData = [...allData];
            } else {
                filteredData = allData.filter(row => {
                    const thaiDate = convertToThaiDate(row[5]);
                    const witnessName = `${row[9]}${row[10]} ${row[11]}`;
                    const searchStr = `${thaiDate} ${row[0]} ${row[1]} ${witnessName} ${row[3]} ${row[4]}`.toLowerCase();
                    return searchStr.includes(query);
                });
            }
            currentPage = 1;
            renderTable(0);
        }

        // ============================================================================
        // 3. Modal & Tab Logic
        // ============================================================================
        function initTabIndicator() {
            const activeTab = document.querySelector('.tab-btn.active');
            updateTabIndicator(activeTab);
        }

        function updateTabIndicator(btn) {
            const indicator = document.getElementById('tabIndicator');
            indicator.style.width = `${btn.offsetWidth}px`;
            indicator.style.left = `${btn.offsetLeft}px`;
        }

        function switchTab(tabIndex, btnElement) {
            currentTab = tabIndex;
            
            // Update Buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) {
                btnElement.classList.add('active');
                updateTabIndicator(btnElement);
            } else {
                const targetBtn = document.querySelectorAll('.tab-btn')[tabIndex - 1];
                targetBtn.classList.add('active');
                updateTabIndicator(targetBtn);
            }
            
            // Update Content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`tab${tabIndex}`).classList.add('active');
            
            // Scroll to top of modal body
            document.getElementById('modalBody').scrollTop = 0;
            
            // Update Footer Buttons
            document.getElementById('btnBack').disabled = (tabIndex === 1);
            document.getElementById('btnNext').disabled = (tabIndex === 2);
        }

        function navigateTab(step) {
            const newTab = currentTab + step;
            if (newTab >= 1 && newTab <= 2) {
                switchTab(newTab);
            }
        }

        function openModal(id = null) {
            editModeId = id;
            clearForm();
            switchTab(1);
            
            const modal = document.getElementById('formModal');
            modal.style.display = 'flex';
            
            if (id) {
                document.getElementById('modalTitle').innerText = 'แก้ไขข้อมูล';
                document.getElementById('btnDelete').style.display = 'block';
                preFillForm(id);
            } else {
                document.getElementById('modalTitle').innerText = 'เพิ่มข้อมูลใหม่';
                document.getElementById('btnDelete').style.display = 'none';
                document.getElementById('btnSave').disabled = true;
            }
            
            // เก็บ State เริ่มต้นไว้เทียบ
            setTimeout(() => { initialFormState = getFormStateString(); }, 100);
        }

        function closeModal() {
            document.getElementById('formModal').style.display = 'none';
        }

        // ============================================================================
        // 4. Form Logic & Autocomplete
        // ============================================================================
        function populateInvestigatorDropdown() {
            const select = document.getElementById('f_investigator');
            // กรองเฉพาะ I (index 8) == "พนักงานสอบสวน"
            const investigators = officersData.slice(1).filter(row => row[8] === 'พนักงานสอบสวน');
            
            investigators.forEach(inv => {
                const option = document.createElement('option');
                option.value = inv[4]; // E ยศ ชื่อ สกุล
                option.text = inv[4];
                select.appendChild(option);
            });
        }

        function handleAutocomplete(inputEl, type) {
            const listEl = document.getElementById(`list_${type}`);
            const query = inputEl.value.toLowerCase();
            
            // ดึงประวัติที่ไม่ซ้ำจาก allData (ผู้กล่าวหา index 2, ผู้ต้องหา index 3)
            const colIndex = type === 'accuser' ? 2 : 3;
            const history = [...new Set(allData.map(row => row[colIndex]).filter(val => val))];
            
            const matches = history.filter(val => val.toLowerCase().includes(query));
            
            listEl.innerHTML = '';
            if (matches.length > 0) {
                matches.forEach(match => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    div.innerText = match;
                    div.onclick = () => {
                        inputEl.value = match;
                        listEl.style.display = 'none';
                        checkFormChanges();
                    };
                    listEl.appendChild(div);
                });
                listEl.style.display = 'block';
            } else {
                listEl.style.display = 'none';
            }
        }

        function toggleOtherTitle() {
            const title = document.getElementById('f_title').value;
            const otherGroup = document.getElementById('group_otherTitle');
            if (title === 'ระบุอื่นๆ') {
                otherGroup.style.display = 'flex';
            } else {
                otherGroup.style.display = 'none';
                document.getElementById('f_otherTitle').value = '';
            }
        }

        function clearForm() {
            document.querySelectorAll('.form-input').forEach(el => {
                if (el.tagName === 'SELECT') el.selectedIndex = 0;
                else el.value = '';
            });
            ThaiDatePicker.clear('f_date');
            toggleOtherTitle();
        }

        function getFormStateString() {
            const values = [];
            document.querySelectorAll('.form-input').forEach(el => values.push(el.value));
            return JSON.stringify(values);
        }

        function checkFormChanges() {
            // ตรวจสอบว่ากรอกครบไหม
            const requiredIds = ['f_caseType', 'f_caseNo', 'f_accuser', 'f_suspect', 'f_investigator', 'f_date', 'f_dailyNo', 'f_time', 'f_witnessType', 'f_title', 'f_fname', 'f_lname', 'f_idCard', 'f_zone', 'f_address', 'f_phone'];
            let isComplete = true;
            
            for (let id of requiredIds) {
                if (!document.getElementById(id).value) {
                    isComplete = false;
                    break;
                }
            }
            
            if (document.getElementById('f_title').value === 'ระบุอื่นๆ' && !document.getElementById('f_otherTitle').value) {
                isComplete = false;
            }

            const btnSave = document.getElementById('btnSave');
            
            if (!isComplete) {
                btnSave.disabled = true;
                return;
            }

            // ถ้าเป็นโหมดแก้ไข ต้องเช็คว่าค่าเปลี่ยนไปจากเดิมไหม
            if (editModeId) {
                const currentState = getFormStateString();
                btnSave.disabled = (currentState === initialFormState);
            } else {
                btnSave.disabled = false;
            }
        }

        // ============================================================================
        // 5. Data Preparation & API Calls
        // ============================================================================
        function showLoading(text) {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingScreen').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingScreen').style.display = 'none';
        }

        function convertToThaiDate(isoString) {
            if (!isoString) return "";
            const date = new Date(isoString);
            if (isNaN(date.getTime())) return isoString; // Fallback
            
            const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            return `${date.getDate()} ${thaiMonths[date.getMonth()]} ${date.getFullYear() + 543}`;
        }

        function getOfficerLookup(duty2) {
            const row = officersData.find(r => r[9] === duty2); // J หน้าที่2
            if (!row) return { rank: '', name: '', pos: '' };
            return { rank: row[0], name: `${row[2]} ${row[3]}`, pos: row[6] };
        }

        async function saveData() {
            showLoading('กำลังบันทึกข้อมูลและสร้างเอกสาร...');
            
            // 1. ดึงค่าจากฟอร์ม
            const titleSelect = document.getElementById('f_title').value;
            const finalTitle = titleSelect === 'ระบุอื่นๆ' ? document.getElementById('f_otherTitle').value : titleSelect;
            const zone = document.getElementById('f_zone').value;
            const invName = document.getElementById('f_investigator').value;
            const isoDate = ThaiDatePicker.getISODate('f_date');
            
            // 2. Lookup ข้อมูลเจ้าหน้าที่
            const invRow = officersData.find(r => r[4] === invName);
            const invRank = invRow ? invRow[0] : '';
            const invFullName = invRow ? `${invRow[2]} ${invRow[3]}` : '';
            const invPos = invRow ? invRow[6] : '';
            
            const headInv = getOfficerLookup('หัวหน้างานสอบสวน');
            const headAdmin = getOfficerLookup('หัวหน้างานอำนวยการ');
            const headStation = getOfficerLookup('หัวหน้าสถานี');
            const finance = getOfficerLookup('เจ้าหน้าที่การเงิน');

            // 3. เตรียม Object สำหรับแทนที่คำในเอกสาร
            const docData = {
                '<<ประเภทคดี>>': document.getElementById('f_caseType').value,
                '<<เลขคดี>>': document.getElementById('f_caseNo').value,
                '<<ชื่อผู้กล่าวหา>>': document.getElementById('f_accuser').value,
                '<<ชื่อผู้ต้องหา>>': document.getElementById('f_suspect').value,
                '<<วันที่ไทย>>': convertToThaiDate(isoDate),
                '<<ประจำวันข้อ>>': document.getElementById('f_dailyNo').value,
                '<<เวลา>>': document.getElementById('f_time').value,
                '<<คำนำหน้า>>': finalTitle,
                '<<ชื่อสกุลพยาน>>': `${document.getElementById('f_fname').value} ${document.getElementById('f_lname').value}`,
                '<<เลขประจำตัวประชาชน>>': document.getElementById('f_idCard').value,
                '<<ที่อยู่พยาน>>': document.getElementById('f_address').value,
                '<<ใน>>': zone === 'ในเขตจังหวัด' ? '(✓)' : '(   )',
                '<<นอก>>': zone === 'นอกเขตจังหวัด' ? '(✓)' : '(   )',
                '<<ค่าตอบแทน>>': zone === 'ในเขตจังหวัด' ? '300' : '600',
                '<<ตัวหนังสือค่าตอบแทน>>': zone === 'ในเขตจังหวัด' ? 'สามร้อยบาทถ้วน' : 'หกร้อยบาทถ้วน',
                
                '<<ยศ พงส>>': invRank,
                '<<ชื่อสกุล พงส>>': invFullName,
                '<<ตำแหน่ง พงส>>': invPos,
                '<<ยศหัวหน้างาน>>': headInv.rank,
                '<<ชื่อสกุลหัวหน้างาน>>': headInv.name,
                '<<ตำแหน่งหัวหน้างาน>>': headInv.pos,
                '<<ยศผู้ตรวจสอบ>>': headAdmin.rank,
                '<<ชื่อสกุลผู้ตรวจสอบ>>': headAdmin.name,
                '<<ตำแหน่งผู้ตรวจสอบ>>': headAdmin.pos,
                '<<ยศผู้อนุมัติ>>': headStation.rank,
                '<<ชื่อสกุลผู้อนุมัติ>>': headStation.name,
                '<<ตำแหน่งผู้อนุมัติ>>': headStation.pos,
                '<<ยศผู้จ่ายเงิน>>': finance.rank,
                '<<ชื่อสกุลผู้จ่ายเงิน>>': finance.name
            };

            // 4. เตรียม Array สำหรับลง Sheet (A-R)
            const id = editModeId || Date.now().toString();
            const rowData = [
                document.getElementById('f_caseType').value,
                document.getElementById('f_caseNo').value,
                document.getElementById('f_accuser').value,
                document.getElementById('f_suspect').value,
                invName,
                isoDate,
                document.getElementById('f_dailyNo').value,
                document.getElementById('f_time').value,
                document.getElementById('f_witnessType').value,
                finalTitle,
                document.getElementById('f_fname').value,
                document.getElementById('f_lname').value,
                document.getElementById('f_idCard').value,
                zone,
                document.getElementById('f_address').value,
                document.getElementById('f_phone').value,
                editOldDocUrl, // จะถูกแทนที่ใน GAS
                id
            ];

            const payload = {
                action: editModeId ? 'updateRecord' : 'createRecord',
                id: id,
                oldDocUrl: editOldDocUrl,
                docData: docData,
                rowData: rowData
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    // อัปเดต URL ที่ได้กลับมา
                    rowData[16] = result.docUrl;
                    
                    // อัปเดต sessionStorage
                    if (editModeId) {
                        const index = allData.findIndex(r => r[17] == id);
                        if (index > -1) allData[index] = rowData;
                    } else {
                        allData.unshift(rowData); // เพิ่มบนสุด
                    }
                    
                    sessionStorage.setItem('witnessFees', JSON.stringify(allData));
                    
                    // รีเฟรชหน้าจอ
                    executeSearch(); 
                    closeModal();
                    hideLoading();
                    
                    Swal.fire({
                        title: editModeId ? 'อัพเดทข้อมูลสำเร็จ' : 'การดำเนินการเสร็จสมบูรณ์',
                        icon: 'success',
                        timer: 1500,
                        showConfirmButton: false
                    });
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                hideLoading();
                Swal.fire('เกิดข้อผิดพลาด', 'โปรดลองใหม่อีกครั้ง', 'error');
            }
        }

        // ============================================================================
        // 6. Edit & Delete Logic
        // ============================================================================
        function editRecord(id) {
            openModal(id);
        }

        function preFillForm(id) {
            const row = allData.find(r => r[17] == id);
            if (!row) return;
            
            editOldDocUrl = row[16];
            
            document.getElementById('f_caseType').value = row[0];
            document.getElementById('f_caseNo').value = row[1];
            document.getElementById('f_accuser').value = row[2];
            document.getElementById('f_suspect').value = row[3];
            document.getElementById('f_investigator').value = row[4];
            ThaiDatePicker.setISODate('f_date', row[5]);
            document.getElementById('f_dailyNo').value = row[6];
            document.getElementById('f_time').value = row[7];
            
            document.getElementById('f_witnessType').value = row[8];
            
            // จัดการคำนำหน้า
            const title = row[9];
            if (['นาย', 'นาง', 'นางสาว'].includes(title)) {
                document.getElementById('f_title').value = title;
            } else {
                document.getElementById('f_title').value = 'ระบุอื่นๆ';
                document.getElementById('f_otherTitle').value = title;
            }
            toggleOtherTitle();
            
            document.getElementById('f_fname').value = row[10];
            document.getElementById('f_lname').value = row[11];
            document.getElementById('f_idCard').value = row[12];
            document.getElementById('f_zone').value = row[13];
            document.getElementById('f_address').value = row[14];
            document.getElementById('f_phone').value = row[15];
            
            checkFormChanges();
        }

        function deleteRecord() {
            Swal.fire({
                title: 'ยืนยันการลบข้อมูล',
                text: 'คุณต้องการลบข้อมูลนี้ใช่หรือไม่?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'ลบข้อมูล',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: 'var(--danger)',
                reverseButtons: true
            }).then(async (result) => {
                if (result.isConfirmed) {
                    showLoading('กำลังลบข้อมูล...');
                    
                    try {
                        const payload = {
                            action: 'deleteRecord',
                            id: editModeId,
                            docUrl: editOldDocUrl
                        };
                        
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        });
                        const resJson = await response.json();
                        
                        if (resJson.status === 'success') {
                            // ลบออกจาก sessionStorage
                            allData = allData.filter(r => r[17] != editModeId);
                            sessionStorage.setItem('witnessFees', JSON.stringify(allData));
                            
                            executeSearch();
                            closeModal();
                            hideLoading();
                            
                            Swal.fire({
                                title: 'ลบข้อมูลสำเร็จ',
                                icon: 'success',
                                timer: 1500,
                                showConfirmButton: false
                            });
                        } else {
                            throw new Error(resJson.message);
                        }
                    } catch (error) {
                        hideLoading();
                        Swal.fire('เกิดข้อผิดพลาด', 'โปรดลองใหม่อีกครั้ง', 'error');
                    }
                }
            });
        }
    </script>
</body>
</html>
