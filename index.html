<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="ระบบงานสอบสวน สภ.พระธาตุช่อแฮ อำนวยความสะดวกประชาชน">
    <title>งานสอบสวน สภ.พระธาตุช่อแฮ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="theme.css">
</head>
<body>

    <main class="layout-main-wrapper">
        <div class="layout-content-wrapper">
            
            <header class="hero-header-section">
                <div class="hero-title-group">
                    <h1>งานสอบสวน</h1>
                    <h1>สภ.พระธาตุช่อแฮ</h1>
                </div>
                <p class="hero-subtitle">ระบบบริหารจัดการงานสอบสวนแบบบูรณาการ<br>ยกระดับประสิทธิภาพการปฏิบัติงานและการให้บริการประชาชน</p>
            </header>

            <section class="responsive-card-grid">
                <a href="staff.html" class="card theme-blue">
                    <div class="icon-box"><i class="fa-solid fa-user-shield"></i></div>
                    <div>
                        <h3>สำหรับเจ้าหน้าที่งานสอบสวน</h3>
                        <p>ระบบจัดการและอำนวยความสะดวก<br>สำหรับเจ้าหน้าที่งานสอบสวน</p>
                    </div>
                </a>

                <button class="card theme-orange" onclick="showDevPopup('สำหรับเจ้าหน้าที่งานอื่นๆ')">
                    <div class="icon-box"><i class="fa-solid fa-users-gear"></i></div>
                    <div>
                        <h3>สำหรับเจ้าหน้าที่งานอื่นๆ</h3>
                        <p>ระบบอำนวยความสะดวก<br>สำหรับสายงานอื่นๆ ในสถานี</p>
                    </div>
                </button>
                
                <button class="card theme-green" onclick="showDevPopup('ตารางเวรงานสอบสวน')">
                    <div class="icon-box"><i class="fa-solid fa-calendar-days"></i></div>
                    <div>
                        <h3>ตารางเวรงานสอบสวน</h3>
                        <p>พนักงานสอบสวนและ<br>เจ้าหน้าที่เวรสอบสวน</p>
                    </div>
                </button>
                
                <button class="card theme-red" onclick="showDevPopup('รายงานผลการปฏิบัติ')">
                    <div class="icon-box"><i class="fa-solid fa-clipboard-list"></i></div>
                    <div>
                        <h3>รายงานผลการปฏิบัติ</h3>
                        <p>สรุปผลการปฏิบัติงานรายวัน<br>และสถิติคดี</p>
                    </div>
                </button>

                <button class="card theme-purple" onclick="showDevPopup('คำสั่ง ระเบียบ กฎหมาย')">
                    <div class="icon-box"><i class="fa-solid fa-scale-balanced"></i></div>
                    <div>
                        <h3>คำสั่ง ระเบียบ กฎหมาย</h3>
                        <p>รวบรวมข้อกฎหมายและ<br>ระเบียบปฏิบัติที่เกี่ยวข้อง</p>
                    </div>
                </button>

                <button class="card theme-dark" onclick="showDevPopup('อื่นๆ')">
                    <div class="icon-box"><i class="fa-solid fa-layer-group"></i></div>
                    <div>
                        <h3>อื่นๆ</h3>
                        <p>ระบบและเครื่องมือเพิ่มเติม<br>ที่อยู่ระหว่างการพัฒนา</p>
                    </div>
                </button>
            </section>
            
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; <span id="currentYear"></span> พัฒนาโดย พ.ต.ท.อมร ขว้างแป้น</p>
        <p>ระบบสารสนเทศเพื่อสนับสนุนและเพิ่มประสิทธิภาพการปฏิบัติงาน</p>
    </footer>

    <script>
        document.getElementById('currentYear').innerText = new Date().getFullYear();

        function showDevPopup(menuName) {
            Swal.fire({ 
                icon: 'info', 
                title: menuName, 
                text: 'ระบบส่วนนี้อยู่ระหว่างการพัฒนา', 
                confirmButtonText: 'ตกลง'
            });
        }
    </script>
</body>
</html>
