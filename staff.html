<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบสำหรับเจ้าหน้าที่</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="auth.js"></script>
    <style>
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        :root { --bg-color: #f4f7f6; --card-bg: #ffffff; --text-main: #1a1a1a; --text-light: #555555; --header-gradient: linear-gradient(135deg, #c0392b 0%, #8e44ad 50%, #2c3e50 100%); --shadow-soft: 0 10px 40px -10px rgba(0,0,0,0.08); --shadow-hover: 0 20px 50px -10px rgba(0,0,0,0.15); --radius-xl: 24px; --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Kanit', sans-serif; background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; -webkit-font-smoothing: antialiased; }
        nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 0px rgba(0,0,0,0.05); }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .nav-right { display: flex; align-items: center; gap: 10px; }
        .back-btn { font-size: 1.2rem; color: var(--text-main); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: var(--transition); text-decoration: none; }
        .back-btn:hover { background: #f0f2f5; transform: translateX(-3px); }
        .page-title { font-weight: 600; font-size: 1.2rem; background: var(--header-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .settings-btn { background: none; border: none; font-size: 1.2rem; color: var(--text-light); cursor: pointer; padding: 8px; border-radius: 50%; transition: var(--transition); }
        .settings-btn:hover { background: #f0f2f5; color: #8e44ad; transform: rotate(90deg); }
        .logout-btn { background: #ffebee; border: none; font-size: 1rem; color: #c0392b; cursor: pointer; padding: 8px 15px; border-radius: 50px; transition: var(--transition); font-family: 'Kanit'; font-weight: 500; }
        .logout-btn:hover { background: #c0392b; color: white; }
        .container { padding: 30px 20px; max-width: 800px; margin: 0 auto; animation: fadeUp 0.6s forwards; }
        .section-label { font-size: 1rem; color: var(--text-light); margin-bottom: 20px; font-weight: 500; }
        .menu-card { background: var(--card-bg); border-radius: var(--radius-xl); padding: 25px; display: flex; align-items: center; box-shadow: var(--shadow-soft); cursor: pointer; transition: var(--transition); border: 1px solid rgba(255,255,255,0.8); margin-bottom: 20px; text-decoration: none; color: inherit; }
        .menu-card:focus { outline: 3px solid #8e44ad; outline-offset: 2px; }
        .menu-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); }
        .menu-icon { width: 60px; height: 60px; background: #f0f2f5; color: #2c3e50; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-right: 20px; transition: var(--transition); }
        .menu-icon.icon-red { color: #c0392b; background-color: #ffebee; }
        .menu-card:hover .menu-icon { background: var(--header-gradient); color: white; transform: scale(1.1) rotate(5deg); }
        .menu-info h3 { font-size: 1.2rem; margin-bottom: 5px; font-weight: 600; }
        .menu-info p { font-size: 0.9rem; color: var(--text-light); }
        .menu-arrow { margin-left: auto; color: #dfe6e9; transition: var(--transition); }
        .menu-card:hover .menu-arrow { color: #8e44ad; transform: translateX(5px); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); z-index: 999; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 90%; max-width: 400px; border-radius: var(--radius-xl); padding: 30px; box-shadow: var(--shadow-hover); animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #f0f0f0; padding-bottom: 15px; }
        .modal-header h3 { font-size: 1.3rem; font-weight: 600; background: var(--header-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .close-modal { background: none; border: none; font-size: 1.2rem; color: #b2bec3; cursor: pointer; transition: 0.2s; }
        .close-modal:hover { color: #d63031; transform: scale(1.1); }
        .menu-link { display: flex; align-items: center; padding: 15px; background: #f8f9fa; border-radius: 16px; margin-bottom: 12px; text-decoration: none; color: var(--text-main); transition: var(--transition); border: 1px solid transparent; }
        .menu-link:hover { background: #fff; transform: translateX(5px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-color: #eee; }
        .menu-link i { width: 35px; color: #8e44ad; font-size: 1.2rem; text-align: center; }
        @keyframes popUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
            <span class="page-title">ระบบสำหรับเจ้าหน้าที่</span>
        </div>
        <div class="nav-right">
            <button class="settings-btn" id="settingsBtn" onclick="toggleModal(true)" style="display: none;"><i class="fa-solid fa-gear"></i></button>
            <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </nav>

    <div class="container">
        <p class="section-label">เลือกรายการที่ต้องการปฏิบัติ</p>
        <a href="drunk-case.html" class="menu-card" tabindex="0">
            <div class="menu-icon icon-red"><i class="fa-solid fa-wine-bottle"></i></div>
            <div class="menu-info">
                <h3>ฟ้องวาจาเมาขับ</h3>
                <p>สร้างสำนวนฟ้องวาจาขับรถขณะเมาสุรา</p>
            </div>
            <div class="menu-arrow"><i class="fa-solid fa-chevron-right"></i></div>
        </a>
    </div>

    <div id="settingsModal" class="modal-overlay" onclick="closeOnOutside(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-gear"></i> ตั้งค่าข้อมูล</h3>
                <button class="close-modal" onclick="toggleModal(false)"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p style="font-size: 0.9rem; color: var(--text-light); margin-bottom: 20px;">เลือกข้อมูลที่ต้องการแก้ไข</p>
            <a href="station-info.html" class="menu-link"><i class="fa-solid fa-building-shield"></i> <span>ข้อมูลสถานีตำรวจ</span></a>
            <a href="officer-info.html" class="menu-link"><i class="fa-solid fa-user-shield"></i> <span>ข้อมูลเจ้าหน้าที่</span></a>
        </div>
    </div>

    <script>
        function toggleModal(show) { 
            const modal = document.getElementById('settingsModal');
            modal.style.display = show ? 'flex' : 'none';
        }
        function closeOnOutside(event) { if (event.target.id === 'settingsModal') toggleModal(false); }
    </script>
</body>
</html>
