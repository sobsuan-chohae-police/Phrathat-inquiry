<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สำหรับเจ้าหน้าที่งานสอบสวน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="theme.css">

    <style>
        .nav-btn { 
            background: #f1f5f9; border: none; font-size: 1.1rem; color: var(--text-light); 
            cursor: pointer; width: 42px; height: 42px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            transition: var(--transition); text-decoration: none;
            flex-shrink: 0; /* ป้องกันปุ่มถูกบีบ */
        }
        .nav-btn i { transition: var(--transition); }
        
        .btn-back {
            background: transparent !important; 
            color: var(--text-main);
            font-size: 1.3rem; 
            width: auto; 
            height: auto;
            padding: 5px 15px 5px 0; 
        }
        .btn-back:hover { color: var(--navy-main); }
        .btn-back:hover i { transform: translateX(-5px) scaleX(1.1); }
        
        /* ✨ 1. ให้กลุ่มฝั่งซ้ายยืดหยุ่นได้ แต่ไม่เกินพื้นที่ของตัวเอง */
        .nav-left {
            flex: 1; 
            min-width: 0; /* เวทมนตร์ของ Flexbox ที่ทำให้ข้อความข้างในตัดคำได้ */
        }
        
        /* ✨ 2. ชื่อหน้าชิดซ้าย ถ้าจอมือถือเล็กมากแล้วชื่อยาว จะมี ... อัตโนมัติ */
        .page-title {
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis; 
            display: block; 
        }
        
        /* ปรับลดขนาดฟอนต์บนมือถือนิดหน่อยให้ดูสวยงาม */
        @media (max-width: 768px) {
            .page-title { font-size: 1.15rem; }
        }
        
        .btn-settings:hover { background: var(--gold-light); color: var(--gold-dark); }
        .btn-settings:hover i { transform: rotate(90deg); }
        
        .btn-logout { color: var(--danger); background: #fff1f2; }
        .btn-logout:hover { background: var(--danger); color: white; }
        .btn-logout:hover i { transform: scale(1.15); }
        
        .section-label { font-size: 1rem; color: var(--text-light); margin-bottom: 20px; font-weight: 500; }
        .menu-card { padding: 25px; display: flex; align-items: center; margin-bottom: 20px; }
        .menu-icon { width: 60px; height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-right: 20px; transition: var(--transition); }
        .menu-info h3 { font-size: 1.2rem; margin-bottom: 5px; font-weight: 600; }
        .menu-info p { font-size: 0.9rem; color: var(--text-light); }
        .menu-arrow { margin-left: auto; color: #cbd5e1; transition: var(--transition); font-size: 1.2rem; }
        .menu-card:hover .menu-arrow { color: var(--gold-dark); transform: translateX(5px); }
        
        .modal-content { padding: 30px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #f1f5f9; padding-bottom: 15px; }
        .modal-header h3 { font-size: 1.3rem; font-weight: 600; background: var(--navy-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .menu-link { display: flex; align-items: center; padding: 15px; background: #f8fafc; border-radius: 16px; margin-bottom: 12px; transition: var(--transition); border: 1px solid transparent; font-weight: 500;}
        .menu-link:hover { background: #fff; transform: translateX(5px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-color: #e2e8f0; color: var(--gold-dark); }
        .menu-link i { width: 35px; color: var(--gold-dark); font-size: 1.2rem; text-align: center; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="index.html" class="nav-btn btn-back tooltip-left" data-tooltip="กลับหน้าหลัก">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <span class="page-title">สำหรับเจ้าหน้าที่งานสอบสวน</span>
        </div>
        
        <div class="nav-right">
            <button class="nav-btn btn-settings tooltip-right" id="settingsBtn" onclick="toggleModal(true)" style="display: none;" data-tooltip="ตั้งค่าระบบ"><i class="fa-solid fa-gear"></i></button>
            <button class="nav-btn btn-logout tooltip-right" onclick="logout()" data-tooltip="ออกจากระบบ"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </nav>

    <div class="container container-sm">
        <p class="section-label">เลือกรายการที่ต้องการปฏิบัติ</p>
        
        <a href="drunk-case.html" class="menu-card theme-red" tabindex="0">
            <div class="menu-icon"><i class="fa-solid fa-wine-bottle"></i></div>
            <div class="menu-info">
                <h3>ฟ้องวาจาเมาขับ</h3>
                <p>สร้างสำนวนฟ้องวาจาขับรถขณะเมาสุรา</p>
            </div>
            <div class="menu-arrow"><i class="fa-solid fa-chevron-right"></i></div>
        </a>
    </div>

    <div id="settingsModal" class="modal-overlay" onclick="closeOnOutside(event)">
        <div class="modal-card modal-padded" style="max-width: 400px; height: auto;">
            <div class="modal-header">
                <h3><i class="fa-solid fa-gear"></i> ตั้งค่าข้อมูล</h3>
                <button class="close-modal-btn" onclick="toggleModal(false)"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p style="font-size: 0.9rem; color: var(--text-light); margin-bottom: 20px;">เลือกข้อมูลที่ต้องการแก้ไข</p>
            <a href="station-info.html" class="menu-link"><i class="fa-solid fa-building-shield"></i> <span>ข้อมูลสถานีตำรวจ</span></a>
            <a href="officer-info.html" class="menu-link"><i class="fa-solid fa-user-shield"></i> <span>ข้อมูลเจ้าหน้าที่</span></a>
        </div>
    </div>

    <script>
        function toggleModal(show) { 
            const modal = document.getElementById('settingsModal');
            modal.style.display = show ? 'flex' : 'none';
        }
        function closeOnOutside(event) { if (event.target.id === 'settingsModal') toggleModal(false); }
    </script>
</body>
</html>
