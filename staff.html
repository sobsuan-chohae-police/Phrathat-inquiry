<script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxFrju7Ml8KoMQ6fEEr7V4Fy-u6bsvBWf8PAeBPqHpoEutHVTigMiJyjpzdbHIJ-zzL/exec';

        document.addEventListener('DOMContentLoaded', () => {
            checkBirthdays();
        });

        // ฟังก์ชันตรวจสอบและแสดงการ์ดวันเกิด (ใช้ Cache ข้อมูลให้โหลดเร็ว แต่ไม่จำการกดปิด)
        async function checkBirthdays() {
            const today = new Date();
            const currentDay = today.getDate();
            const currentMonth = today.getMonth() + 1;
            const currentYear = today.getFullYear();
            const todayStr = `${currentYear}-${currentMonth}-${currentDay}`; // รหัสของวันนี้

            // ชื่อเดือนภาษาไทย
            const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const dateText = `${currentDay} ${thaiMonths[currentMonth - 1]}`;

            let birthdayOfficers = [];

            // เช็คว่า "วันนี้เคยดึงข้อมูลมาเก็บไว้หรือยัง?" (Cache)
            if (localStorage.getItem('hbd_cached_date') === todayStr) {
                // ถ้ามีข้อมูลในเครื่องแล้ว ดึงมาแสดงทันที (เร็ว 0.1 วินาที)
                birthdayOfficers = JSON.parse(localStorage.getItem('hbd_cached_data') || '[]');
                renderHbdCard(birthdayOfficers, dateText);
            } else {
                // ถ้ายังไม่มีข้อมูล ให้วิ่งไปดึงจาก Google Sheets (ทำแค่ครั้งแรกของวัน)
                try {
                    const res = await fetch(API_URL + '?action=getOfficers');
                    const json = await res.json();
                    
                    json.officers.forEach(off => {
                        if (!off[14]) return; 
                        
                        let bDay, bMonth, bYear;
                        const dobStr = String(off[14]);
                        
                        if (dobStr.includes('/')) {
                            const parts = dobStr.split('/');
                            if (parts.length === 3) {
                                bDay = parseInt(parts[0], 10);
                                bMonth = parseInt(parts[1], 10);
                                bYear = parseInt(parts[2], 10);
                            }
                        } else {
                            const dateObj = new Date(dobStr);
                            if (!isNaN(dateObj.getTime())) {
                                bDay = dateObj.getDate();
                                bMonth = dateObj.getMonth() + 1;
                                bYear = dateObj.getFullYear();
                            }
                        }
                        
                        if (bDay === currentDay && bMonth === currentMonth) {
                            birthdayOfficers.push({
                                name: `${off[0]}${off[2]} ${off[3]}`,
                                age: currentYear - bYear
                            });
                        }
                    });

                    // บันทึกข้อมูลลง Cache ในเครื่อง เพื่อใช้ในครั้งต่อไปของวัน
                    localStorage.setItem('hbd_cached_date', todayStr);
                    localStorage.setItem('hbd_cached_data', JSON.stringify(birthdayOfficers));

                    // แสดงการ์ด
                    renderHbdCard(birthdayOfficers, dateText);

                } catch (error) {
                    console.error('ไม่สามารถโหลดข้อมูลวันเกิดได้:', error);
                }
            }
        }

        // ฟังก์ชันสำหรับวาดการ์ดขึ้นหน้าจอ
        function renderHbdCard(birthdayOfficers, dateText) {
            if (birthdayOfficers.length === 0) return;

            const namesWithAge = birthdayOfficers.map(p => `<span class="hbd-name">${p.name} (อายุครบ ${p.age} ปี)</span>`).join(' และ ');
            
            const hbdHtml = `
                <div class="hbd-card">
                    <button class="hbd-close-btn" onclick="closeHbdCard()"><i class="fa-solid fa-xmark"></i></button>
                    <div class="hbd-icon">🎂</div>
                    <div class="hbd-content">
                        <h3>สุขสันต์วันคล้ายวันเกิด (${dateText})</h3>
                        <p>ขออวยพรให้ ${namesWithAge} มีความสุข ความเจริญ และมีสุขภาพร่างกายที่แข็งแรง</p>
                    </div>
                </div>
            `;
            
            const wrapper = document.getElementById('hbdFloatingWrapper');
            wrapper.innerHTML = hbdHtml;
            wrapper.style.display = 'block';
        }

        // ฟังก์ชันปิดการ์ดวันเกิด (ปิดแล้วปิดเลยในรอบนั้น แต่ถ้ารีเฟรชหน้าเว็บใหม่ก็จะกลับมา)
        function closeHbdCard() {
            const wrapper = document.getElementById('hbdFloatingWrapper');
            wrapper.style.animation = 'slideUpFade 0.4s reverse forwards';
            setTimeout(() => {
                wrapper.style.display = 'none';
            }, 400);
        }

        function toggleModal(show) { 
            const modal = document.getElementById('settingsModal');
            modal.style.display = show ? 'flex' : 'none';
        }
        function closeOnOutside(event) { if (event.target.id === 'settingsModal') toggleModal(false); }
    </script>
