<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - สภ.พระธาตุช่อแฮ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="auth.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- ดึงไฟล์ Theme CSS กลางมาใช้ -->
    <link rel="stylesheet" href="theme.css">

    <style>
        /* CSS เฉพาะหน้า Login */
        body { justify-content: center; align-items: center; }
        .login-card { padding: 50px 40px; width: 90%; max-width: 420px; text-align: center; }
        .login-card h2 { color: var(--text-main); margin-bottom: 10px; font-weight: 600; font-size: 1.8rem; }
        .back-link { display: inline-block; margin-top: 30px; color: var(--text-light); font-size: 0.95rem; transition: var(--transition); }
        .back-link:hover { color: var(--primary); transform: translateX(-5px); }
        .google-btn-wrapper { display: flex; justify-content: center; margin-top: 30px; min-height: 44px; }
        #loadingText { color: var(--primary); font-weight: 500; display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card login-card">
        <h2>เข้าสู่ระบบ</h2>
        <p style="color: var(--text-light); margin-bottom: 10px;">ระบบสำหรับเจ้าหน้าที่งานสอบสวน</p>
        
        <!-- Client ID ของคุณ -->
        <div id="g_id_onload"
             data-client_id="298931412406-s91ak2nnd6hng8a225r1mkajq37m6hal.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="google-btn-wrapper">
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
        </div>

        <div id="loadingText"><i class="fa-solid fa-circle-notch loading-spinner"></i> กำลังตรวจสอบสิทธิ์...</div>

        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก</a>
    </div>

    <script>
        // URL Web App ของคุณ
        const AUTH_API_URL = 'https://script.google.com/macros/s/AKfycbxFrju7Ml8KoMQ6fEEr7V4Fy-u6bsvBWf8PAeBPqHpoEutHVTigMiJyjpzdbHIJ-zzL/exec';

        async function handleCredentialResponse(response) {
            const token = response.credential; 
            document.querySelector('.g_id_signin').style.display = 'none';
            document.getElementById('loadingText').style.display = 'block';

            try {
                const res = await fetch(AUTH_API_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'verifyUser', token: token })
                });
                const result = await res.json();
                
                if (result.status === 'success') {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userEmail', result.email);
                    localStorage.setItem('userRole', result.role);
                    
                    Swal.fire({ icon: 'success', title: 'เข้าสู่ระบบสำเร็จ', timer: 1500, showConfirmButton: false })
                    .then(() => { window.location.href = 'staff.html'; });
                } else {
                    Swal.fire('ปฏิเสธการเข้าถึง', result.message, 'error');
                    document.querySelector('.g_id_signin').style.display = 'block';
                    document.getElementById('loadingText').style.display = 'none';
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
                document.querySelector('.g_id_signin').style.display = 'block';
                document.getElementById('loadingText').style.display = 'none';
            }
        }
    </script>
</body>
</html>
